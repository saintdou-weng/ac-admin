 ['憂鬱的科學','The dismal science','經濟學的一個綽號。','英國作家卡萊爾（Thomas Carlyle）在 1849 年創造的詞。常有人說是因為馬爾薩斯的悲觀預言，但其實卡萊爾是在一篇支持奴隸制度的文章裡，攻擊主張廢奴、相信人人自由平等的經濟學家。'],
 ['資本主義','Capitalism','生產工具主要由私人擁有，透過市場競爭來分配資源的經濟制度。','capital 來自拉丁文 caput「頭」，古代以牲畜的「頭數」計算財產。「資本主義」這個詞在 19 世紀中期才開始普遍使用，馬克思的著作讓它流行起來。'],
 ['自由放任','Laissez-faire','主張政府盡量不干預經濟活動的思想。','法文，意思是「讓他們去做」。相傳 17 世紀法國財政大臣問商人：「政府能幫你們什麼？」商人回答：「讓我們自己做就好。」']],
q:[['被稱為「經濟學之父」、在 1776 年出版《國富論》的是？',['馬克思','亞當斯密','凱因斯','馬歇爾'],1,'亞當斯密在 1776 年出版《國富論》，標誌著現代經濟學的誕生。'],
 ['重商主義認為國家的財富來自？',['農業','金銀的累積','勞動','科技'],1,'重商主義把財富等同於金銀，所以主張多出口、少進口。'],
 ['在「不景氣時政府是否該大量花錢」的辯論中，反對政府過度介入的代表人物是？',['凱因斯','海耶克','卡恩','菲利浦'],1,'海耶克認為政府干預會扭曲市場，並警告政府權力膨脹的危險。']]});

LS.push({id:'l29',u:4,t:'像經濟學家一樣思考',s:'畢業前的最後一課：帶走一套思考工具',min:14,body:`
<p>恭喜你走到最後一課！經濟學最有價值的，不是記住多少名詞，而是學會一套<b>看世界的方法</b>。這一課幫你把工具整理起來。</p>
<h2>工具一：模型是地圖，不是風景</h2>
<p>供需圖、AD-AS、PPF 都是<b>模型</b>，它們刻意簡化了真實世界。就像捷運路線圖不會畫出每一棟房子，但能幫你找到路。好的模型不是「完全像真的」，而是能幫你<b>抓住重點、做出預測</b>。</p>
<h2>工具二：其他條件不變</h2>
<p>真實世界裡很多事情同時在變。經濟學家的做法是：一次只動一個變數，其他先固定住，看它單獨的影響。這就是 <i>ceteris paribus</i>。</p>
<h2>工具三：相關不等於因果</h2>
<div class="box story"><b class="h">🍦 冰淇淋會害人溺水？</b>資料顯示：冰淇淋賣得越多的月份，溺水的人也越多。所以冰淇淋會害人溺水嗎？當然不是！真正的原因是<b>夏天</b>：天氣熱，大家吃冰也去游泳。兩件事一起變動（相關），不代表其中一件造成另一件（因果）。</div>
<p>經濟學家花很多力氣分辨因果，例如用「隨機對照實驗」或尋找「自然實驗」。2019 年諾貝爾獎就頒給了在開發中國家用隨機實驗研究如何減少貧窮的學者。</p>
<h2>工具四：實證 vs. 規範</h2>
<ul><li><b>實證</b>陳述：描述「是什麼」，可以用資料驗證。例如「提高菸稅會讓吸菸人數減少」。</li>
<li><b>規範</b>陳述：主張「應該怎樣」，牽涉價值判斷。例如「政府應該提高菸稅」。</li></ul>
<p>經濟學家常常在實證問題上意見接近，在規範問題上吵翻天，因為每個人重視的價值不同（效率、公平、自由……）。</p>
<h2>工具五：看見「看不見的」</h2>
<div class="box story"><b class="h">🪟 破窗謬誤</b>一個小孩打破麵包店的窗戶。有人說：「這也不錯啊！老闆要花錢修窗，玻璃店就有生意了，經濟被帶動了！」<br>法國經濟學家巴斯夏在 1850 年指出這個錯誤：你只看到了玻璃店的生意（看得見的），卻沒看到老闆本來可以用這筆錢買一雙新鞋（看不見的）。破壞不會創造財富，只是把錢從一個用途轉到另一個用途，而且還少了一扇窗。</div>
<h2>總整理：經濟學家的十句口頭禪</h2>
<ol><li>天下沒有白吃的午餐（機會成本）</li><li>沉沒成本不是成本</li><li>人會對誘因做出反應</li><li>想一想「多一單位」會怎樣（邊際）</li><li>交易能讓雙方都更好（比較利益）</li><li>價格是訊號，傳遞稀少的資訊（供需）</li><li>市場通常有效率，但也會失靈（外部性、公共財）</li><li>錢印太多，物價就會上漲（通膨）</li><li>短期內，通膨和失業常有取捨（菲利浦曲線）</li><li>要看到「看不見的」（破窗謬誤）</li></ol>
<div class="key"><b class="h">🎓 接下來可以去哪裡？</b>想繼續深入，可以讀曼昆（Mankiw）的《經濟學原理》這本全世界最暢銷的入門教科書；想輕鬆一點，可以讀《蘋果橘子經濟學》或塞勒的《推力》。也可以每天看新聞時，試著用這本筆記本的工具分析一則經濟新聞。到那時，你就真的開始像經濟學家一樣思考了。</div>`,
terms:[['模型','Model','對真實世界的簡化描述，用來理解和預測現象。','拉丁文 modulus「小的尺度」，原意是建築師做的「縮小樣品」。經濟模型就像把整個經濟「縮小」到一張圖上。英國統計學家博克斯有句名言：「所有模型都是錯的，但有些是有用的。」'],
 ['相關與因果','Correlation & Causation','兩件事一起變動（相關），不代表一件造成另一件（因果）。','correlation 是 co-（一起）+ relation（關係）。19 世紀英國學者高爾頓（Francis Galton）在研究身高遺傳時發展出相關的概念。'],
 ['實證與規範','Positive & Normative','描述「是什麼」的陳述，與主張「應該怎樣」的陳述。','positive 來自拉丁文 positus「被放置的、已確立的」，表示事實；normative 來自 norma「木匠的直角尺」，表示衡量對錯的標準。'],
 ['破窗謬誤','Broken window fallacy','以為破壞能創造經濟利益，忽略了資源被挪用的機會成本。','出自法國經濟學家巴斯夏（Frédéric Bastiat）1850 年的文章《看得見的與看不見的》。他說：壞的經濟學家只看得見的效果，好的經濟學家還會預見看不見的效果。'],
 ['隨機對照實驗','Randomized controlled trial, RCT','把研究對象隨機分成實驗組和對照組，比較結果以找出因果關係。','原本是醫學測試新藥的方法。巴納吉、杜芙若和克雷默把它用在研究貧窮問題上，獲得 2019 年諾貝爾經濟學獎。杜芙若是史上最年輕的經濟學獎得主之一，也是第二位得到這個獎的女性。']],
q:[['「夏天冰淇淋銷量和溺水人數都增加」，正確的解讀是？',['冰淇淋造成溺水','溺水造成冰淇淋熱賣','兩者相關，但可能都是被天氣熱影響','兩者完全沒有關係'],2,'兩者有相關，但真正的原因是第三個因素「天氣熱」，這就是相關不等於因果。'],
 ['下列哪一句是「規範」陳述？',['最低工資提高後，某行業的雇用人數減少了 2%','政府應該提高最低工資','去年台灣的通膨率是 2%','利率上升會減少房貸需求'],1,'「應該」牽涉價值判斷，屬於規範陳述；其他都是可以用資料驗證的實證陳述。'],
 ['「颱風災後重建能刺激經濟，所以颱風對經濟有好處。」這犯了什麼錯？',['破窗謬誤','定錨效應','比較利益','邊際效用遞減'],0,'只看到重建的支出，沒看到這些資源本來可以用在別的地方，財富其實是減少的。']]});

  const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;
  try{localStorage.setItem('econ_theme',nx)}catch(e){}
};
const openM=o=>{side.classList.toggle('open',o);$('#scrim').classList.toggle('show',o)};
$('#menuBtn').onclick=()=>openM(true);$('#scrim').onclick=()=>openM(false);

function prog(){
  const n=LS.filter(l=>done.has(l.id)).length;
  $('#pbar').style.width=(n/LS.length*100)+'%';
  $('#ptxt').textContent=`已完成 ${n} / ${LS.length} 課`;
}
function sidebar(cur){
  let h='';
  UNITS.forEach(u=>{
    h+=`<div class="side-unit" style="--c:${u.c}"><h3>第 ${u.n} 單元</h3>`;
    LS.forEach((l,i)=>{if(l.u!==u.n)return;
      h+=`<a href="#${l.id}" class="${cur===l.id?'on':''}"><span class="n">${i+1}</span><span>${l.t}</span>${done.has(l.id)?'<span class="ck">✓</span>':''}</a>`});
    h+='</div>';
  });
  h+=`<div class="side-extra"><a href="#glossary">📜 名詞由來辭典</a><a href="#exam">🏁 綜合測驗</a><a href="#home">🏠 課程地圖</a></div>`;
  side.innerHTML=h;
  side.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>openM(false)));
}
function setAc(u){document.documentElement.style.setProperty('--ac',u?`var(--u${u})`:'var(--u1)')}

function home(){
  setAc(1);
  const next=LS.find(l=>!done.has(l.id))||LS[0];
  let h=`<section class="hero"><h1>經濟學，從一杯珍奶開始</h1>
  <p class="lead">不用先懂數學，也不用背公式。${LS.length} 堂課，從「為什麼東西會漲價」一路走到央行、匯率和諾貝爾獎等級的想法。</p>
  <svg viewBox="0 0 420 220" aria-label="供給與需求曲線交叉的示意圖">
   <line class="ax" x1="40" y1="10" x2="40" y2="190"/><line class="ax" x1="40" y1="190" x2="410" y2="190"/>
   <text x="46" y="20" style="font-size:13px;fill:var(--mut)">價格</text><text x="370" y="208" style="font-size:13px;fill:var(--mut)">數量</text>
   <path class="cd draw" d="M60 30 L380 180"/><path class="cs draw d2" d="M60 180 L380 30"/>
   <g class="pop"><line class="dash" x1="40" y1="105" x2="220" y2="105"/><line class="dash" x1="220" y1="105" x2="220" y2="190"/>
   <circle class="dot" cx="220" cy="105" r="7"/><text x="232" y="100" style="font-size:14px;fill:var(--ink);font-weight:700">市場價格就在這裡決定</text>
   <text x="330" y="176" style="font-size:14px;fill:var(--pen);font-weight:700">需求</text><text x="330" y="40" style="font-size:14px;fill:var(--red);font-weight:700">供給</text></g>
  </svg>
  <p>這張圖叫「供需圖」，是經濟學最有名的一張圖。上完第 9 課，你就能自己用它預測價格。</p>
  <a class="cta" href="#${next.id}">${done.size?'繼續上課：':'從第 1 課開始：'}${next.t}</a></section>
  <div class="box story"><b class="h">怎麼使用這本筆記本</b>每一課都有：生活例子、可以動手玩的互動圖、「名詞小辭典」告訴你專有名詞的由來，最後是隨堂小測驗。答完一課的測驗就算完成，進度會存在這台裝置的瀏覽器裡。</div>
  <div class="units">`;
  UNITS.forEach(u=>{
    h+=`<div class="ucard" style="--c:${u.c}"><h3>第 ${u.n} 單元　${u.name}</h3><p>${u.d}</p><ol start="${LS.findIndex(l=>l.u===u.n)+1}">`;
    LS.forEach(l=>{if(l.u===u.n)h+=`<li class="${done.has(l.id)?'dn':''}"><a href="#${l.id}">${l.t}</a>${done.has(l.id)?' ✓':''}</li>`});
    h+='</ol></div>';
  });
  h+='</div>';
  main.innerHTML=h;
}

function termHTML(t,link){return `<div class="term"><div class="tt">${t[0]}<span>${t[1]}</span></div><p><b>意思：</b>${t[2]}</p><p class="og"><b>由來：</b>${t[3]}</p>${link||''}</div>`}
function qHTML(q,k){
  return `<div class="qq" data-a="${q[2]}"><p>${k}. ${q[0]}</p><div class="opts">${q[1].map((o,j)=>`<button data-i="${j}">${'ABCD'[j]}. ${o}</button>`).join('')}</div><p class="why" hidden>${q[3]}</p></div>`;
}
function bindQuiz(root,onAll,onEach){
  const qs=[...root.querySelectorAll('.qq')];let answered=0,right=0;
  qs.forEach(qq=>{const a=+qq.dataset.a;
    qq.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i;qq.querySelectorAll('button').forEach(x=>x.disabled=true);
      qq.querySelectorAll('button')[a].classList.add('ok');
      if(i!==a)b.classList.add('no');else right++;
      const w=qq.querySelector('.why');w.hidden=false;w.innerHTML=(i===a?'✅ 答對了！':'❌ 再想想：')+w.innerHTML;
      answered++; onEach&&onEach(right,answered);
      if(answered===qs.length)onAll(right,qs.length);
    });
  });
}
function lesson(i){
  const l=LS[i];setAc(l.u);
  main.innerHTML=`<article class="lesson"><div class="lhead"><span class="tag">第 ${l.u} 單元　第 ${i+1} 課</span><br><h1>${l.t}</h1><p class="sub">${l.s}</p><span class="min">⏱ 大約 ${l.min} 分鐘</span></div>
  <div class="body">${l.body}</div>
  <section class="terms"><h2>📜 名詞小辭典：這些詞從哪裡來？</h2>${l.terms.map(t=>termHTML(t)).join('')}</section>
  <section class="quiz"><h2>✏️ 隨堂小測驗</h2>${l.q.map((q,k)=>qHTML(q,k+1)).join('')}<div id="qres"></div></section>
  <nav class="pn">${i>0?`<a href="#${LS[i-1].id}">← ${LS[i-1].t}</a>`:'<span></span>'}${i<LS.length-1?`<a href="#${LS[i+1].id}">下一課：${LS[i+1].t}</a>`:'<a href="#exam">去做綜合測驗 🏁</a>'}</nav></article>`;
  main.querySelectorAll('[data-w]').forEach(el=>{try{W[el.dataset.w](el)}catch(e){console.error(e);el.innerHTML='<p>這個互動圖沒有載入成功，請重新整理頁面。</p>'}});
  bindQuiz(main.querySelector('.quiz'),(r,n)=>{
    done.add(l.id);save();prog();sidebar(l.id);
    $('#qres').innerHTML=`<div class="qdone">🎉 本課完成！答對 ${r} / ${n} 題${r===n?'，滿分！':'。答錯的題目看看解析，再回頭讀一次重點。'}</div>`;
  });
}
function glossary(){
  setAc(1);
  let h=`<div class="lhead"><h1>📜 名詞由來辭典</h1><p class="sub">全部課程的專有名詞，連同它們的身世故事。可以搜尋中文或英文。</p></div><input class="search" id="gq" placeholder="搜尋，例如：通膨、GDP、margin" aria-label="搜尋名詞"><div id="gl"></div>`;
  main.innerHTML=h;
  const all=[];LS.forEach((l,i)=>l.terms.forEach(t=>all.push({t,i})));
  const draw=q=>{q=(q||'').toLowerCase();
    const f=all.filter(x=>!q||x.t.join(' ').toLowerCase().includes(q));
    $('#gl').innerHTML=f.length?f.map(x=>termHTML(x.t,`<p style="font-size:13px"><a href="#${LS[x.i].id}">出自第 ${x.i+1} 課：${LS[x.i].t}</a></p>`)).join(''):'<p>找不到這個詞。試試更短的關鍵字，或換成英文。</p>';};
  draw();$('#gq').oninput=e=>draw(e.target.value);
}
function exam(){
  setAc(4);
  const pool=[];LS.forEach(l=>l.q.forEach(q=>pool.push(q)));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const pick=pool.slice(0,20);
  main.innerHTML=`<div class="lhead"><h1>🏁 綜合測驗</h1><p class="sub">從全部 ${pool.length} 題中隨機抽出 20 題。每次重來題目都不一樣。</p></div><p id="esc">目前：0 / 20</p><section class="quiz" style="margin-top:10px">${pick.map((q,k)=>qHTML(q,k+1)).join('')}</section><div id="eres"></div>`;
  bindQuiz(main.querySelector('.quiz'),(r,n)=>{
    const lv=r>=18?'經濟學達人 🏆':r>=14?'穩穩的中級生 👍':r>=10?'入門完成 🌱':'再複習一輪會更好 📖';
    $('#eres').innerHTML=`<div class="qdone">得分 ${r} / ${n}：${lv}</div><div class="pn"><a href="#exam" onclick="setTimeout(()=>dispatchEvent(new HashChangeEvent('hashchange')),0)">再測一次</a><a href="#glossary">複習名詞辭典</a></div>`;
  },(r,a)=>{$('#esc').textContent=`目前：答對 ${r} / 已答 ${a} / 共 20 題`});
}
function route(){
  const r=location.hash.slice(1)||'home';
  const i=LS.findIndex(l=>l.id===r);
  sidebar(i>=0?r:null);
  if(i>=0)lesson(i);else if(r==='glossary')glossary();else if(r==='exam')exam();else home();
  prog();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
