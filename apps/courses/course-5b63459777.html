<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>挖掘時間：從零開始的歷史課</title>
<style>
:root{
  --paper:#EEF1F4; --paper2:#E2E7EC; --card:#FFFFFF; --ink:#17213A; --ink2:#4A5570;
  --bronze:#2F8F83; --bronze-soft:#D6ECE8; --cinnabar:#C8322F; --gold:#B8862E;
  --l1:#D9C9A3; --l2:#A7866A; --l3:#5E4A3F; --line:#CBD3DC;
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU","MingLiU",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121826; --paper2:#1A2233; --card:#1E2738; --ink:#E6EAF2; --ink2:#A9B3C7;
    --bronze:#5CC2B4; --bronze-soft:#1F3B3A; --cinnabar:#E5534F; --gold:#D9A94F;
    --l1:#6B5E44; --l2:#5A4636; --l3:#3A2E28; --line:#2E3A50;
  }
}
:root[data-theme="dark"]{
  --paper:#121826; --paper2:#1A2233; --card:#1E2738; --ink:#E6EAF2; --ink2:#A9B3C7;
  --bronze:#5CC2B4; --bronze-soft:#1F3B3A; --cinnabar:#E5534F; --gold:#D9A94F;
  --l1:#6B5E44; --l2:#5A4636; --l3:#3A2E28; --line:#2E3A50;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.8;-webkit-text-size-adjust:100%}
img,svg{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--bronze);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--serif);line-height:1.35;font-weight:700;margin:0}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 14px}
.logo{font-family:var(--serif);font-weight:700;font-size:18px;margin-right:auto;background:none;border:0;padding:4px 0;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--l1) 0 33%,var(--l2) 0 66%,var(--l3) 0)}
.nav{background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;font-size:15px;color:var(--ink2)}
.nav.on{color:var(--ink);border-color:var(--line);background:var(--card)}
.prog{height:3px;background:var(--paper2)}
.prog b{display:block;height:100%;background:var(--bronze);width:0;transition:width .6s}

main{max-width:760px;margin:0 auto;padding:20px 18px 80px}

/* home */
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(32px,8vw,52px);letter-spacing:.02em}
.hero p{color:var(--ink2);max-width:36em;margin:10px 0 0}
.shaft{margin:28px 0 10px;position:relative}
.stratum{position:relative;padding:22px 18px 18px 18px;border-radius:0}
.stratum:first-child{border-radius:16px 16px 0 0}
.stratum:last-child{border-radius:0 0 16px 16px}
.s1{background:var(--l1)} .s2{background:var(--l2);color:#fff} .s3{background:var(--l3);color:#fff}
.stratum::before{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;background:inherit;
  -webkit-mask:radial-gradient(12px 6px at 12px 6px,#000 98%,transparent) -12px 0/24px 12px repeat-x;
          mask:radial-gradient(12px 6px at 12px 6px,#000 98%,transparent) -12px 0/24px 12px repeat-x}
.stratum:first-child::before{display:none}
.s-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.s-head h2{font-size:24px}
.s-head span{font-size:14px;opacity:.85}
.depth{font-size:13px;opacity:.75;margin-top:2px}
.finds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.find{position:relative;text-align:left;border:0;border-radius:12px;padding:12px 12px 14px;background:rgba(255,255,255,.72);color:var(--ink);min-height:92px;transition:transform .15s}
.s2 .find,.s3 .find{background:rgba(255,255,255,.12);color:#fff}
.find:hover{transform:translateY(-2px)}
.find .n{font-size:12px;opacity:.7}
.find .ic{font-size:24px;display:block;line-height:1.3}
.find .tt{font-weight:600;font-size:15px;line-height:1.4;display:block;margin-top:4px}
.seal{position:absolute;right:8px;top:8px;width:36px;height:36px;border:2px solid var(--cinnabar);color:var(--cinnabar);border-radius:6px;
  font-family:var(--serif);font-size:13px;line-height:1.05;display:grid;place-items:center;transform:rotate(-8deg);background:rgba(255,255,255,.85);font-weight:700;letter-spacing:.05em}
.seal.pop{animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
.home-links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.hl{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;text-align:left}
.hl b{display:block;font-family:var(--serif);font-size:17px}
.hl small{color:var(--ink2);font-size:14px}
.howto{margin-top:22px;color:var(--ink2);font-size:15px}

/* lesson */
.crumb{font-size:14px;color:var(--ink2)}
.l-title{font-size:clamp(28px,6.5vw,40px);margin:6px 0 4px}
.goal{border-left:4px solid var(--bronze);padding:6px 0 6px 14px;margin:14px 0 8px;color:var(--ink2)}
.sec{margin-top:30px}
.sec h3{font-size:22px;margin-bottom:8px}
.sec p{margin:10px 0}
.sec ul,.sec ol{padding-left:1.3em;margin:8px 0}
.sec li{margin:4px 0}
.t{border-bottom:2px dotted var(--bronze);cursor:help;font-weight:600;color:inherit;background:none;border-top:0;border-left:0;border-right:0;padding:0;font-size:inherit;line-height:inherit}
.ex{background:var(--bronze-soft);border-radius:12px;padding:12px 16px;margin:14px 0}
.ex b:first-child{color:var(--bronze)}
.warn{background:var(--paper2);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:16px}
.terms{display:grid;gap:10px;margin-top:10px}
.term{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.term summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.term summary::-webkit-details-marker{display:none}
.term summary::after{content:"＋";margin-left:auto;color:var(--ink2)}
.term[open] summary::after{content:"－"}
.term .w{font-family:var(--serif);font-size:19px;font-weight:700}
.term .en{color:var(--ink2);font-size:14px}
.term .body{padding:0 16px 14px;font-size:16px}
.term .body div{margin-top:6px}
.term .lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;background:var(--paper2);color:var(--ink2)}
.widget{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:18px 0}
.widget h4{margin:0 0 4px;font-family:var(--serif);font-size:18px}
.widget .hint{font-size:14px;color:var(--ink2);margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-size:15px}
.btn.pri{background:var(--bronze);border-color:var(--bronze);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.out{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--paper);font-size:16px;min-height:48px}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:460px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-family:var(--serif)}

/* quiz */
.quiz{margin-top:34px;border-top:2px solid var(--ink);padding-top:16px}
.quiz h3{font-size:22px}
.q{margin:16px 0}
.q p{margin:0 0 8px;font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:16px}
.opt.ok{border-color:var(--bronze);background:var(--bronze-soft)}
.opt.no{border-color:var(--cinnabar);text-decoration:line-through;opacity:.75}
.why{font-size:15px;color:var(--ink2);margin-top:6px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.pager .btn{max-width:48%}
.done-box{margin-top:20px;display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.done-box .seal{position:static;width:54px;height:54px;font-size:18px;flex:none}

/* timeline page */
.tl{position:relative;margin-top:16px;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--line)}
.era{font-family:var(--serif);font-size:20px;margin:24px 0 8px;position:relative}
.era::before{content:"";position:absolute;left:-22px;top:9px;width:16px;height:16px;border-radius:50%;background:var(--ink)}
.ev{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:15px}
.ev::before{content:"";position:absolute;left:-19px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--rc,var(--bronze))}
.ev .y{font-weight:700;font-family:var(--serif);margin-right:6px}
.ev .rg{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}

/* glossary */
.search{width:100%;font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin:14px 0}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:18px 18px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto;
  transform:translateY(110%);transition:transform .28s ease;max-height:75vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.sheet h3{font-size:24px}
.sheet .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:22px;padding:6px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:15px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

/* specific widgets */
.gridDots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;max-width:420px}
.gridDots i{aspect-ratio:1;border-radius:50%;background:var(--bronze);transition:opacity .4s,transform .4s}
.gridDots i.gone{opacity:.12;transform:scale(.6)}
input[type=range]{width:100%;accent-color:var(--bronze)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.num{font:inherit;width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.chainv{display:flex;flex-direction:column;gap:0;margin-top:8px}
.link{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);opacity:0;transform:translateY(8px);transition:.35s;display:none}
.link.on{display:block;opacity:1;transform:none}
.arrow{text-align:center;color:var(--ink2);display:none;line-height:1.4}
.arrow.on{display:block}
.xg{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.xcol{background:var(--paper);border-radius:10px;padding:10px;min-height:170px}
.xcol h5{margin:0 0 6px;font-family:var(--serif);font-size:16px}
.item{display:inline-block;margin:3px;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;transition:transform 1.2s ease,opacity .3s}
.cls{display:flex;flex-direction:column;gap:8px}
.cls .c{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cls .c span{flex:1 1 180px}
.cls .c.ok{border-color:var(--bronze);background:var(--bronze-soft)}
.cls .c.no{border-color:var(--cinnabar)}
.scene{font-size:17px;line-height:2.1}
.scene button{border:0;border-bottom:2px dashed var(--line);background:none;padding:0 2px;font-size:inherit}
.scene button.hit{border-bottom-color:var(--cinnabar);color:var(--cinnabar);font-weight:700}
.scene button.miss{border-bottom-color:var(--ink2);opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){.home-links{grid-template-columns:1fr}.nav{padding:6px 7px;font-size:14px}.logo span{display:none}}
a{color:var(--bronze)}
a.btn{text-decoration:none;display:inline-block;color:var(--ink);line-height:1.5}
a.btn.pri{color:#fff}
a.find{display:block}
.ev{font:inherit;color:inherit}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <button class="logo" data-go="home" aria-label="回到課程首頁"><i></i><span>挖掘時間</span></button>
  <button class="nav" data-go="home">課程</button>
  <button class="nav" data-go="timeline">時間軸</button>
  <button class="nav" data-go="glossary">名詞庫</button>
  <button class="nav" data-go="exam">總測驗</button>
  <button class="nav" id="themeBtn" aria-label="切換深淺色">◐</button>
</div><div class="prog"><b id="progBar"></b></div></header>
<main id="app"></main>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><button class="x" id="sheetX" aria-label="關閉">×</button><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===== 名詞庫：每個專有名詞的意思與由來 ===== */
const TERMS = {
"歷史":{en:"History",m:"人類過去發生的事，以及人們對這些事的記錄與研究。",o:"中文「歷」本義是「經過」（《說文解字》：歷，過也）；「史」在甲骨文裡是一隻手拿著記事的工具，原指專門記錄事情的官員。兩字合起來就是「經過的事被記錄下來」。英文 history 來自希臘文 historia，意思是「探究、打聽來的知識」，希羅多德用它當書名，把寫歷史變成一種調查工作。"},
"史料":{en:"Historical source",m:"一切能讓我們認識過去的材料：文字、文物、照片、口述、建築、甚至垃圾堆。",o:"「史」＋「料」（材料）。就像做菜需要食材，寫歷史需要史料。"},
"一手史料":{en:"Primary source",m:"事件發生當時、由親身經歷者或當時的人留下的材料，例如日記、信件、當年的報紙、出土器物。",o:"英文 primary 意為「第一的」。因為它離事件最近，所以叫「第一手」，就像直接從產地買到的東西。"},
"二手史料":{en:"Secondary source",m:"後人根據一手史料研究、整理、解釋後寫出的作品，例如教科書、歷史書、紀錄片。",o:"經過「第二隻手」轉述加工，所以叫二手。二手不代表不好，而是已經加入了作者的解釋。"},
"考古學":{en:"Archaeology",m:"透過挖掘和研究古人留下的實物（遺址、工具、骨骸）來了解過去的學問。",o:"希臘文 archaios（古老的）＋ logia（學問、論述）。中文「考」是考察，「古」是古代：考察古代。"},
"西元":{en:"Anno Domini (AD) / Common Era (CE)",m:"以傳說中耶穌誕生那年為第 1 年的紀年方法，現在全世界通用。",o:"西元 525 年左右，一位名叫狄奧尼修斯（Dionysius Exiguus）的修士為了計算復活節日期，把年份改成從耶穌誕生算起，稱為 Anno Domini（拉丁文「主的年份」）。因為從西方傳來，中文稱「西元」。現在學界常用中性說法 CE（公元，Common Era）。"},
"世紀":{en:"Century",m:"一百年為一個世紀。西元 1–100 年是 1 世紀，1901–2000 年是 20 世紀。",o:"英文 century 來自拉丁文 centum（一百），和 cent（一分錢＝百分之一元）、percent（百分比）同源。中文「世」原指三十年一代人，「紀」是記錄的段落，合起來借用來翻譯 century。"},
"碳十四定年法":{en:"Radiocarbon dating",m:"利用生物死亡後體內碳十四會以固定速度減少的原理，推算有機物（骨頭、木頭、布料）有多老。",o:"1949 年美國化學家利比（Willard Libby）發明，他因此獲得 1960 年諾貝爾化學獎。「十四」是指這種碳原子的質量數是 14。"},
"半衰期":{en:"Half-life",m:"放射性物質減少到剩下一半所需的時間。碳十四的半衰期約 5,730 年。",o:"「半」＋「衰」（減少）＋「期」（期間）：衰減一半所需的時間。"},
"史前時代":{en:"Prehistory",m:"人類發明文字以前的時代。沒有文字記錄，只能靠考古研究。",o:"英文 prehistory 的 pre 意為「在……之前」，就是「在歷史（文字記錄）之前」。19 世紀的學者開始普遍使用這個詞。"},
"舊石器時代":{en:"Paleolithic Age",m:"人類使用打製石器、靠狩獵採集維生的時代，約從 300 多萬年前到 1 萬多年前。",o:"1865 年英國學者約翰·盧伯克（John Lubbock）創造：希臘文 palaios（古老）＋ lithos（石頭）＝「古老的石頭時代」。"},
"新石器時代":{en:"Neolithic Age",m:"人類開始使用磨製石器、種田、養牲畜、定居村落的時代，約從 1 萬多年前開始。",o:"同樣由盧伯克在 1865 年命名：neo（新）＋ lithos（石頭）。重點不只是石器變精細，而是生活方式徹底改變。"},
"農業革命":{en:"Agricultural (Neolithic) Revolution",m:"人類從狩獵採集轉向種植作物、馴養動物的巨大轉變，約 1 萬 2 千年前開始。",o:"考古學家柴爾德（V. Gordon Childe）在 1930 年代提出「新石器革命」，強調這個改變之深遠，不亞於後來的工業革命。"},
"文明":{en:"Civilization",m:"人類發展出城市、文字、政府、分工與複雜社會後的狀態。",o:"中文出自《易經》「見龍在田，天下文明」，原意是光明、有文采。英文 civilization 來自拉丁文 civis（市民）、civitas（城市），18 世紀法國人開始使用，意思是「像城市人一樣有組織的生活」。"},
"美索不達米亞":{en:"Mesopotamia",m:"位於底格里斯河與幼發拉底河之間的地區（大約今天的伊拉克），人類最早的文明之一在此誕生。",o:"古希臘文 meso（中間）＋ potamos（河流）＝「兩河之間的土地」，所以中文也叫「兩河流域」。"},
"楔形文字":{en:"Cuneiform",m:"蘇美人約在西元前 3200 年發明的文字，用蘆葦筆在濕泥板上壓出楔子形狀的筆畫。",o:"英文 cuneiform 來自拉丁文 cuneus（楔子）。楔子就是一頭粗一頭尖的木塊，中文「楔形」就是「楔子的形狀」。"},

goal:"讀完這課，你能說出「歷史」和「過去」的差別，也知道人類的歷史在地球的時間裡有多短。",
secs:[
{h:"過去 ≠ 歷史",html:`
<p>你昨天吃了什麼？這是「過去」。但如果沒有人記得、沒有照片、沒有收據，這件事就消失了。</p>
<p>[[歷史]]是「被記錄下來、被研究和解釋的過去」。所以歷史有兩層意思：</p>
<ol><li><b>發生過的事</b>：例如秦始皇統一六國。</li><li><b>人們寫下的關於這些事的敘述</b>：例如司馬遷寫的《史記》。</li></ol>
<div class="ex"><b>生活例子</b>　班上同學吵架，老師問經過。小明說是小華先動手，小華說是小明先罵人。事情只發生一次，但「說法」有兩種。歷史學家的工作，就像這位老師：收集各方說法和證據，找出最接近真相的版本。</div>`},
{h:"為什麼要學歷史？",html:`
<ul><li><b>了解現在</b>：你說的語言、住的城市、用的錢，都是過去一步步形成的。</li>
<li><b>學會判斷</b>：網路上真假消息很多，學歷史就是在練習「看證據、分辨可信度」。</li>
<li><b>理解別人</b>：不同國家、民族為什麼想法不同？答案常常藏在他們的歷史裡。</li></ul>`},

{id:2, level:1, icon:"🗓️", title:"時間怎麼算？西元與世紀",
goal:"學會西元紀年、「西元前」的算法，以及怎麼把年份換算成世紀。",
secs:[
{h:"人類需要一把共同的時間尺",html:`
<p>古代每個國家有自己的紀年方式：中國用皇帝年號（例如「貞觀三年」）、古羅馬從建城那年算起、伊斯蘭世界從穆罕默德遷往麥地那那年算起。不同紀年要互相換算非常麻煩。</p>
<p>今天全世界最通用的是[[西元]]：把傳說中耶穌誕生的那一年當作第 1 年。</p>
<div class="warn"><b>冷知識</b>　現代學者推算，耶穌可能其實出生在西元前 4 年左右。當年計算的修士算錯了，但大家已經用習慣，就一直沿用下來。</div>`},
{h:"西元前：倒著數的時間",html:`
<p>西元 1 年以前的年份叫「西元前」，數字越大越古老。西元前 221 年（秦統一）比西元前 202 年（漢朝建立）還早 19 年。</p>
<p>重點：<b>沒有「西元 0 年」</b>。西元前 1 年的下一年就是西元 1 年。這是因為發明這套方法的中古歐洲還沒有「零」的概念。</p>
<div class="ex"><b>算算看</b>　從西元前 5 年到西元 5 年，過了幾年？直接 5＋5＝10 是錯的，因為沒有 0 年，答案是 9 年。</div>`},
{w:"century"},
{h:"世紀的算法",html:`
<p>[[世紀]]是一百年。算法口訣：<b>年份去掉後兩位，再加 1</b>（但剛好是整百年的，不用加 1）。</p>
<ul><li>1945 年 → 19＋1 → 20 世紀</li><li>2026 年 → 20＋1 → 21 世紀</li><li>2000 年 → 整百年 → 20 世紀（因為 20 世紀是 1901–2000）</li></ul>
<p>「年代」則是十年一組，例如「1980 年代」就是 1980–1989 年。</p>`}

{id:3, level:1, icon:"🏺", title:"我們怎麼知道過去？史料與考古",
goal:"分辨一手與二手史料，了解考古學家如何用科學方法替文物「量年紀」。",
secs:[
{h:"史料：歷史的證據",html:`
<p>歷史學家不能坐時光機，只能靠[[史料]]。史料分兩大類：</p>
<ul><li>[[一手史料]]：當時留下的，例如日記、信件、法律條文、出土陶器、老照片。</li>
<li>[[二手史料]]：後人研究後寫的，例如教科書、傳記、紀錄片。</li></ul>
<div class="ex"><b>生活例子</b>　你參加畢業旅行拍的照片是一手史料；十年後學弟妹看了你的照片寫一篇〈學長姊的畢旅〉，就是二手史料。</div>`},
{w:"classify",title:"練習：這是一手還是二手史料？",hint:"點選每個史料的分類，看看你判斷得對不對。",cats:["一手","二手"],items:[
["1945 年一位士兵寫給家人的信",0,"寫信的人就在當時當地。"],
["國中歷史課本",1,"課本是後人整理研究的成果。"],
["從古墓挖出的青銅器",0,"文物本身就是當時留下的。"],
["2020 年拍的秦始皇紀錄片",1,"紀錄片是現代人對過去的解說。"],
["1969 年登月當天的報紙",0,"事件發生當時的報導。"],
["一本講唐朝的歷史小說",1,"小說是後人創作，還加入了想像。"]]},
{h:"考古學：用鏟子讀歷史",html:`
<p>文字出現前的幾百萬年，沒有任何書面記錄，這時就要靠[[考古學]]。考古學家有一個重要原則叫「地層」：</p>
<p><b>越下層的東西，通常越古老。</b>就像你房間的一疊舊考卷，最下面那張一定是最早放的。這個網站的課程地圖就是用地層來畫的：越往下挖，內容越深。</p>`},
{w:"c14"},
{h:"碳十四：大自然的計時器",html:`
<p>活著的生物會不斷吸收碳，其中有一點點是具放射性的碳十四。生物死後就不再吸收，體內的碳十四開始慢慢減少，每過約 5,730 年剩下一半，這段時間叫[[半衰期]]。</p>
<p>只要測出一塊古代木頭還剩多少碳十四，就能倒推它是多久以前死亡的。這就是[[碳十四定年法]]，大約可以測到 5 萬年以內的東西。</p>`}
],
terms:["史料","一手史料","二手史料","考古學","碳十四定年法","半衰期"],

{q:"下列哪一個是一手史料？",o:["一本研究清朝的論文","清朝官員寫的奏摺","介紹清朝的網路影片"],a:1,why:"奏摺是清朝當時留下的文件。"},
{q:"一塊木頭剩下原本 25% 的碳十四，大約死亡多久了？",o:["約 2,865 年","約 5,730 年","約 11,460 年"],a:2,why:"100%→50% 是一個半衰期，50%→25% 是第二個，5,730×2＝11,460 年。"},
{q:"考古學的「地層」原則是什麼？",o:["越上層越古老","越下層通常越古老","地層跟年代無關"],a:1,why:"東西一層層堆積，底下的先堆，所以通常更古老。"}
]},

/* ---------- 第 4 課 ---------- */
{id:4, level:1, icon:"🪨", title:"史前時代：從石頭到農田",
goal:"認識舊石器、新石器時代的生活，理解農業革命為什麼改變了一切。",
secs:[
{h:"沒有文字的漫長時光",html:`
<p>文字發明以前的時代叫[[史前時代]]，佔了人類經歷的絕大部分時間。學者依照人類使用的工具，把它分成幾個時代：</p>
<ul><li>[[舊石器時代]]：把石頭敲出尖銳邊緣使用（打製石器），靠打獵、採集野果維生，跟著食物到處移動。人類學會用火，也開始畫洞穴壁畫。</li>
<li>[[新石器時代]]：石器磨得光滑精緻（磨製石器），更重要的是開始種田、養動物、做陶器、蓋村莊。</li></ul>`},
{w:"yearcal"},
{h:"農業革命：人類最大的轉彎",html:`
<p>大約 1 萬 2 千年前，在西亞的「肥沃月灣」（因地形像一彎新月而得名）、中國的黃河與長江流域、美洲等地，人們各自開始種植作物。這叫[[農業革命]]。</p>`},
{w:"chain",title:"連鎖反應：種田之後發生什麼事？",hint:"按「下一步」，看一個改變怎麼引發下一個改變。",steps:[
"🌾 開始種田：食物來源變穩定",
"🏠 不再遷徙：要照顧田地，只好定居下來",
"👶 人口變多：食物有剩，能養活更多小孩",
"📦 有了剩餘：吃不完的糧食需要儲存和分配",
"🔨 出現分工：不是每個人都要種田，有人專做陶器、有人當祭司、有人當戰士",
"👑 出現階級與首領：誰管理存糧，誰就有權力",
"🏙️ 城市與國家誕生：文明即將登場"]},
{h:"文明的條件",html:`
<p>當社會發展出城市、文字、政府、分工與宗教，學者就稱之為[[文明]]。下一層，我們要去看最早的文明。</p>
<div class="warn"><b>想一想</b>　農業一定比較好嗎？有些學者指出，早期農民工作更累、營養更單調、傳染病更多（因為人和牲畜擠在一起）。歷史的改變常常有得有失。</div>`}
],
terms:["史前時代","舊石器時代","新石器時代","農業革命","文明"],
quiz:[
{q:"「新石器時代」的 neo-lithic 是什麼意思？",o:["新的石頭","神聖的石頭","黑色的石頭"],a:0,why:"neo 是新，lithos 是石頭。"},
{q:"農業革命後，下列哪一件事最直接出現？",o:["人類開始定居","人類發明電","人類開始狩獵"],a:0,why:"種田需要照顧土地，人們因此定居。"},
{q:"下列哪一個不是一般認為「文明」的條件？",o:["城市","文字","手機"],a:2,why:"文明的條件包括城市、文字、政府、分工等，手機是現代發明。"}
]},

/* ---------- 第 5 課 ---------- */
{id:5, level:2, icon:"🌊", title:"大河文明與文字的誕生",
goal:"認識四大古文明的所在地與特色，理解文字如何從圖畫演變而來。",
secs:[
{h:"為什麼文明都在河邊？",html:`
<p>河流提供灌溉用水、肥沃的泥土、交通和魚類。管理河水（防洪、挖渠道）需要很多人合作，這就促成了組織與政府。最早的四個文明都靠著大河：</p>
<div class="scroll-x"><table><tr><th>文明</th><th>河流</th><th>約始於</th><th>代表成就</th></tr>
<tr><td>[[美索不達米亞]]</td><td>底格里斯河、幼發拉底河</td><td>西元前 3500 年</td><td>[[楔形文字]]、漢摩拉比法典、輪子</td></tr>
<tr><td>古埃及</td><td>尼羅河</td><td>西元前 3100 年</td><td>[[象形文字]]、金字塔、太陽曆</td></tr>
<tr><td>印度河流域</td><td>印度河</td><td>西元前 2600 年</td><td>規劃整齊的城市、下水道系統</td></tr>
<tr><td>中國</td><td>黃河、長江</td><td>西元前 2000 年前後</td><td>[[甲骨文]]、青銅器</td></tr></table></div>`},
{h:"文字：把話留下來的發明",html:`
<p>文字出現後，人類的記憶可以跨越時間和距離，這就是「史前」與「歷史時代」的分界。最早的文字多半用來<b>記帳</b>：誰欠了多少麥子、神廟收了幾隻羊。</p>`},
{w:"writing"},
{h:"兩個重要的解謎故事",html:`
<p><b>羅塞塔石碑</b>：1799 年在埃及發現，上面用象形文字、埃及草書和古希臘文刻了同一段內容。因為學者讀得懂希臘文，法國學者商博良在 1822 年破解了象形文字。這就像拿著「翻譯對照表」解密碼。</p>
<p><b>甲骨文</b>：1899 年，王懿榮在中藥「龍骨」上看到刻痕，認出是古文字，一路追查到河南安陽的殷墟，證實了商朝真的存在。</p>
<div class="ex"><b>漢摩拉比法典</b>（約西元前 1754 年）是保存最完整的古代法律之一，刻在石柱上公開展示。其中有「以眼還眼」式的原則，也規定不同身分的人受到不同處罰，讓我們看見當時的階級社會。</div>`}
],
terms:["美索不達米亞","楔形文字","象形文字","甲骨文"],
quiz:[
{q:"「美索不達米亞」的意思是？",o:["太陽升起的地方","兩河之間的土地","沙漠中的綠洲"],a:1,why:"meso＋potamos＝兩河之間。"},
{q:"讓學者破解古埃及象形文字的關鍵是？",o:["金字塔","羅塞塔石碑","木乃伊"],a:1,why:"石碑上有同一段文字的三種版本，其中希臘文可讀。"},
{q:"最早的文字常被用來做什麼？",o:["寫小說","記帳與記錄財物","寫情書"],a:1,why:"管理糧食和財物需要記錄，是文字最早的用途之一。"}
]},

/* ---------- 第 6 課 ---------- */
{id:6, level:2, icon:"🏛️", title:"古典時代：希臘、羅馬、秦漢與思想的軸心",
goal:"比較東西方古典帝國的政治制度，認識影響人類兩千多年的思想家。",
secs:[
{h:"雅典：人民自己做決定",html:`
<p>西元前 5 世紀的雅典，成年男性公民可以直接到廣場投票決定戰爭、法律等大事。這就是[[民主]]的起源。</p>
<div class="warn"><b>要注意</b>　雅典的民主只屬於成年男性公民。女性、奴隸、外邦人都不能投票，大約只有一成多的人口有權參與。用今天的標準直接說它「很民主」，就忽略了當時的限制。</div>`},
{h:"羅馬：從共和到帝國",html:`
<p>羅馬在西元前 509 年趕走國王，建立[[共和]]：由選出的兩位執政官和元老院治理。後來羅馬不斷擴張，內戰頻繁，西元前 27 年屋大維成為第一位皇帝，羅馬進入帝國時代，疆域環繞整個地中海。</p>
<p>羅馬留給世界的禮物：法律體系、道路、拉丁文（英文大量單字來自拉丁文），以及後來的基督教會組織。</p>`},
{h:"秦漢：大一統的中國",html:`
<p>西元前 221 年，秦王嬴政統一六國，自稱[[皇帝]]。他統一文字、貨幣、度量衡和車軌寬度，設立郡縣由中央派官治理。秦朝雖然只維持 15 年，但它建立的制度被後來的朝代延續了兩千年。</p>
<p>漢朝（西元前 202 年–西元 220 年）接手秦的制度，採用儒家思想治國，並開通了通往西域的道路。「漢人」「漢字」的名稱都來自這個朝代。</p>`},
{w:"compare",title:"比一比：三個古典政權",hint:"點選上方名稱，切換比較。",tabs:[
{n:"雅典",rows:[["誰做決定","公民大會（成年男性公民直接投票）"],["領導人怎麼產生","多數官職用抽籤決定，將軍由選舉"],["留下的影響","民主觀念、哲學、戲劇、奧運"]]},
{n:"羅馬共和",rows:[["誰做決定","元老院、執政官與人民大會互相制衡"],["領導人怎麼產生","每年選出兩位執政官，任期一年"],["留下的影響","共和制度、羅馬法、三權制衡的靈感"]]},
{n:"秦漢帝國",rows:[["誰做決定","皇帝，由中央官僚執行"],["領導人怎麼產生","世襲；官員由推薦或考核任用"],["留下的影響","中央集權、郡縣制、統一文字"]]}]},
{h:"軸心時代：思想大爆發",html:`
<p>在西元前 800 到 200 年之間，世界各地彼此幾乎沒有聯絡，卻同時出現了偉大的思想家，這段時期被稱為[[軸心時代]]：</p>
<ul><li>中國：孔子、老子、墨子、孟子，諸子百家</li><li>印度：釋迦牟尼（佛教）</li><li>希臘：蘇格拉底、柏拉圖、亞里斯多德</li><li>西亞：猶太教的先知們</li></ul>
<p>他們都在問類似的問題：人應該怎麼活？什麼是好的社會？這些答案至今仍影響著數十億人。</p>`}
],
terms:["民主","共和","皇帝","軸心時代"],
quiz:[
{q:"democracy 的字源 demos 是什麼意思？",o:["人民","神明","國王"],a:0,why:"demos＝人民，kratos＝統治。"},
{q:"秦始皇的「皇帝」稱號從何而來？",o:["向羅馬學的","取自三皇五帝","周天子封給他的"],a:1,why:"他認為自己功業超越三皇五帝，各取一字。"},
{q:"古代雅典的民主有什麼限制？",o:["只有國王能投票","女性和奴隸不能投票","每個人都能投票，沒有限制"],a:1,why:"只有成年男性公民有政治權利。"}
]},

/* ---------- 第 7 課 ---------- */
{id:7, level:2, icon:"🐫", title:"中古世界：絲路上的交流",
goal:"了解 5–15 世紀歐亞各大文明的樣貌，以及它們如何透過絲路與海路相互影響。",
secs:[
{h:"「中古」是誰取的名字？",html:`
<p>476 年西羅馬帝國滅亡，歐洲進入所謂的[[中古時代]]，一直到 15 世紀左右。這個名字是後來的人取的，暗示這一千年只是兩個輝煌時代「中間」的空檔。</p>
<p>但同一時期，世界其他地方正非常熱鬧：</p>
<ul><li><b>中國</b>：唐朝長安是百萬人口的國際大城，宋朝發展出活字印刷、火藥、指南針的應用，經濟繁榮。</li>
<li><b>伊斯蘭世界</b>：7 世紀[[伊斯蘭]]興起，巴格達的「智慧宮」翻譯保存了大量古希臘著作，並發展出[[代數]]、醫學和天文學。</li>
<li><b>東南亞</b>：[[吳哥王朝]]在今天的柬埔寨建造了世界最大的宗教建築群之一——吳哥窟（12 世紀）。</li>
<li><b>歐洲</b>：以[[封建]]制度和基督教會為核心組織社會，城堡和大教堂是這時期的象徵。</li></ul>`},
{w:"silkroad"},
{h:"絲路上流動的不只是絲",html:`
<p>[[絲路]]不是一條路，而是一整張路網。沿路交換的東西包括：</p>
<ul><li><b>商品</b>：中國的絲綢、瓷器、茶葉；西方的玻璃、香料、馬匹</li>
<li><b>宗教</b>：佛教從印度傳入中國，伊斯蘭教傳入中亞</li>
<li><b>技術</b>：造紙術在 8 世紀傳到阿拉伯世界，再傳到歐洲</li>
<li><b>疾病</b>：14 世紀的黑死病沿著貿易路線從亞洲傳到歐洲，約三分之一的歐洲人死亡</li></ul>
<div class="ex"><b>生活例子</b>　今天的網路讓一支影片一天就傳遍全球；古代的絲路就是當時的「網路」，只是傳一個想法可能要花幾十年。</div>`},
{h:"蒙古帝國：把歐亞連成一片",html:`<p>13 世紀，成吉思汗和他的子孫建立了史上陸地面積最大的連續帝國，從朝鮮半島延伸到東歐。蒙古人的征服造成巨大破壞，但也讓歐亞大陸的道路空前暢通，馬可波羅就是在這時期來到中國的。</p>`}
],
terms:["中古時代","封建","絲路","伊斯蘭","代數","吳哥王朝"],
quiz:[
{q:"「絲路」這個名字是誰取的？",o:["漢武帝","19 世紀德國地理學家李希霍芬","馬可波羅"],a:1,why:"1877 年李希霍芬首次使用，古人並不這樣稱呼。"},
{q:"「代數」algebra 這個字來自哪裡？",o:["拉丁文","阿拉伯文 al-jabr","中文"],a:1,why:"來自巴格達學者花拉子米的書名。"},
{q:"黑死病如何從亞洲傳到歐洲？",o:["沿著貿易路線","透過飛機","透過網路"],a:0,why:"商隊和船隻把病菌和帶病的跳蚤一起帶到各地。"}
]},
/* ---------- 第 8 課 ---------- */
{id:8, level:2, icon:"⛵", title:"近代的開端：重生、改革與遠航",
goal:"理解文藝復興、宗教改革與大航海如何讓世界從各自發展走向連結。",
secs:[
{h:"文藝復興：把「人」放回中心",html:`
<p>14 世紀起，義大利的佛羅倫斯、威尼斯等城市靠貿易致富，有錢的商人贊助藝術家與學者。他們重新研究古希臘羅馬的作品，重視人的能力與個性，這就是[[文藝復興]]。</p>
<p>代表人物：達文西（畫家也是工程師）、米開朗基羅（雕刻家）、但丁（詩人）。</p>
<div class="ex"><b>觀察重點</b>　中古的畫作裡，人物常常扁平、比例由重要性決定；文藝復興的畫家研究解剖和透視法，讓畫面像真實的三維空間。畫風的改變，反映了看世界方式的改變。</div>`},
{h:"印刷術點燃的改革",html:`
<p>1450 年前後，德國人古騰堡改良了活字印刷機。書變便宜了，知識不再只屬於少數人。</p>
<p>1517 年，德國修士馬丁·路德公開質疑教會販賣「贖罪券」（花錢就能減輕罪罰）。靠著印刷術，他的文章幾週內就傳遍德國，引發[[宗教改革]]，基督教從此分裂成天主教和新教。</p>`},
{h:"大航海：世界連成一體",html:`
<p>鄂圖曼帝國控制了東西貿易的陸路，歐洲人想找海路直接買亞洲的香料。在[[大航海時代]]：</p>
<ul><li>1405–1433 年：明朝鄭和七次下西洋，最遠到達非洲東岸（比歐洲人更早，但後來中國停止遠航）</li>
<li>1492 年：哥倫布橫越大西洋抵達美洲</li>
<li>1498 年：達伽馬繞過非洲抵達印度</li>
<li>1519–1522 年：麥哲倫船隊完成第一次環球航行</li></ul>`},
{w:"exchange"},
{h:"交換的另一面",html:`
<p>[[哥倫布大交換]]讓馬鈴薯、玉米養活了歐亞大量人口，但也帶來悲劇：美洲原住民對天花等疾病沒有抵抗力，人口在一百多年內大量死亡。歐洲人又從非洲強迫運送上千萬人到美洲當奴隸，這就是大西洋奴隸貿易。</p>
<p>許多地方從此淪為歐洲國家的[[殖民地]]。</p>`}
],

/* ---------- 第 9 課 ---------- */
{id:9, level:2, icon:"⚙️", title:"革命的時代：理性、自由與機器",
goal:"認識科學革命、啟蒙運動、政治革命與工業革命如何塑造現代世界。",
secs:[
{h:"「革命」這個詞的奇妙旅程",html:`
<p>[[革命]]在中文原本是改朝換代的意思；英文 revolution 原本是天體「旋轉」。後來兩個詞都被用來形容「徹底、快速的改變」。這一課會遇到四種革命。</p>`},
{h:"① 科學革命：不再只聽權威",html:`
<p>過去歐洲人相信地球是宇宙中心，因為古代學者和教會都這麼說。[[科學革命]]時期：</p>
<ul><li>1543 年，哥白尼提出太陽才是中心</li><li>伽利略用望遠鏡觀察到木星的衛星</li><li>1687 年，牛頓用萬有引力解釋天上和地上的運動</li></ul>
<p>最重要的不是某個發現，而是新的方法：<b>觀察、實驗、用數學驗證</b>。</p>`},
{h:"② 啟蒙運動：用理性檢查一切",html:`
<p>既然理性能解釋自然，能不能也用來改善社會？[[啟蒙運動]]的思想家這樣想：</p>
<ul><li>洛克：人天生擁有生命、自由、財產的權利</li><li>孟德斯鳩：政府權力應分成立法、行政、司法，互相制衡</li><li>盧梭：政府的權力來自人民的同意</li></ul>`},
{h:"③ 政治革命：把想法變成國家",html:`
<p>1776 年美國發表《獨立宣言》，脫離英國；1789 年法國大革命推翻君主專制，發表《人權宣言》。從此，「人民是國家的主人」逐漸成為全世界的主流想法。1911 年中國的辛亥革命推翻清朝、建立亞洲第一個共和國，也受這股潮流影響。</p>`},
{h:"④ 工業革命：機器改變生活",html:`<p>約 1760 年起，英國開始了[[工業革命]]。為什麼是英國？它有豐富的煤礦、海外市場、資金，以及鼓勵發明的專利制度。</p>`},
{w:"chain",title:"工業革命的骨牌效應",hint:"一步一步揭開，看蒸汽機怎麼改變整個社會。",steps:[
"⛏️ 煤礦需要抽水 → 發明了蒸汽抽水機",
"🔧 瓦特在 1760–70 年代大幅改良蒸汽機，效率提高許多",
"🏭 蒸汽機帶動紡織機器，工廠取代家庭手工",
"🚂 蒸汽火車與輪船出現，運輸又快又便宜",
"🏙️ 大量農民湧入城市當工人，城市急速擴大",
"😷 工時長、童工、污染、貧民窟等問題出現",
"✊ 工人組織工會爭取權益，社會主義等新思想誕生",
"🌍 工業國家需要原料和市場，開始向外擴張"]},
{h:"今天的你，也活在工業革命之後",html:`<p>工廠、上下班時間、鐘錶精準的生活節奏、大量生產的衣服，都是工業革命的遺產。今天的成衣工廠、電子工廠，其實延續的正是 18 世紀英國紡織工廠開創的生產方式。</p>`}
],
terms:["革命","科學革命","啟蒙運動","工業革命"],
quiz:[
{q:"科學革命最重要的遺產是什麼？",o:["發現了新大陸","觀察與實驗的科學方法","發明了印刷術"],a:1,why:"方法比單一發現更重要，它讓知識可以被檢驗和累積。"},
{q:"主張政府權力應分為立法、行政、司法的是？",o:["孟德斯鳩","牛頓","哥倫布"],a:0,why:"孟德斯鳩提出三權分立。"},
{q:"工業革命最早在哪個國家開始？",o:["法國","英國","中國"],a:1,why:"英國有煤、資金、市場與專利制度。"}
]},

/* ---------- 第 10 課 ---------- */
{id:10, level:2, icon:"🌐", title:"二十世紀：戰爭、對立與連結",
goal:"掌握 20 世紀的主要事件脈絡，理解今天的國際局勢從何而來。",

{h:"帝國主義：瓜分世界",html:`
<p>19 世紀末，工業國家為了原料、市場和國家威望，展開[[帝國主義]]競賽。到 1914 年，非洲幾乎全被歐洲國家瓜分，亞洲許多地區也成為殖民地。例如 1863 年起柬埔寨成為法國的保護國，後來併入法屬印度支那。</p>`},

["1945","二戰結束、聯合國成立","美國在日本投下原子彈，日本投降。各國成立聯合國，希望避免下一次大戰。"],

{h:"冷戰：沒有開火的對抗",html:`
<p>[[冷戰]]期間，美蘇雙方都擁有足以毀滅世界的核子武器，所以不敢直接開戰。它們改用別的方式競爭：軍備競賽、太空競賽、支持不同國家的內戰（韓戰、越戰就是例子）。</p>
<div class="ex"><b>為什麼叫「冷」</b>　「熱戰」是真的開槍打仗；兩強之間沒直接交火，卻長期處在緊張狀態，就像兩個人冷戰不說話，但氣氛很僵。</div>`},
{h:"全球化：世界變成地球村",html:`<p>冷戰結束後，貿易、網路、交通讓世界越來越緊密，這就是[[全球化]]。你身上的一件衣服，可能是美國品牌設計、用印度棉花、在東南亞工廠縫製、再賣到歐洲。全球化帶來便利和經濟成長，也帶來貧富差距、文化衝突和環境問題的爭論。</p>`}
],

/* ---------- 第 11 課 ---------- */
{id:11, level:3, icon:"🧠", title:"歷史思維：因果、變遷與脈絡",
goal:"學會史學家常用的思考工具，並避開最常見的思考陷阱。",
secs:[
{h:"從「背答案」到「會思考」",html:`<p>前面兩層我們認識了很多事件。專業的歷史學習，重點不在記住年份，而在學會提問。以下是史學家最常用的四把工具。</p>`},
{h:"工具一：因果關係",html:`
<p>事件很少只有一個原因。史學家會區分：</p>
<ul><li><b>長期原因</b>（深層結構）：例如一戰前歐洲的軍備競賽、同盟對立、民族主義</li>
<li><b>短期原因</b>（導火線）：例如 1914 年奧匈皇儲遇刺</li></ul>
<div class="ex"><b>生活例子</b>　杯子掉到地上破了。導火線是你碰到它，但長期原因是它一直放在桌子邊緣。只怪最後那一下，就看不到真正的問題。</div>`},
{h:"工具二：變遷與延續",html:`<p>歷史不只有「改變」，也有「沒變」的部分。秦朝滅亡了，但郡縣制延續了兩千年；法國大革命推翻國王，但後來又出現了拿破崙稱帝。問「什麼變了？什麼沒變？」常常能看出更深的道理。</p>`},
{h:"工具三：歷史脈絡",html:`
<p>評價古人要先放回他的時代。古代的人不知道細菌的存在，不能用今天的醫學知識笑他們「迷信」。但理解不等於認同：理解奴隸制存在的原因，並不代表奴隸制是對的。</p>
<p>把現代的東西或觀念錯放進過去，就叫[[時代錯置]]。</p>`},
{w:"anachronism"},
{h:"工具四：多元觀點",html:`
<p>同一件事，不同立場的人看法不同。1492 年哥倫布抵達美洲，對西班牙王室是「開拓新領土」，對當地的泰諾人卻是災難的開始。</p>
<p>還要小心[[歐洲中心論]]：很多傳統的世界史以歐洲發展當作標準，把其他地區當成配角。好的歷史研究會問：「這件事在其他地方的人看來是什麼樣子？」</p>`}
],
terms:["時代錯置","歐洲中心論"],
quiz:[
{q:"一戰的「導火線」是什麼？",o:["軍備競賽","奧匈皇儲遇刺","民族主義"],a:1,why:"遇刺是短期觸發事件；其他選項是長期原因。"},
{q:"下列哪一個是「時代錯置」？",o:["電影裡唐朝人用毛筆寫字","電影裡唐朝人戴眼鏡看報紙","電影裡唐朝人騎馬"],a:1,why:"唐朝沒有眼鏡和報紙。"},
{q:"「理解一個歷史現象的原因」代表什麼？",o:["代表我們贊成它","代表我們更能解釋它，但不一定認同","代表它一定是對的"],a:1,why:"理解和認同是兩件事。"}
]},

/* ---------- 第 12 課 ---------- */
{id:12, level:3, icon:"🕵️", title:"史料批判：當一個歷史偵探",
goal:"學會用系統方法檢驗史料的真偽與可信度。",
secs:[
{h:"每份史料都要被「審問」",html:`
<p>史料不會自動告訴你真相。史學家會進行兩種考證：</p>
<ul><li>[[外部考證]]：這份東西是真的嗎？紙張、墨水、字體、用語符合那個年代嗎？</li>
<li>[[內部考證]]：內容可信嗎？作者在場嗎？有沒有理由說謊或誇大？</li></ul>`},
{h:"偵探的六個問題",html:`
<ol><li><b>誰</b>寫的？他的身分、立場是什麼？</li><li><b>什麼時候</b>寫的？事發當下，還是幾十年後的回憶？</li><li>寫給<b>誰</b>看的？私人日記和公開宣傳，說法會不同。</li><li><b>為什麼</b>寫？記錄、辯護、宣傳，還是賺錢？</li><li>和<b>其他史料</b>對得上嗎？</li><li>作者<b>沒說</b>什麼？沉默有時也是線索。</li></ol>`},
{h:"真實案例：一份造假千年的文件",html:`
<p>中古歐洲流傳一份《君士坦丁贈禮》，聲稱 4 世紀的羅馬皇帝把西歐的統治權送給了教宗。教會用它來主張權力，長達數百年。</p>
<p>1440 年，義大利學者瓦拉仔細分析它的拉丁文，發現裡面用了許多 4 世紀根本還沒出現的詞彙和說法，證明它是幾百年後偽造的。這就是用「時代錯置」破案的經典例子，也是外部考證的典範。</p>`},
{w:"sources"},
{h:"有偏見的史料就沒用嗎？",html:`<p>不是。一份滿是宣傳的戰時海報，雖然不能告訴我們「戰爭真實情況」，卻能準確告訴我們「政府希望人民怎麼想」。史學家的本事，就是知道每份史料能回答什麼問題、不能回答什麼問題。</p>`}
],
terms:["外部考證","內部考證","一手史料"],
quiz:[
{q:"檢查一封信的紙張和墨水是否符合年代，屬於？",o:["外部考證","內部考證","二手史料"],a:0,why:"檢查史料本身的形式和真偽，是外部考證。"},
{q:"瓦拉如何證明《君士坦丁贈禮》是假的？",o:["用碳十四","發現文中的用語不屬於那個時代","找到偽造者的自白"],a:1,why:"語言的時代錯置揭穿了偽造。"},
{q:"一份政府宣傳海報最適合用來研究什麼？",o:["戰爭中真實的死傷人數","政府想塑造的民眾想法","士兵的真實心情"],a:1,why:"宣傳品反映的是發布者的意圖。"}
]},

/* ---------- 第 13 課 ---------- */
{id:13, level:3, icon:"📚", title:"史學史：歷史是怎麼被寫的",
goal:"認識東西方重要史學家與流派，理解「寫歷史的方法」本身也有歷史。",
secs:[
{h:"寫歷史的人也有歷史",html:`<p>[[史學史]]研究的是：不同時代的人，用什麼方法、帶著什麼問題去寫歷史。了解這一點，你讀任何歷史書時，都會多問一句「作者是從什麼角度寫的？」</p>`},
{w:"timeline",title:"史學發展時間軸",hint:"點選每位史學家或流派，看他們帶來了什麼改變。",evs:[
["約前430","希羅多德《歷史》","古希臘人，被羅馬的西塞羅稱為「歷史之父」。他四處旅行打聽，記錄波斯戰爭，也收錄許多傳聞。"],

["1084","司馬光《資治通鑑》","[[編年體]]通史巨作，寫給皇帝當施政參考，書名意思是「幫助治理的一面鏡子」。"],

["1929","年鑑學派","法國的布洛克與費夫爾主張研究普通人、經濟、氣候與心態，開啟社會史。見[[年鑑學派]]。"],
["1949","布勞岱爾","提出[[長時段]]觀念，把歷史分成地理、社會、事件三種速度的時間。"],
["1961","卡爾《歷史是什麼？》","英國史家卡爾強調，史學家會選擇和解釋事實，歷史是現在與過去不斷的對話。"],

["21世紀","數位人文","用資料庫、地圖和程式分析大量史料，見[[數位人文]]。"]]},
{h:"兩大傳統的對照",html:`
<div class="scroll-x"><table><tr><th></th><th>中國傳統史學</th><th>西方近代史學</th></tr>

/* ===== 工具 ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const linkTerms=s=>String(s).replace(/\[\[(.+?)\]\]/g,(m,t)=>TERMS[t]?`<button class="t" data-term="${t}">${t}</button>`:t);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let prog=store.get("hist-progress",{done:[]});
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}
function updProg(){$("#progBar").style.width=(prog.done.length/LESSONS.length*100)+"%"}
function markDone(id){if(!prog.done.includes(id)){prog.done.push(id);store.set("hist-progress",prog);updProg();return true}return false}

/* ===== 名詞彈窗 ===== */
function openTerm(t){const d=TERMS[t];if(!d)return;
  const used=LESSONS.filter(l=>l.terms.includes(t)).map(l=>`<a href="#/lesson/${l.id}">第 ${l.id} 課</a>`).join("、");
  $("#sheetBody").innerHTML=`<h3>${t}</h3><div style="color:var(--ink2)">${esc(d.en)}</div>
  <p><span class="lab">意思</span>${d.m}</p><p><span class="lab">由來</span>${d.o}</p>${used?`<p style="font-size:14px;color:var(--ink2)">出現在：${used}</p>`:""}`;
  $("#sheetBg").style.display="block";requestAnimationFrame(()=>$("#sheet").classList.add("on"));$("#sheetX").focus()}
function closeSheet(){$("#sheet").classList.remove("on");setTimeout(()=>$("#sheetBg").style.display="none",250)}
$("#sheetBg").onclick=closeSheet;$("#sheetX").onclick=closeSheet;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("click",e=>{const b=e.target.closest(".t");if(b){e.preventDefault();openTerm(b.dataset.term)}
  const g=e.target.closest("[data-go]");if(g){location.hash="#/"+g.dataset.go}});
$("#sheet").addEventListener("click",e=>{if(e.target.closest("a"))closeSheet()});

/* ===== 首頁 ===== */
function renderHome(){
  const strata=LEVELS.map(L=>{
    const ls=LESSONS.filter(l=>l.level===L.id).map(l=>`<a class="find" href="#/lesson/${l.id}" style="text-decoration:none">
      ${prog.done.includes(l.id)?'<span class="seal">已<br>習</span>':""}<span class="n">第 ${l.id} 課</span><span class="ic">${l.icon}</span><span class="tt">${l.title}</span></a>`).join("");
    return `<section class="stratum ${L.cls}"><div class="s-head"><h2>${L.name}</h2><span>${L.sub}</span></div><div class="depth">${L.depth}</div><div class="finds">${ls}</div></section>`}).join("");
  const n=prog.done.length;
  return `<div class="hero"><h1>挖掘時間</h1><p>一門從零開始的歷史課。像考古學家一樣，從地表往下挖：先學會看懂時間和證據，再走過人類文明的大旅程，最後學會像史學家一樣思考和研究。</p></div>
  <div class="shaft">${strata}</div>
  <p style="font-size:15px;color:var(--ink2)">${n?`已完成 ${n} / ${LESSONS.length} 課。每完成一課的小測驗，就會蓋上一枚「已習」印章。`:`共 ${LESSONS.length} 課。每課最後有小測驗，答對就能蓋上「已習」印章。建議從第 1 課依序往下挖。`}</p>
  <div class="home-links">
    <button class="hl" data-go="timeline"><b>世界大時間軸</b><small>一條線看完人類幾百萬年，可以依地區篩選</small></button>
    <button class="hl" data-go="glossary"><b>名詞庫</b><small>${Object.keys(TERMS).length} 個專有名詞的意思與由來</small></button>
  </div>
  <p class="howto">使用方式：文章中<button class="t" data-term="歷史">畫虛線的詞</button>可以點開，看它的意思和名字的由來。學習進度只存在這台裝置的瀏覽器裡。${n?` <button class="btn" id="resetBtn" style="margin-left:6px">清除進度</button>`:""}</p>`}

/* ===== 課程頁 ===== */
function renderLesson(id){window.AC_COURSE_GO=function(v){renderLesson(v)};window.AC_COURSE_POSITION=id;
  const l=LESSONS.find(x=>x.id===id);if(!l)return renderHome();
  const L=LEVELS.find(x=>x.id===l.level);
  const body=l.secs.map((s,i)=>s.w?`<div class="widget" data-w="${s.w}" data-i="${i}"></div>`:`<section class="sec"><h3>${s.h}</h3>${linkTerms(s.html)}</section>`).join("");
  const terms=l.terms.map(t=>{const d=TERMS[t];return `<details class="term"><summary><span class="w">${t}</span><span class="en">${esc(d.en)}</span></summary><div class="body"><div><span class="lab">意思</span>${d.m}</div><div><span class="lab">由來</span>${d.o}</div></div></details>`}).join("");
  const quiz=l.quiz.map((q,qi)=>`<div class="q" data-q="${qi}"><p>${qi+1}. ${q.q}</p>${q.o.map((o,oi)=>`<button class="opt" data-o="${oi}">${o}</button>`).join("")}<div class="why"></div></div>`).join("");
  const prev=LESSONS.find(x=>x.id===id-1),next=LESSONS.find(x=>x.id===id+1);
  return `<div class="crumb">${L.name}　第 ${l.id} 課 / 共 ${LESSONS.length} 課</div>
  <h1 class="l-title">${l.icon} ${l.title}</h1><div class="goal">${l.goal}</div>${body}
  <section class="sec"><h3>本課名詞卡</h3><p style="font-size:15px;color:var(--ink2);margin:0">點開卡片，看每個詞的意思和由來。</p><div class="terms">${terms}</div></section>
  <section class="quiz" id="quiz"><h3>小測驗</h3><p style="font-size:15px;color:var(--ink2);margin:4px 0 0">答對 ${Math.ceil(l.quiz.length*2/3)} 題以上就完成這一課。</p>${quiz}<div id="qres"></div></section>
  <nav class="pager">${prev?`<a class="btn" href="#/lesson/${prev.id}">上一課：${prev.title}</a>`:"<span></span>"}${next?`<a class="btn pri" href="#/lesson/${next.id}">下一課：${next.title}</a>`:`<a class="btn pri" href="#/exam">去做總測驗</a>`}</nav>`}

function bindQuiz(root,qs,onFinish){
  let answered=0,right=0;
  root.querySelectorAll(".q").forEach(qel=>{const q=qs[+qel.dataset.q];
    qel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(qel.dataset.done)return;qel.dataset.done=1;answered++;
      const oi=+b.dataset.o;const ok=oi===q.a;if(ok)right++;
      qel.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.o===q.a)x.classList.add("ok")});if(!ok)b.classList.add("no");
      qel.querySelector(".why").innerHTML=(ok?"✅ 答對了！":"❌ 再想想。")+" "+linkTerms(q.why);
      if(answered===qs.length)onFinish(right)})})}

function afterLesson(id){
  const l=LESSONS.find(x=>x.id===id);
  document.querySelectorAll(".widget").forEach(w=>{const s=l.secs[+w.dataset.i];WIDGETS[s.w](w,s)});
  const need=Math.ceil(l.quiz.length*2/3);
  bindQuiz($("#quiz"),l.quiz,right=>{const r=$("#qres");
    if(right>=need){const first=markDone(id);
      r.innerHTML=`<div class="done-box"><span class="seal ${first&&!reduce?"pop":""}">已<br>習</span><div><b>答對 ${right} / ${l.quiz.length} 題，完成第 ${id} 課！</b><br><span style="font-size:15px;color:var(--ink2)">這枚印章會出現在課程地圖上。</span></div></div>`}
    else r.innerHTML=`<div class="done-box"><div><b>答對 ${right} / ${l.quiz.length} 題</b>，還差一點。回頭看看上面的內容，再試一次。<br><button class="btn" id="retry" style="margin-top:8px">重新作答</button></div></div>`;
    const rt=$("#retry");if(rt)rt.onclick=()=>{render();setTimeout(()=>$("#quiz").scrollIntoView(),30)}})}

/* ===== 時間軸頁 ===== */
let tlFilter="全部";
function renderTimeline(){
  const chips=["全部",...Object.keys(REGIONS)].map(r=>`<button class="chip ${r===tlFilter?"on":""}" data-rg="${r}">${r}</button>`).join("");
  const body=TIMELINE.map(E=>{const evs=E.evs.filter(e=>tlFilter==="全部"||e[2]===tlFilter);if(!evs.length)return "";
    return `<div class="era">${E.era}</div>`+evs.map(e=>`<div class="ev" style="--rc:${REGIONS[e[2]]}"><span class="y">${e[0]}</span>${e[1]}<span class="rg">${e[2]}</span></div>`).join("")}).join("");
  return `<h1 class="l-title">世界大時間軸</h1><p style="color:var(--ink2)">同一個時期，世界不同地方在發生什麼？選一個地區篩選，或看「全部」做橫向比較。</p>
  <div class="chips" id="rgChips">${chips}</div><div class="tl">${body}</div>
  <p style="font-size:14px;color:var(--ink2);margin-top:20px">「約」表示年代是學者推估，不同研究可能有些差距。</p>`}

function renderGlossary(){
  return `<h1 class="l-title">名詞庫</h1><p style="color:var(--ink2)">每個名詞都附上意思和由來。知道一個詞怎麼來的，就更容易記住它。</p>
  <input class="search" id="gq" type="search" placeholder="搜尋名詞，例如：革命、民主、civilization" aria-label="搜尋名詞">
  <div class="terms" id="glist"></div>`}
function fillGlossary(q=""){
  q=q.trim().toLowerCase();
  const html=Object.entries(TERMS).filter(([k,d])=>!q||(k+d.en+d.m+d.o).toLowerCase().includes(q)).map(([k,d])=>`<details class="term"><summary><span class="w">${k}</span><span class="en">${esc(d.en)}</span></summary><div class="body"><div><span class="lab">意思</span>${d.m}</div><div><span class="lab">由來</span>${d.o}</div></div></details>`).join("");
  $("#glist").innerHTML=html||`<p>找不到「${esc(q)}」。試試較短的關鍵字，或英文名稱。</p>`}

/* ===== 總測驗 ===== */
let examSet=[];
function renderExam(){
  const all=LESSONS.flatMap(l=>l.quiz.map(q=>({...q,from:l.id})));
  examSet=all.sort(()=>Math.random()-.5).slice(0,12);
  return `<h1 class="l-title">總測驗</h1><p style="color:var(--ink2)">從全部 ${LESSONS.length} 課隨機抽 12 題。答對 10 題以上，就能拿到結業印章。每次進來題目都不一樣。</p>
  <section class="quiz" id="exam">${examSet.map((q,qi)=>`<div class="q" data-q="${qi}"><p>${qi+1}. ${q.q} <span style="font-weight:400;font-size:13px;color:var(--ink2)">（第 ${q.from} 課）</span></p>${q.o.map((o,oi)=>`<button class="opt" data-o="${oi}">${o}</button>`).join("")}<div class="why"></div></div>`).join("")}<div id="eres"></div></section>`}
function afterExam(){bindQuiz($("#exam"),examSet,right=>{const pass=right>=10;if(pass)store.set("hist-graduated",true);
  $("#eres").innerHTML=`<div class="done-box">${pass?`<span class="seal ${reduce?"":"pop"}" style="width:64px;height:64px;font-size:20px">結<br>業</span>`:""}<div><b>答對 ${right} / ${examSet.length} 題</b><br>${pass?"你已經從地表挖到最深處。接下來，試著挑一個自己好奇的小問題開始研究吧。":"把答錯題目標示的那一課再讀一次，然後重新測驗。"}<br><button class="btn" id="again" style="margin-top:8px">換一組題目</button></div></div>`;
  $("#again").onclick=()=>{render();scrollTo(0,0)}})}

/* ===== 路由 ===== */
function render(){
  const h=location.hash.replace(/^#\/?/,"")||"home";const [page,arg]=h.split("/");
  document.querySelectorAll(".nav[data-go]").forEach(n=>n.classList.toggle("on",n.dataset.go===(page==="lesson"?"home":page)));
  const app=$("#app");
  if(page==="lesson"){app.innerHTML=renderLesson(+arg);afterLesson(+arg);document.title=LESSONS.find(l=>l.id===+arg).title+"｜挖掘時間"}
  else if(page==="timeline"){app.innerHTML=renderTimeline();$("#rgChips").onclick=e=>{const c=e.target.closest(".chip");if(c){tlFilter=c.dataset.rg;render()}};document.title="世界大時間軸｜挖掘時間"}
  else if(page==="glossary"){app.innerHTML=renderGlossary();fillGlossary();$("#gq").oninput=e=>fillGlossary(e.target.value);document.title="名詞庫｜挖掘時間"}
  else if(page==="exam"){app.innerHTML=renderExam();afterExam();document.title="總測驗｜挖掘時間"}
  else{app.innerHTML=renderHome();document.title="挖掘時間：從零開始的歷史課";const rb=$("#resetBtn");if(rb)rb.onclick=()=>{if(confirm("確定清除所有學習進度和印章？")){prog={done:[]};store.set("hist-progress",prog);updProg();render()}}}}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});

c14(el){
  const N=200;el.innerHTML=`<h4>碳十四衰變模擬</h4><p class="hint">每一點代表原本的碳十四原子。拖動時間，或按「播放」，看它們怎麼慢慢減少。</p>
  <div class="gridDots">${"<i></i>".repeat(N)}</div>
  <div style="margin-top:12px"><input type="range" id="cr" min="0" max="40000" step="100" value="0" aria-label="經過年數"></div>
  <div class="row"><button class="btn pri" id="cp">播放</button><span id="cv"></span></div><div class="out" id="cx"></div>`;
  const dots=[...el.querySelectorAll(".gridDots i")];const order=dots.map((_,i)=>i).sort(()=>Math.random()-.5);
  const r=el.querySelector("#cr");
  const f=()=>{const t=+r.value,p=Math.pow(.5,t/5730),keep=Math.round(N*p);
    order.forEach((d,k)=>dots[d].classList.toggle("gone",k>=keep));
    el.querySelector("#cv").textContent=`經過 ${t.toLocaleString()} 年`;
    el.querySelector("#cx").innerHTML=`剩下 <b>${(p*100).toFixed(1)}%</b>（${keep} / ${N} 顆）。${t>=5730?` 已經過了 ${(t/5730).toFixed(1)} 個半衰期。`:""}${t>=40000?"<br>剩下的量已經很少，所以碳十四只能測到大約 5 萬年內的東西。":""}`};
  r.oninput=f;f();let timer;
  el.querySelector("#cp").onclick=e=>{if(timer){clearInterval(timer);timer=null;e.target.textContent="播放";return}
    if(+r.value>=40000)r.value=0;e.target.textContent="暫停";timer=setInterval(()=>{r.value=+r.value+400;f();if(+r.value>=40000){clearInterval(timer);timer=null;e.target.textContent="播放"}},90)}},

  ["丙：敵國的史書（五十年後編寫）","我軍在河口與敵交戰，為保存實力，主將下令夜間有序撤退，損失不大。"]];

silkroad(el){
  const C=[["長安",330,120,"唐朝首都，人口百萬，西市聚集了來自各地的商人。絲路東方的起點。"],["敦煌",268,95,"沙漠中的綠洲城市。莫高窟保存了大量佛教壁畫與經書，是東西文化交會的寶庫。"],["撒馬爾罕",185,82,"中亞粟特人的商業中心。粟特商人是絲路上最活躍的中間商。"],["巴格達",112,112,"阿拔斯王朝首都，智慧宮在此翻譯古希臘著作。751 年後，造紙術從這一帶傳往西方。"],["君士坦丁堡",62,72,"拜占庭帝國首都（今伊斯坦堡），連接歐洲與亞洲的樞紐。"],["威尼斯",18,58,"義大利商業城市，把東方貨物轉賣到整個歐洲。馬可波羅就是威尼斯人。"]];
  const pts=C.map(c=>[c[1],c[2]]);

  ${C.map((c,i)=>`<g class="city" data-i="${i}" style="cursor:pointer" tabindex="0" role="button" aria-label="${c[0]}"><circle cx="${c[1]}" cy="${c[2]}" r="7" fill="var(--bronze)" stroke="var(--card)" stroke-width="2"/><text x="${c[1]}" y="${c[2]+20}" text-anchor="middle" font-size="11" fill="var(--ink)">${c[0]}</text></g>`).join("")}
  <text id="camel" font-size="18" x="0" y="0" style="pointer-events:none">🐫</text></svg></div>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="sgo">出發</button></div><div class="out" id="sro">點一座城市。</div>`;
  const path=el.querySelector("#srp"),cam=el.querySelector("#camel"),L=path.getTotalLength(),o=el.querySelector("#sro");
  const put=t=>{const p=path.getPointAtLength(t*L);cam.setAttribute("x",p.x-9);cam.setAttribute("y",p.y-6)};put(0);
  const info=i=>{const c=C[i];o.innerHTML=`<b>${c[0]}</b>　${c[3]}`};
  el.querySelectorAll(".city").forEach(g=>{g.onclick=()=>info(+g.dataset.i);g.onkeydown=e=>{if(e.key==="Enter")info(+g.dataset.i)}});
  el.querySelector("#sgo").onclick=()=>{const t0=performance.now(),dur=reduce?1:7000;let lastCity=-1;
    const step=now=>{const t=Math.min(1,(now-t0)/dur);put(t);
      const idx=Math.min(C.length-1,Math.round(t*(C.length-1)));if(idx!==lastCity&&Math.abs(t*(C.length-1)-Math.round(t*(C.length-1)))<.06){lastCity=idx;info(idx)}
      if(t<1)requestAnimationFrame(step)};requestAnimationFrame(step)}},

exchange(el){
