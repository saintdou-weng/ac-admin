<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>從一根針開始：成衣機台學習課程（針織與梭織）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --paper:#FFFFFF; --ink:#1E3354; --ink2:#44556E; --muted:#6F7C8E;
  --line:#D5DCE4; --navbg:#1E3354; --denim:#2C4A78; --thread:#D99A2B; --thread-d:#9A6510;
  --tint:#FBF6EC; --fabric:#E3E8EE; --ok:#2F7D5B; --bad:#C2413A;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#131A25;--paper:#1A2331;--ink:#E4EAF2;--ink2:#B3BFCF;--muted:#8592A5;--line:#2B384C;
  --navbg:#0D141F;--denim:#7FA3DA;--tint:#221E16;--fabric:#2A3547;--thread-d:#E8B45A}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.85}
a{color:var(--denim)}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.35;color:var(--ink)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--thread);outline-offset:2px;border-radius:4px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--navbg);color:#D8E0EA;padding:30px 22px 48px}
.brand{display:block;text-decoration:none;color:#fff;font-family:var(--serif);font-weight:900;font-size:25px;line-height:1.3;letter-spacing:.04em}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;letter-spacing:0;color:#9FB0C6;margin-top:4px}
.navprog{margin:18px 0 4px;font-size:13px;color:#9FB0C6}
.navprog .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:6px;overflow:hidden}
.navprog .bar i{display:block;height:100%;width:0;background:var(--thread);transition:width .6s}
.nav h3{font-family:var(--sans);font-size:13px;font-weight:500;color:#9FB0C6;margin:24px 0 6px}
.seam{list-style:none;margin:0;padding:0 0 0 24px;position:relative}
.seam::before{content:"";position:absolute;left:7px;top:12px;bottom:12px;border-left:2px dashed rgba(217,154,43,.42)}
.seam a{display:block;position:relative;color:#D8E0EA;text-decoration:none;padding:6px 8px;border-radius:8px;font-size:15px;line-height:1.45}
.seam a::before{content:"";position:absolute;left:-22px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--navbg);border:2px solid rgba(217,154,43,.65);transition:background .4s}
.seam li.done a::before{background:var(--thread);border-color:var(--thread)}
.seam li.cur a{background:rgba(255,255,255,.09);color:#fff}
.seam a:hover{background:rgba(255,255,255,.06)}
.seam .n{color:#8EA0B8;font-size:12px;margin-right:6px}
.navx{margin-top:26px;display:grid;gap:6px}
.navx a{color:#D8E0EA;text-decoration:none;padding:8px 10px;border:1px solid rgba(255,255,255,.14);border-radius:10px;font-size:15px}
.navx a:hover{background:rgba(255,255,255,.06)}
.topbar{display:none}
#scrim{display:none}
.wrap{max-width:780px;margin:0 auto;padding:52px 26px 140px}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .topbar{display:flex;position:sticky;top:0;z-index:30;align-items:center;gap:12px;min-height:54px;padding:env(safe-area-inset-top,0px) 14px 0;background:var(--navbg);color:#fff}
  .topbar button{background:none;border:0;color:#fff;font-size:22px;width:40px;height:40px;cursor:pointer;border-radius:8px}
  .tb-title{font-family:var(--serif);font-weight:900;font-size:18px;flex:1;letter-spacing:.03em}
  .tb-prog{font-size:13px;color:#9FB0C6}
  .nav{position:fixed;left:0;top:0;bottom:0;height:100%;width:min(320px,86vw);z-index:50;transform:translateX(-102%);transition:transform .25s ease;padding-top:calc(24px + env(safe-area-inset-top,0px))}
  .nav.open{transform:none}
  #scrim.show{display:block;position:fixed;inset:0;background:rgba(5,12,24,.45);z-index:40}
  .wrap{padding:26px 18px 120px}
}

/* ---------- typography in lessons ---------- */
.kicker{font-size:14px;color:var(--muted);margin:0}
.lesson-h h1{font-size:clamp(30px,5.4vw,44px);font-weight:900;margin:.15em 0 .35em;letter-spacing:.02em}
.goal{font-size:16px;color:var(--ink2);border-left:3px solid var(--thread);padding:2px 0 2px 14px;margin:0 0 30px}
.wrap h2{font-size:24px;font-weight:700;margin:2.1em 0 .55em}
.wrap h3{font-size:19px;font-weight:700;margin:1.6em 0 .4em}
.wrap p{margin:.7em 0}
.wrap ul,.wrap ol{padding-left:1.4em;margin:.6em 0}
.wrap li{margin:.3em 0}
.big{font-family:var(--serif);font-size:24px;font-weight:900;color:var(--ink);margin:1em 0!important;padding-left:14px;border-left:4px solid var(--thread)}
.note{font-size:14px;color:var(--muted)}
.t{border-bottom:2px dotted var(--thread);cursor:help;font-weight:700}
.t:hover{background:rgba(217,154,43,.12)}
.ex{border:2px dashed var(--thread);border-radius:12px;background:var(--tint);padding:14px 18px;margin:1.5em 0}
.ex>b:first-child{display:block;color:var(--thread-d);font-size:15px;margin-bottom:2px}
.think{background:var(--paper);border-left:4px solid var(--denim);border-radius:0 12px 12px 0;padding:14px 18px;margin:1.5em 0}
.think>b:first-child{color:var(--denim);font-size:15px}
.think p{margin:.3em 0}
details summary{cursor:pointer;color:var(--denim);font-weight:700;font-size:15px;margin-top:6px}
.tbl{overflow-x:auto;margin:1.2em 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6;min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-weight:700;color:var(--ink2);background:var(--paper)}
.timeline{list-style:none;padding:0!important;margin:1em 0}
.timeline li{display:grid;grid-template-columns:4.2em 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);margin:0}
.timeline .y{font-family:var(--serif);font-weight:900;font-size:19px;color:var(--thread-d)}

/* ---------- labs ---------- */
.lab{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin:1.7em 0}
.lab-t{font-weight:700;font-size:16px;margin:0 0 12px;display:flex;gap:10px;align-items:center;line-height:1.4}
.lab-t::before{content:"";flex:none;width:14px;height:14px;border-radius:50%;border:2.5px dashed var(--thread)}
.lab svg{display:block;width:100%;height:auto;max-width:100%}
.svgbox{margin:10px 0;overflow-x:auto}
.cap{font-size:14px;color:var(--muted);margin:.4em 0 0!important}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-size:15px;border:0;border-radius:10px;padding:9px 16px;background:var(--denim);color:#fff;cursor:pointer;line-height:1.4}
@media (prefers-color-scheme:dark){.btn{color:#0D141F}}
.btn.ghost{background:transparent;color:var(--denim);border:1.5px solid var(--denim)}
.btn:hover{filter:brightness(1.08)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.seg button{font-size:14.5px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--denim);border-color:var(--denim);color:#fff}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{color:#0D141F}}
.rl{display:block;font-size:15px;margin:10px 0}
.rl b{color:var(--thread-d)}
input[type=range]{width:100%;accent-color:var(--thread)}
select,input[type=number],input[type=text],input[type=search]{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.verdict{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--bg);font-size:15px;line-height:1.7;border-left:4px solid var(--muted)}
.verdict.ok{border-left-color:var(--ok)}
.verdict.bad{border-left-color:var(--bad)}
.kv{display:grid;grid-template-columns:6.5em 1fr;gap:4px 12px;font-size:15.5px;margin:8px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.fab{fill:var(--fabric);stroke:var(--line);stroke-width:1}
.svt{fill:var(--ink2);font-size:12px;font-family:var(--sans)}
.svt-b{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--sans)}
.steps{list-style:none;padding:0!important;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px!important}
.steps li{margin:0!important}
.steps button{font-size:14.5px;padding:6px 12px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px}
.steps button span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--bg);font-size:12px;font-weight:700}
.steps button.hot{border-color:var(--thread)}
.steps button[aria-pressed="true"]{background:var(--denim);color:#fff;border-color:var(--denim)}
.steps button[aria-pressed="true"] span{background:var(--thread);color:#1E3354}
.hot-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:6px;margin-top:10px}
.hot-list button{font-size:14px;text-align:left;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.hot-list button[aria-pressed="true"]{border-color:var(--thread);background:var(--tint)}
.hs{cursor:pointer}
.hs circle{fill:var(--thread);stroke:#fff;stroke-width:2}
.hs text{fill:#1E3354;font-size:12px;font-weight:700;font-family:var(--sans)}
.hs.on circle{fill:var(--bad)}
.hs.on text{fill:#fff}
.lanes{display:grid;gap:10px;margin:8px 0}
.lane{display:grid;grid-template-columns:7.5em 1fr 4.5em;gap:10px;align-items:center;font-size:14.5px}
.lane .tr{height:14px;border-radius:7px;background:var(--bg);overflow:hidden}
.lane .tr i{display:block;height:100%;width:0;background:var(--thread);border-radius:7px}
.lane .c{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.gsteps{list-style:none;padding:0!important;margin:10px 0 0!important;counter-reset:g}
.gsteps li{border-bottom:1px solid var(--line);padding:10px 0;margin:0!important;display:grid;grid-template-columns:2em 1fr;gap:8px;counter-increment:g}
.gsteps li::before{content:counter(g);font-family:var(--serif);font-weight:900;color:var(--thread-d);font-size:18px}
.gsteps .m{display:inline-block;font-size:13.5px;padding:1px 9px;border-radius:999px;background:var(--bg);color:var(--ink2);margin:2px 6px 0 0}
.gsteps button.m{border:1px solid var(--thread);cursor:pointer;background:var(--tint)}
.gmini{margin-top:6px}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cards2 figure{margin:0;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.cards2 figcaption{font-size:14px;line-height:1.5}
.cards2 figcaption b{display:block;font-size:15px}

/* machine card */
.mc{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:1.2em 0;background:var(--paper)}
.mc h3{margin:0!important}
.mc .en{color:var(--muted);font-size:14px}
.mc .mini{margin:10px 0 4px}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-row.one{grid-template-columns:1fr;max-width:320px;margin:0 auto}
.mini-row{max-width:600px}
.mini-row figure{margin:0}
.mini-row figcaption{font-size:12.5px;color:var(--muted);text-align:center}

/* quiz */
.quiz{margin-top:3.2em;border-top:2px dashed var(--thread);padding-top:1.2em}
.quiz h2{margin-top:.4em!important}
.q{margin:1.3em 0}
.qt{font-weight:700}
.opts{display:grid;gap:8px;margin-top:8px}
.opts button{text-align:left;font-size:15.5px;line-height:1.55;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--denim)}
.opts button:disabled{cursor:default}
.opts button.right{border-color:var(--ok);background:rgba(47,125,91,.12)}
.opts button.wrong{border-color:var(--bad);background:rgba(194,65,58,.1)}
.ex-ans{font-size:15px;color:var(--ink2);margin-top:6px;line-height:1.7}
.okc{color:var(--ok)} .badc{color:var(--bad)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:3em}
.pager a{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-decoration:none;color:var(--ink);font-weight:700;line-height:1.45}
.pager a small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.pager .next{text-align:right;grid-column:2}

/* home */
.hero h1{font-size:clamp(44px,9vw,78px);font-weight:900;letter-spacing:.05em;margin:0;line-height:1.12}
.hero .sub{font-size:18px;color:var(--ink2);max-width:32em;margin:.9em 0 0}
.hero svg{margin:30px 0 6px;cursor:pointer;width:100%;height:auto;display:block}
.hero .row{margin-top:18px}
.map{margin-top:40px}
.lvl{margin:34px 0}
.lvl h2{margin:0 0 2px!important;font-size:23px}
.lvl>p{margin:0 0 10px!important;color:var(--ink2);font-size:15px}
.lessons{list-style:none;margin:0;padding:0!important;border-top:1px solid var(--line)}
.lessons li{margin:0!important}
.lessons a{display:grid;grid-template-columns:2.6em 1fr auto;gap:10px;align-items:baseline;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.lessons a:hover{background:var(--paper)}
.lessons .no{font-family:var(--serif);font-weight:900;color:var(--thread-d);font-size:19px}
.lessons .ttl{font-weight:700;line-height:1.45}
.lessons .ttl small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.lessons .st{font-size:13px;color:var(--muted);white-space:nowrap}
.lessons .done .st{color:var(--ok);font-weight:700}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.tools a{display:block;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--paper);text-decoration:none;color:var(--ink);font-weight:700}
.tools a small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}

/* glossary */
.gl-item{padding:14px 0;border-bottom:1px solid var(--line)}
.gl-item h3{margin:0!important;font-size:20px}
.gl-item .en{color:var(--thread-d);font-size:14px;margin-left:8px;font-family:var(--sans);font-weight:500}
.gl-item p{margin:.3em 0!important;font-size:15.5px}
.gl-item a{font-size:14px}

/* popover */
.pop{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(540px,calc(100vw - 24px));max-height:60vh;overflow:auto;background:var(--navbg);color:#E8EEF5;border-radius:16px;padding:18px 44px 16px 20px;box-shadow:0 14px 44px rgba(5,12,24,.4);z-index:60}
.pop[hidden]{display:none}
.pop h4{margin:0;font-size:22px;color:#fff}
.pop .en{color:var(--thread);font-size:14px}
.pop p{font-size:15.5px;line-height:1.75;margin:8px 0 0}
.pop a{color:#F0C27A;font-size:14px}
.pop .x{position:absolute;right:8px;top:6px;background:none;border:0;color:#9FB0C6;font-size:26px;cursor:pointer;width:36px;height:36px}

/* exam + certificate */
.eq{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:12px 0;background:var(--paper)}
.eq legend{font-weight:700;padding:0 4px}
.eq label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:15.5px;line-height:1.55;cursor:pointer}
.eq input{margin-top:6px;accent-color:var(--denim)}
.eq.r{border-color:var(--ok)} .eq.w{border-color:var(--bad)}
.eq .ex-ans{border-top:1px dashed var(--line);padding-top:6px}
.score{font-family:var(--serif);font-weight:900;font-size:56px;color:var(--thread-d);line-height:1}
.cert{margin:24px 0;background:#FFFDF8;color:#1E3354;border-radius:6px;padding:14px}
.cert-in{border:2.5px dashed #D99A2B;outline:1.5px solid #1E3354;outline-offset:6px;padding:40px 26px;text-align:center}
.cert .c1{font-family:var(--serif);font-size:15px;letter-spacing:.4em;color:#9A6510;margin:0}
.cert h2{font-family:var(--serif);font-size:40px;margin:.35em 0!important;color:#1E3354;border-bottom:1.5px solid #1E3354;display:inline-block;min-width:6em;padding:0 .4em}
.cert p{font-size:16px;line-height:1.9;color:#1E3354}
.cert .c-date{font-size:14px;color:#5B6B82}

@media print{
  body *{visibility:hidden}
  #cert,#cert *{visibility:visible}
  #cert{position:absolute;left:0;top:0;width:100%;margin:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="topbar"><button id="menuBtn" aria-label="開啟課程目錄" aria-controls="nav" aria-expanded="false">☰</button><span class="tb-title">從一根針開始</span><span class="tb-prog" id="tbProg"></span></div>
<div class="app">
  <aside class="nav" id="nav" aria-label="課程目錄"></aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="scrim"></div>
<div id="pop" class="pop" role="dialog" aria-live="polite" hidden></div>
<script>
/* ================= 名詞辭典（名稱、英文、意思與由來、出現課次） ================= */
const G = [
['成衣','Ready-to-wear garment','「成」是完成、現成的意思。以前的人買布請裁縫量身訂做；工業化以後，工廠照標準尺寸（S、M、L……）大量生產，做好了直接擺在店裡賣，這就叫成衣。','l1'],
['車縫','Machine sewing','「車」本來指靠輪子轉動的機械，像紡車、車床。縫紉機靠手輪和馬達轉動，所以用機器縫就叫「車」，例如「車衣服」「車一條線」。粵語的「車衣」也是同樣的用法。','l1'],
['工序','Operation','把一件衣服拆開來的每一個小步驟，例如「合肩」「上袖」「車下擺」。「序」是順序，工序就是照順序排好的工作。','l1'],
['車工','Sewing operator','操作縫紉機的作業員。熟練的車工看布、控速、對位都又快又準，是成衣廠最核心的人力。','l1'],
['梭織','Woven fabric','「梭」是織布機上兩頭尖、像小船的工具，裡面裝著緯紗，在經紗之間來回穿梭。用經緯「上下交錯」織出來的布就叫梭織布。現代織布機很多已改用劍桿、噴氣，不用梭子了，但名字保留下來。','l2'],
['梭','Shuttle','織布機上載著緯紗、來回穿越經紗的船形工具。英文 shuttle 也有「來回往返」的意思，所以太空梭（Space Shuttle）、接駁車（shuttle bus）都用這個字。','l2'],
['經紗','Warp','「經」本來就是指織布機上先拉好、直向的紗。因為它是固定不動的主幹，後來引申出「常道、準則」的意思（如經典）；地圖上直向的經線，名字也從這裡來。','l2'],
['緯紗','Weft','織布時橫向穿過經紗的紗。地圖上橫向的緯線，名字就是從織布來的。','l2'],
['平紋','Plain weave','經紗和緯紗一上一下輪流交錯，是最簡單、最牢固的織法。襯衫的府綢、帆布都是平紋。','l2'],
['斜紋','Twill','每一行交錯的位置錯開一格，布面出現斜斜的紋路。丹寧布、卡其布都是斜紋。','l2'],
['緞紋','Satin','經紗（或緯紗）一次浮在表面好幾格才交錯一次，布面又滑又亮，但比較不耐磨。一般認為 satin 這個字和中世紀阿拉伯商人對泉州港的稱呼 Zaitun（刺桐）有關，因為絲綢從那裡出口。','l2'],
['丹寧','Denim','牛仔布：用靛藍色經紗和白色緯紗織成的斜紋布，所以正面偏藍、反面偏白。一般認為 denim 來自法文 serge de Nîmes（法國尼姆城的斜紋布），「丹寧」是音譯。','l2'],
['針織','Knit fabric','用針把紗線勾成一個個線圈，再一圈套一圈連起來的布。因為是靠「針」把線「織」起來，所以叫針織。手打毛衣也是針織。','l2'],
['緯編','Weft knitting','一條紗線沿著橫向（緯向）繞成一整排線圈，再一排接一排往上長。T恤的汗布、羅紋都是緯編。','l2'],
['經編','Warp knitting','很多條紗各自沿著直向（經向）成圈，左右互相勾連。比較不容易脫散，常見於蕾絲、網布、運動服的網眼。','l2'],
['汗布','Single jersey','最基本的單面針織布，正面是一條條V字紋，反面像小波浪。以前主要拿來做吸汗的汗衫，所以叫汗布。英文 jersey 來自英吉利海峽的澤西島（Jersey），當地以編織漁夫毛衣出名。','l2'],
['羅紋','Rib knit','正面線圈和反面線圈一直條一直條輪流排列，表面一條條凸起，像肋骨（rib）一樣，彈性特別好，常用在領口、袖口、褲腳。','l2'],
['珠地','Piqué','表面有小顆粒、像蜂巢的針織布，Polo 衫最常用。piqué 是法文，原意是「刺、繡出凹凸」；中文「珠地」形容布面像鋪滿小珠子。','l2'],
['縫紉機','Sewing machine','日文叫「ミシン」（mishin），是英文 sewing machine 後半 machine 的音譯。台灣和不少華人工廠的機台用語受日本影響，例如「三本車」。','l3'],
['平車','Flatbed lockstitch machine','「平」指的是機台放布的車床面是平的（flatbed），布可以平放著推送；相對的還有筒車、高車等造型。平車車出的是鎖式線跡 301，是成衣廠數量最多的機台。','l4'],
['面線','Needle thread','從機頭上方線筒來、穿過針眼的線，車好後主要在布的正面看得到。','l4'],
['底線','Bobbin thread','繞在梭心上、從台面下方供應的線，車好後主要在布的反面看得到。','l4'],
['梭心','Bobbin','繞底線的小線軸。早期縫紉機用一個像織布梭子一樣來回擺動的零件裝著它，所以叫「梭」心；英文 bobbin 原本就是紡織用的小線軸。','l4'],
['梭殼','Bobbin case','包住梭心的小殼子，側面有一片小彈簧片壓著底線，轉它上面的小螺絲就能調底線張力。','l4'],
['旋梭','Rotary hook','在台面下不停旋轉的勾子，負責把面線勾下來、繞過梭心。從前是「擺動的梭」，後來改良成「旋轉的梭」，所以叫旋梭。工業平車每車一針，旋梭轉兩圈。','l4'],
['送布牙','Feed dog','針板下面一排像牙齒的鋸齒片，會上下前後移動，把布一格一格往後送。英文 dog 在機械用語裡指「咬住、卡住東西的零件」；中文取它像牙齒的樣子。','l4'],
['壓腳','Presser foot','把布壓在送布牙上的零件，形狀像一隻小腳。壓力太輕布會跳動，太重布會被壓出痕跡。','l4'],
['針板','Needle plate','台面上、針正下方的金屬板，中間有讓針穿過的針孔，旁邊有讓送布牙冒出來的長槽，上面常刻有縫份刻度。英文也叫 throat plate。','l4'],
['挑線桿','Take-up lever','機頭前方上下擺動的小桿：往下時放出面線讓旋梭勾，往上時把線收回，把針目拉緊。「挑」就是把線挑起來。','l4'],
['夾線器','Tension regulator','兩片小圓盤夾住面線，把螺帽轉緊或轉鬆，就能調整面線的鬆緊（張力）。','l4'],
['手輪','Handwheel','機頭右側的大輪子。轉動它能讓針慢慢上下，用來對位、穿線或檢查。工業平車的手輪只能朝操作者的方向轉。','l4'],
['膝抬','Knee lifter','桌子下方用膝蓋頂的小板，一頂壓腳就抬起來，雙手不必離開布。','l4'],
['鎖式線跡','Lockstitch','面線和底線在布的中間互相「鎖」住的線跡，ISO 編號 301。牢固、正反面看起來一樣，但幾乎沒有彈性。','l5'],
['鏈式線跡','Chainstitch','線自己一圈套一圈，像鎖鏈一樣連下去，用彎針代替梭心。有彈性、不用換底線，但抓對線頭一拉，可能整條拆開。','l5'],
['彎針','Looper','拷克車、三本車、鏈式車裡代替旋梭的彎曲零件，帶著線來回擺動，去勾住面線形成線圈。英文 looper 就是「做線圈的東西」。','l5'],
['線跡','Stitch','線在布上形成的圖樣，每一針叫一個針目。國際標準 ISO 4915 用三位數字把線跡分類。','l6'],
['ISO 4915','ISO 4915 stitch types','國際標準化組織為線跡訂的分類號碼。百位數代表家族：100 單線鏈式、200 手縫類、300 鎖式、400 多線鏈式、500 包縫、600 覆蓋縫。和客戶、機台廠溝通時講號碼最不會誤會。','l6'],
['針號','Needle size','常寫成 90/14。前面是公制 Nm，數字等於針桿直徑（單位 0.01 mm），Nm 90 就是約 0.9 mm；後面是美式 Singer 號碼。數字越大針越粗。','l7'],
['球針','Ball point needle','針尖磨成小圓頭的針（如 SES、SUK）。車針織布時，圓頭會把紗線「推開」而不是「刺斷」，避免破洞。','l7'],
['Tex','Tex','表示線粗細的單位：1000 公尺長的線有幾公克重，數字越大越粗。另一種常見的 Tkt（票號）剛好相反，數字越大越細。','l7'],
['包芯線','Core-spun thread','中間是強韌的聚酯長絲當「芯」，外面「包」一層短纖維的縫線。又強又耐熱、好車，是成衣廠最常用的線。','l7'],
['膨體紗','Textured thread','經過加工、蓬鬆柔軟又有伸縮性的聚酯或尼龍線，常放在拷克車、三本車的彎針上，讓針織衣的線跡柔軟有彈性。','l7'],
['差動送布','Differential feed','前後兩組送布牙用不同速度送布。後面的主送布牙速度固定，前面的差動送布牙可以快一點或慢一點，用來防止針織布被拉長或薄布起皺。「差動」就是「動作有差別」。','l8'],
['人字車','Zigzag machine','針會左右擺動，線跡像一連串「人」字（或 Z 字）的平車，ISO 304。有一點彈性，常用在內衣、縫鬆緊帶。','l9'],
['拷克','Overlock','一邊把布邊切齊、一邊用線把布邊包起來的機台。日本人把拷克車叫「ロックミシン」（lock machine），一般認為「拷克」就是這個 lock 的音譯。英文也叫 serger。','l10'],
['三本車','Coverstitch machine','「本」是日文數長條物品的量詞，「三本針」就是三支針。台灣工廠沿用日文說法，把三針覆蓋縫機叫三本車，兩針的叫二本車。','l11'],
['爬網','Coverstitch (netted back)','覆蓋縫線跡的反面，彎針線在幾條直線之間來回交錯，看起來像一張網，所以工廠常叫它「爬網」。英文 coverstitch 是「蓋住布邊的線跡」。','l11'],
['扁車','Flatlock machine','把兩塊布邊對邊平平接起來、正反兩面都有網狀線覆蓋的機台（如四針六線 607）。接縫又扁又平，貼身穿不磨皮膚。','l11'],
['筒車','Cylinder bed machine','車床做成細長圓筒狀的機台，可以把袖口、褲腳這種「筒」狀部位套上去轉著車。','l11'],
['打結車','Bartack machine','在一小段範圍內來回車很多針密集的鋸齒，像「打一個結」一樣把受力點釘牢，例如口袋角、褲耳、門襟底部。','l12'],
['鈕門','Buttonhole','「鈕」是鈕扣，「門」是讓鈕扣進出的開口。鈕門車會先把開口四周車好，再用刀切開。','l12'],
['撬邊','Blind hem','「撬」是挑起來的意思。撬邊車的彎針每一針只挑起表布幾根紗，所以正面幾乎看不到線跡，用在西褲褲腳、裙擺。','l12'],
['埋夾車','Feed-off-the-arm machine','車「埋夾縫」的機台：兩片布邊互相包住，把毛邊「埋」起來再「夾」住壓線。一般認為這個叫法來自香港成衣業的粵語用語。牛仔褲內長縫、襯衫側縫常用。','l12'],
['多針車','Multi-needle machine','一次好幾支針並排車的機台，常用來車鬆緊帶腰頭、褲耳帶。因為日本 Kansai Special 這個品牌很有名，工廠常直接叫它「Kansai」。','l12'],
['張力','Thread tension','線被拉住的鬆緊程度。面線和底線的張力要平衡，交鎖點才會剛好在布的中間。','l14'],
['針距','Stitch length','相鄰兩針之間的距離，平車常用 2～3 mm。針距越小，線跡越密。','l14'],
['SPI','Stitches per inch','每英寸有幾針。換算：針距（mm）＝ 25.4 ÷ SPI，例如 SPI 12 約等於針距 2.1 mm。歐美客戶的工藝單常寫 SPI。','l14'],
['縫份','Seam allowance','縫線到布邊之間留下的那一段布。「份」是預留的份量；太窄容易爆口，太寬浪費布又厚。','l14'],
['縫型','Seam type','布片怎麼疊、怎麼摺、怎麼接在一起的方式，由 ISO 4916 分類。線跡是「線怎麼走」，縫型是「布怎麼放」。','l14'],
['跳針','Skipped stitch','旋梭或彎針沒勾到線環，漏掉一針，線跡上出現一段特別長的線。','l15'],
['縫皺','Seam pucker','車好的接縫起皺、不平整，薄布和高密度布最常見。','l15'],
['斷針管理','Needle control','品牌客戶要求的安全制度：換針要以舊換新，斷針要找齊碎片並登記，避免針頭殘留在衣服裡傷到消費者。','l16'],
['伺服馬達','Servo motor','直接驅動、能精準控制轉速和停針位置的馬達，不車的時候不轉，比傳統離合器馬達省電又安靜。servo 源自拉丁文 servus（僕人），意思是「隨時跟著指令動作」。','l17'],
['SMV','Standard Minute Value','標準分鐘值：受過訓練的作業員，用正常速度完成一道工序需要的分鐘數（含合理的寬放時間）。也叫 SAM。排產、算效率、算工價都靠它。','l17'],

html:`
<p>你身上穿的衣服，是從一朵棉花或一滴石油開始的。先看看它走過哪些站，再看看我們要學的縫紉「機台」在哪一站出場。</p>
<div class="lab" data-lab="flow"></div>
<h2>什麼叫「成衣」？</h2>
<p><b class="t">成衣</b>就是「現成做好的衣服」。一百多年前，大部分人是買一塊布，請裁縫量身體、一件一件縫。後來工廠照標準尺寸 S、M、L 大量生產，做好了放在店裡直接買，這就是成衣。</p>
<h2>為什麼工廠說「車」衣服？</h2>
<p>在台灣和很多華人工廠裡，用縫紉機縫東西叫做<b class="t">車縫</b>，縫紉機叫「車」或「機台」。「車」這個字本來是指靠輪子轉動的機械，像紡車、車床；縫紉機靠手輪和馬達轉動，所以用它縫就叫「車」。你會聽到「車一條線」「這台車」「車工」這些說法。</p>
<div class="ex"><b>舉個例子</b>一件最簡單的短袖T恤，大約要經過十道左右的小步驟：合肩、上領、壓領、上袖、合脅、車袖口、車下擺、車標籤……每一個小步驟叫一個<b class="t">工序</b>，常常要用到不同的機台。一條牛仔褲更複雜，工序常常超過三十道。</div>
<h2>成衣廠裡的人</h2>
<p>車縫部門通常分成好幾條生產線，每條線有十幾到幾十位<b class="t">車工</b>，一個人負責一兩道工序，裁片像接力賽一樣往下傳。另外還有組長（帶線、安排位置）、機修師傅（調機、修機）、品檢（QC）等角色。</p>
<div class="think"><b>想一想</b><p>為什麼不讓一個人從頭到尾做完一整件衣服，而要拆成很多工序？</p>
<details><summary>看答案</summary><p>拆開以後，每個人只做一兩個動作，可以練到非常熟練；每道工序也能配上最適合的專用機台，例如包布邊就用拷克車。整條線加起來，速度和品質都比一個人包辦高很多。這就是工業化「分工」的威力。</p></details></div>
<h2>這門課會學到什麼</h2>
<p>入門篇先認識布和縫紉機；原理篇拆開線跡、針線、送布的秘密；機台篇一台一台認識工廠裡的車；專業篇學會調機、排除問題、保養安全和效率。每一課最後有三題小測驗，答對兩題就算完成。</p>
<p>看到<b class="t" data-g="車縫">底下有虛線的字</b>就點一下，會跳出它的意思和名稱的由來。</p>

/* ---------------- 第 2 課 ---------------- */
{id:'l2', lv:1, title:'梭織與針織', sub:'兩大布料家族，決定用什麼車',
goal:'分得出梭織布和針織布，知道它們的結構差在哪裡，以及為什麼這會影響機台的選擇。',
html:`
<p>布料大致分成兩大家族：<b class="t">梭織</b>和<b class="t">針織</b>。學機台一定要先認識布，因為<strong>布是什麼，決定了要用什麼車、什麼針、什麼線</strong>。</p>
<h2>梭織：一上一下的十字交錯</h2>
<p>梭織布由兩組紗組成。先在織布機上直向拉好一整排<b class="t">經紗</b>，再讓一條<b class="t">緯紗</b>橫著一上一下穿過去，來回一次又一次。負責帶著緯紗穿來穿去的工具，就是兩頭尖尖、像小船的<b class="t">梭</b>子。</p>
<div class="ex"><b>舉個例子</b>地圖上的「經線」是直的、「緯線」是橫的，名字正是從織布來的。下次看地球儀，可以想像整個地球是被「織」起來的。</div>
<div class="lab" data-lab="weave"></div>
<p>只要改變經緯交錯的規律，就能織出不同的「組織」：</p>
<ul>
<li><b class="t">平紋</b>：一上一下，最牢固。襯衫的府綢、帆布。</li>
<li><b class="t">斜紋</b>：每一行錯開一格，出現斜線。牛仔褲的<b class="t">丹寧</b>布、卡其褲。</li>
<li><b class="t">緞紋</b>：紗線在表面浮一大段，滑滑亮亮。禮服、睡衣、領帶。</li>
</ul>
<h2>針織：一圈套一圈的線圈</h2>
<p>針織布沒有經緯十字交錯，而是用針把紗線勾成一個個小線圈，下一排線圈再穿過上一排，一路往上長。手打毛衣就是手工的針織。</p>
<div class="lab" data-lab="knit"></div>
<p>針織又分兩類：<b class="t">緯編</b>（一條紗橫著繞一整排）和<b class="t">經編</b>（很多條紗直著走、互相勾連）。成衣廠最常見的針織布有：</p>
<ul>
<li><b class="t">汗布</b>（單面 jersey）：T恤。</li>
<li><b class="t">羅紋</b>：領口、袖口，彈性特別好。</li>
<li><b class="t">珠地</b>：Polo 衫。</li>
<li>毛圈布、刷毛布：帽T、運動褲。</li>
</ul>
<h2>兩大家族比一比</h2>
<div class="tbl"><table>
<tr><th></th><th>梭織</th><th>針織</th></tr>
<tr><td>結構</td><td>經緯十字交錯</td><td>線圈互相套住</td></tr>
<tr><td>彈性</td><td>幾乎沒有（加了彈性紗的除外）</td><td>好，尤其是橫向</td></tr>
<tr><td>剪開的布邊</td><td>容易「脫紗」，一根根散開</td><td>不太會散，但容易捲邊；被勾到會「脫圈」跑線</td></tr>
<tr><td>代表衣物</td><td>襯衫、牛仔褲、西裝、外套</td><td>T恤、Polo 衫、運動服、內衣</td></tr>
<tr><td>主力機台</td><td>平車、五線拷克、埋夾車</td><td>拷克車、三本車、扁車</td></tr>
</table></div>
<h2>怎麼分辨？三招就夠</h2>
<ol>
<li><strong>拉一拉</strong>：橫向輕輕拉，很有彈性、會變窄的多半是針織。</li>
<li><strong>看表面</strong>：湊近一點看，梭織是一格格小方格；針織正面是一條條 V 字，反面像小波浪。</li>
<li><strong>看剪口</strong>：梭織的剪口會掉出一根根紗；針織的剪口會往內捲。</li>
</ol>
<div class="ex"><b>舉個例子</b>拿出制服襯衫和運動服，各拉一下領口。襯衫幾乎拉不動，運動服可以拉很開，一個梭織、一個針織。</div>
<h2>布的家族，決定機台的選擇</h2>
<p>針織布會伸縮，如果用沒有彈性的線跡去縫，一穿一拉線就斷了，所以針織衣大量使用有彈性的<b class="t">拷克</b>和<b class="t">三本車</b>；針也要換成不會刺斷紗線的<b class="t">球針</b>。梭織布不會伸縮，但布邊會散，所以用牢固的平車縫合，再用拷克把布邊包起來。這個原則整門課都會一直用到。</p>
`,
quiz:[
 ['「經紗」指的是？',['橫著穿過去的紗','縫衣服用的線','織布時先固定好、直向的紗','針織的線圈'],2,'經紗是先在織布機上直向拉好的紗，緯紗才是橫向穿過去的。'],
 ['下面哪一種通常是針織布？',['牛仔褲的丹寧布','T恤的汗布','襯衫的府綢','西裝的毛料'],1,'汗布是最基本的單面針織布，T恤最常用。丹寧、府綢、西裝料都是梭織。'],
 ['針織衣服為什麼要用有彈性的線跡？',['布會伸縮，線跡不能伸縮的話一拉就斷線','因為比較便宜','只是為了好看','因為針織布太厚'],0,'針織布一穿一拉就會伸長，線跡要跟著伸縮，不然線會斷。']
]},

/* ---------------- 第 3 課 ---------------- */
{id:'l3', lv:1, title:'縫紉機的誕生', sub:'那個開在針尖的針眼',
goal:'了解縫紉機要解決什麼難題、關鍵的發明是什麼，以及家用車和工業車差在哪裡。',
html:`
<p>縫紉機發明以前，所有衣服都是一針一線用手縫的。熟練的裁縫一分鐘大約只能縫三、四十針，一件男襯衫常常要縫上十幾個小時。先來比一比速度：</p>
<div class="lab" data-lab="speed"></div>
<h2>難題：機器很難「穿過去再拉回來」</h2>
<p>手縫的時候，針整支穿過布，從另一面拉出來，再從另一面穿回來。但要讓機器「把針整支穿過去、再從另一邊抓回來」非常困難。發明家們想了很久，最後的解法是：</p>
<p class="big">把針眼開在針尖旁邊。</p>
<p>針不必整支穿過布，只要帶著線往下刺一下，把線「送」到布的背面，再由背面另一個機構（梭子或彎針）把線勾住就好。這是幾乎所有縫紉機共同的秘密。</p>
<div class="ex"><b>舉個例子</b>想像你和朋友隔著一道有小洞的牆傳繩子：你把繩子從洞口推過去，朋友在另一邊把它套在一根棍子上，你再把繩子拉回來，繩子就被「扣」在洞裡了。縫紉機的面線和底線就是這樣合作的。</div>
<h2>幾位重要的發明家</h2>
<ol class="timeline">
<li><span class="y">1830</span><span>法國的蒂莫尼耶（Thimonnier）做出單線鏈式縫紉機，還開工廠做軍服。據說當地裁縫怕丟飯碗，闖進工廠把機器砸了。</span></li>
<li><span class="y">1846</span><span>美國的豪（Elias Howe）取得「兩條線互相鎖住」的縫紉機專利，也就是今天平車線跡的祖先。有個流傳很廣的故事說，他是夢見長矛尖端有個洞，才想到把針眼開在針尖。這故事很有名，但真假已無從查證。</span></li>
<li><span class="y">1851</span><span>美國的勝家（Isaac Singer）改良成針直上直下、有壓腳、用腳踏板驅動的機型，還用分期付款大量賣給家庭，讓縫紉機走進千家萬戶。</span></li>
<li><span class="y">1900s</span><span>電動馬達和工業專用機台普及，成衣開始大量工廠化生產；日本的 JUKI、Brother 等品牌後來成為工業車的主力。</span></li>
<li><span class="y">今天</span><span>電腦控制、伺服直驅馬達、自動剪線、自動模板機……一台車一分鐘可以車幾千針。</span></li>
</ol>
<p>日文把縫紉機叫「ミシン」，是從英文 machine 音譯來的。台灣的成衣業早年跟日本學技術，所以很多機台和零件的叫法都帶著日文的影子，後面的課會一直看到。</p>
<h2>家用縫紉機 vs 工業縫紉機</h2>
<div class="tbl"><table>
<tr><th></th><th>家用縫紉機</th><th>工業縫紉機</th></tr>
<tr><td>速度</td><td>每分鐘約幾百到一千多針</td><td>平車可達約 5,000 針</td></tr>
<tr><td>功能</td><td>一台什麼都能做一點</td><td>一台只專做一種線跡，做到最好</td></tr>
<tr><td>耐用度</td><td>偶爾使用</td><td>一天運轉 8～10 小時以上，天天如此</td></tr>
<tr><td>馬達</td><td>藏在機身裡的小馬達</td><td>裝在桌子下面，現在大多是伺服馬達</td></tr>
<tr><td>潤滑</td><td>偶爾滴油</td><td>油盤和油泵自動循環，或是少油的半乾式機頭</td></tr>
</table></div>
<div class="ex"><b>舉個例子</b>每分鐘 5,000 針，等於每秒 80 多針，比眼睛能看清楚的速度快得多。所以工業車縫的安全規定特別嚴格，這在第 16 課會講。</div>
`,
quiz:[
 ['縫紉機最關鍵的發明之一是什麼？',['腳踏板','針眼開在針尖附近的針','電燈','剪刀'],1,'針眼開在針尖旁，針只要把線送到布背面，再由下方的梭或彎針勾住就行，不必整支穿過布。'],
 ['1846 年取得「兩條線互相鎖住」縫紉機專利的是誰？',['愛迪生','瓦特','牛頓','Elias Howe（豪）'],3,'Howe 的鎖式縫紉機是今天平車 301 線跡的祖先。'],
 ['現代工業平車每分鐘最高大約能車幾針？',['約 50 針','約 500 針','約 5,000 針','約 50,000 針'],2,'工業平車最高約每分鐘 5,000 針，也就是每秒 80 多針。']
]},

/* ---------------- 第 4 課 ---------------- */
{id:'l4', lv:1, title:'認識工業平車', sub:'點一點，認識每個零件',
goal:'叫得出工業平車主要零件的名字，知道面線和底線各走哪條路。',
html:`
<p>成衣廠裡數量最多的機台，就是工業<b class="t">平車</b>。它車出的是鎖式線跡，幾乎每一件衣服都會用到。先把它的身體認識一遍。</p>
<h2>為什麼叫「平」車？</h2>
<p>「平」指的是機台放布的<strong>車床面是平的</strong>（英文 flatbed），布可以平平地放在上面推送。工業車還有其他造型的車床，專門對付不同形狀的部位：</p>
<div class="lab" data-lab="beds"></div>
<div class="lab" data-lab="parts"></div>
<h2>一條面線的旅程</h2>
<p>穿線的順序，就是<b class="t">面線</b>走的路：</p>
<ol>
<li>線架上的大線筒</li>
<li>機頭上的過線孔、過線鉤</li>
<li><b class="t">夾線器</b>：兩片圓盤夾住線，控制鬆緊</li>
<li>挑線彈簧：吸收一瞬間的拉扯</li>
<li><b class="t">挑線桿</b>：上下擺動，放線、收線</li>
<li>針桿上的過線鉤</li>
<li>針眼</li>
</ol>
<p><b class="t">底線</b>則是先在繞線器上繞滿<b class="t">梭心</b>，放進<b class="t">梭殼</b>，再裝到台面下的<b class="t">旋梭</b>裡。</p>
<div class="ex"><b>舉個例子</b>面線像從水塔流下來的水，要經過好幾個水龍頭（夾線器、挑線桿）控制流量，最後從針眼這個出水口出去。中間任何一處沒穿好，線就會亂掉或斷掉。</div>
<h2>工業平車的操作手感</h2>
<ul>
<li>腳踏板往前踩是車，踩得越深越快；腳跟往後踩是抬<b class="t">壓腳</b>，電腦車還會自動剪線。</li>
<li>用膝蓋往右頂<b class="t">膝抬</b>，壓腳就抬起來，雙手不用離開布。</li>
<li><b class="t">手輪</b>只能朝自己的方向轉，反轉可能讓線纏進旋梭。</li>
<li>布是被<b class="t">送布牙</b>送走的，手只負責引導方向，不要用力推或拉。</li>
</ul>
`,
quiz:[
 ['「平車」的「平」指的是？',['價格很平價','只能車平面的布','機台的車床面是平的','平均速度很穩定'],2,'平車的車床面是平的（flatbed），所以叫平車；還有筒車、高車等不同造型。'],
 ['負責把布一格一格往後送的零件是？',['送布牙','壓腳','挑線桿','手輪'],0,'送布牙藏在針板的槽裡，每一針都把布往後推一個針距。'],
 ['旋梭和梭心裝在哪裡？',['機頭上方','手輪裡面','馬達旁邊','台面下方、針的正下方'],3,'旋梭在台面下、針的正下方，負責勾住面線繞過梭心。']
]},

/* ---------------- 第 5 課 ---------------- */
{id:'l5', lv:2, title:'兩條線怎麼鎖在一起', sub:'放慢看鎖式與鏈式線跡',
goal:'能一步一步說出鎖式線跡怎麼形成，並比較鎖式和鏈式的優缺點。',
html:`
<p>縫紉機一秒鐘車好幾十針，快到看不清楚。這一課把它放慢，一格一格看兩條線是怎麼「鎖」在一起的。</p>
<h2>兩條線：面線和底線</h2>
<p>平車用兩條線：從上方來的<b class="t">面線</b>，和從下方梭心來的<b class="t">底線</b>。它們在布的中間交叉扣住，所以叫<b class="t">鎖式線跡</b>（lockstitch）。</p>
<div class="lab" data-lab="lockstitch"></div>
<h2>為什麼針往上抬，才會有線環？</h2>
<p>針往下刺穿布時，面線被布緊緊夾住。針到最低點後開始往上走，針眼附近的線被布的摩擦力卡住、跟不上針，就在針旁邊鼓出一個小圈，這就是「線環」。工業車針的側面有一個小凹口，叫針缺口，就是讓旋梭尖能貼著針擠進去、準確勾到線環。</p>
<div class="ex"><b>舉個例子</b>把一條繩子穿過毛巾往下拉，再慢慢往上提，毛巾下面的繩子會先「鼓」出一個小圈。旋梭要勾的，就是這個小圈。</div>
<h2>旋梭一針轉兩圈</h2>
<p>工業平車的旋梭和針的速度比是 2 比 1：針上下一次，旋梭轉兩圈。當機台每分鐘車 5,000 針時，旋梭一分鐘要轉一萬圈，所以這裡要靠油來潤滑、降溫。旋梭尖到達針旁的時機叫「勾線時間」，差一點點就會跳針，是機修師傅最常調整的地方之一。</p>
<h2>另一種做法：鏈式線跡</h2>
<p>鎖式線跡有個麻煩：梭心很小，底線車一陣子就用完，要停下來換。<b class="t">鏈式線跡</b>換了一種做法：下面不用梭心，改用一支會擺動的<b class="t">彎針</b>，彎針上的線直接從大線筒供應。線圈一個套一個，像鎖鏈一樣連下去。</p>
<div class="tbl"><table>
<tr><th></th><th>鎖式線跡（300 家族）</th><th>鏈式線跡（100、400 家族）</th></tr>
<tr><td>下方零件</td><td>旋梭＋梭心</td><td>彎針</td></tr>
<tr><td>下方的線</td><td>梭心容量小，要常換</td><td>大線筒供應，幾乎不用換</td></tr>
<tr><td>彈性</td><td>低</td><td>較高</td></tr>
<tr><td>正反面</td><td>看起來一樣</td><td>正面直線，反面是一串鏈子</td></tr>
<tr><td>會不會散</td><td>不容易</td><td>抓到對的線頭一拉，可能整條拆開</td></tr>
</table></div>
<div class="ex"><b>舉個例子</b>米袋、麵粉袋的封口線，找到線頭一拉，整條就拆開了，那就是單線鏈式線跡。方便拆是它的優點，也是缺點。</div>
`,
quiz:[
 ['平車的面線是從哪裡來的？',['梭心','機頭上方的線筒，經過夾線器、挑線桿再到針眼','彎針','送布牙'],1,'面線從上方線筒出發，經夾線器、挑線桿，最後穿過針眼。'],
 ['標準的鎖式線跡，兩條線應該在哪裡交鎖？',['布的正面','布的反面','布的邊緣','兩層布的中間'],3,'交鎖點藏在布中間，正反面才都只看到自己那條線，又平又牢。'],
 ['鏈式線跡的缺點是什麼？',['抓到對的線頭一拉，容易整條拆開','不能車直線','一定要用梭心','速度很慢'],0,'鏈式線跡的線圈互相套住，從收尾那端拉，可能一路拆開。']
]},

/* ---------------- 第 6 課 ---------------- */
{id:'l6', lv:2, title:'線跡家族', sub:'ISO 4915 的號碼密碼',
goal:'看得懂 301、401、504、514、516、406、607 這些號碼，知道各自的特色和用途。',
html:`
<p>全世界成衣廠用的線跡有好幾十種。為了讓客戶、工廠、機台廠講同一種語言，國際標準 <b class="t">ISO 4915</b> 給每種<b class="t">線跡</b>一個三位數號碼。</p>
<div class="ex"><b>舉個例子</b>號碼就像學號：第一個數字是「年級」（家族），後兩個數字是「座號」（家族裡的第幾種）。301 就是 300 家族（鎖式）的 1 號。</div>
<div class="tbl"><table>
<tr><th>家族</th><th>名稱</th><th>特色</th><th>代表</th></tr>
<tr><td>100</td><td>單線鏈式</td><td>一條線自己成圈，好拆</td><td>101 封口、103 撬邊</td></tr>
<tr><td>200</td><td>手縫類</td><td>模仿手縫，工廠很少用</td><td>手縫式裝飾線</td></tr>
<tr><td>300</td><td>鎖式</td><td>牢固、正反一樣、彈性低</td><td>301 平車、304 人字</td></tr>
<tr><td>400</td><td>多線鏈式</td><td>有彈性、不用換底線</td><td>401 埋夾、腰頭；406 三本車</td></tr>
<tr><td>500</td><td>包縫</td><td>把布邊包起來</td><td>504 三線拷克、514 四線拷克</td></tr>
<tr><td>600</td><td>覆蓋縫</td><td>正反兩面都有覆蓋線</td><td>602 雙針覆蓋、607 扁車</td></tr>
</table></div>
<p>要特別注意兩件事：T恤下擺常見的 406 雖然工廠叫「爬網」，在 ISO 裡屬於 400 家族；而 516 五線拷克其實是兩種線跡並排：一條 401 加一條 504。</p>
<div class="lab" data-lab="stitches"></div>
<h2>怎麼選線跡？問三個問題</h2>
<ol>
<li><strong>布會不會伸縮？</strong>會的話，選 400、500、600 家族這些有彈性的線跡。</li>
<li><strong>布邊要不要包起來？</strong>要的話，用 500 家族，或用包邊的縫型。</li>
<li><strong>正面要不要好看、要不要蓋住毛邊？</strong>要的話，用 600 家族、406，或雙針明線。</li>
</ol>
<div class="think"><b>想一想</b><p>運動緊身褲的接縫，要又平、又有彈性、貼身不磨皮膚，你會選哪一個號碼？</p>
<details><summary>看答案</summary><p>607（四針六線扁車）。它把兩片布邊對邊平接，正反兩面都有網狀線，扁平又有彈性。</p></details></div>
`,
quiz:[
 ['ISO 4915 的 300 家族是哪一種線跡？',['鎖式','鏈式','包縫','覆蓋縫'],0,'300 家族是鎖式，平車的 301 就是代表。'],
 ['五線拷克 516 是由哪兩種線跡並排組成的？',['301＋504','406＋602','401＋504','101＋301'],2,'516＝401（雙線鏈式，負責合縫）＋504（三線包縫，負責包邊）。'],
 ['T恤下擺常見的 406 線跡，通常用哪一種機台車？',['平車','打結車','釘扣車','三本車（爬網車）'],3,'406 是雙針底覆蓋，就是二本、三本車車的「爬網」。']
]},

/* ---------------- 第 7 課 ---------------- */
{id:'l7', lv:2, title:'針與線', sub:'針號、針尖、線的粗細',
goal:'看得懂針號 90/14 和針尖代號，知道針織和梭織為什麼要用不同的針，會替布料挑針挑線。',
html:`
<p>針和線是車縫的「筆和墨」。選錯了，機台再好也車不出好東西。</p>
<h2>一支工業車針的構造</h2>
<div class="lab" data-lab="needle"></div>
<div class="ex"><b>舉個例子</b>針往下刺得非常快，線如果露在外面，會被布磨斷。針身上的長槽就像線的「防護溝」，線躲在溝裡跟著針一起穿過布。</div>
<h2>針號：數字就是粗細</h2>
<p><b class="t">針號</b>常寫成 90/14：前面的 Nm 90 是公制，表示針桿直徑約 0.90 mm；後面的 14 是美式 Singer 號碼。兩個數字都是越大越粗。</p>
<div class="tbl"><table>
<tr><th>針號</th><th>粗細</th><th>常見用途</th></tr>
<tr><td>60/8、65/9</td><td>很細</td><td>雪紡、薄紗、絲</td></tr>
<tr><td>70/10、75/11</td><td>細</td><td>襯衫、細密的T恤汗布</td></tr>
<tr><td>80/12</td><td>中</td><td>一般布料、一般針織</td></tr>
<tr><td>90/14</td><td>中粗</td><td>厚棉布、斜紋、刷毛布</td></tr>
<tr><td>100/16、110/18</td><td>粗</td><td>牛仔布、帆布</td></tr>
<tr><td>120/19 以上</td><td>很粗</td><td>多層厚布、帶子、重型材料</td></tr>
</table></div>
<h2>針尖：刺進去，還是推開？</h2>
<ul>
<li><strong>R（一般尖頭）</strong>：梭織布用，乾淨俐落地刺穿。</li>
<li><strong>SES（小圓頭）</strong>：細密的針織布。</li>
<li><strong>SUK（中圓頭）</strong>：一般到較粗的針織布、彈性萊卡布。</li>
<li><strong>刀頭（例如 LR）</strong>：真皮，像小刀一樣切開一道口子。</li>
</ul>
<div class="ex"><b>舉個例子</b>要穿過擁擠的人群，你可以用手肘硬撞過去，也可以用雙手輕輕撥開。尖針像硬撞，會把針織布的紗線撞斷，洗幾次就破洞；<b class="t">球針</b>像撥開，紗線被推到旁邊，針離開後又回到原位。</div>
<h2>針系統：型號要對</h2>
<p>不同機台要用不同針柄形狀、不同長度的針，叫「針系統」。裝錯的針可能裝不上，或位置不對而撞壞旋梭。常見的有：平車 DB×1、拷克車 DC×27（或 B27）、三本車 UY128GAS。看針包裝上的型號，再對照機台說明書就不會錯。</p>
<h2>縫線</h2>
<p>成衣廠最常用的是聚酯<b class="t">包芯線</b>：中間是強韌的長絲，外面包一層短纖維，又強又好車。拷克和三本車的彎針上常用<b class="t">膨體紗</b>，蓬鬆、柔軟、有伸縮，貼身穿不刺。</p>
<p>線的粗細有兩種標法：<b class="t">Tex</b> 是「1000 公尺重幾公克」，數字越大越粗；Tkt（票號）則是數字越大越細。T恤、襯衫最常見的大約是 Tkt 120 左右的線，牛仔褲的明線會用粗得多的線。</p>
<p>線還有「撚向」。大部分縫線是 Z 撚（扭轉的方向像字母 Z 的中間那一撇），這樣在平車上被旋梭勾來勾去時才不會越勾越鬆、散開。</p>
<div class="lab" data-lab="picker"></div>
<p class="note">以上是常見參考，實際仍要以客戶的工藝單（Tech Pack）和試車結果為準。</p>
`,
quiz:[
 ['針號 Nm 90 代表什麼？',['針長 90 mm','針桿直徑約 0.9 mm','可以車 90 層布','每英寸 90 針'],1,'Nm 的數字是針桿直徑，單位 0.01 mm，所以 90 就是約 0.9 mm。'],
 ['車針織T恤最適合哪一種針尖？',['一般尖頭 R','刀頭 LR','小圓頭或中圓頭的球針（SES、SUK）','哪一種都一樣'],2,'球針會把針織的紗線推開，不會刺斷，所以不容易破洞。'],
 ['用 Tex 標示縫線時，數字越大代表？',['線越粗','線越細','越有彈性','越便宜'],0,'Tex 是 1000 公尺重幾公克，越重就越粗。Tkt 票號才是數字越大越細。']
]},

/* ---------------- 第 8 課 ---------------- */
{id:'l8', lv:2, title:'送布與壓腳', sub:'布是怎麼走的',
goal:'說得出送布牙的四步動作，認識各種送布方式，會用差動比解決針織布拉長和薄布起皺。',
html:`
<p>針負責「縫」，但布不會自己往前走，是<b class="t">送布牙</b>把它一格一格推過去的。送布做得好不好，決定線跡直不直、布有沒有被拉長或起皺。</p>
<h2>送布牙的四步舞</h2>
<div class="lab" data-lab="feed"></div>
<p>每車一針，送布牙都走一個長方形：</p>
<ol>
<li>往上冒出針板，咬住布</li>
<li>往後推（離開你的方向），把布送走一個針距</li>
<li>往下沉到針板下面</li>
<li>在下面回到原位，準備下一次</li>
</ol>
<p>而且它只在針<strong>離開布</strong>的時候推布。如果針還插在布裡就推，針會被布拉彎，甚至撞到針板而斷掉。</p>
<div class="ex"><b>舉個例子</b>像划船：槳插進水裡（上升咬布）→ 往後划（送布）→ 把槳抬出水面（下降）→ 往前擺回去再划。</div>
<h2>送布方式有好幾種</h2>
<div class="tbl"><table>
<tr><th>名稱</th><th>怎麼送</th><th>適合</th></tr>
<tr><td>下送布</td><td>只有下面的送布牙推布</td><td>一般布料，最常見</td></tr>
<tr><td><b class="t">差動送布</b></td><td>前後兩組送布牙速度可以不同</td><td>針織布、彈性布、薄布；拷克和三本車幾乎都有</td></tr>
<tr><td>針送布</td><td>針插在布裡時也跟著往後走</td><td>容易滑動、需要對齊的多層布</td></tr>
<tr><td>上下送布（綜合送布）</td><td>上面的壓腳也會「走路」，上下夾著布一起前進</td><td>厚布、多層、皮革、條格要對齊</td></tr>
<tr><td>滾輪拉布</td><td>壓腳後面加一個滾輪往後拉</td><td>牛仔布、長接縫，送得更穩</td></tr>
</table></div>
<h2>差動送布：前後兩組速度不一樣</h2>
<p>針織布很軟，壓腳一壓、送布牙一推，布就被拉長，車出來的邊會像荷葉一樣起波浪。<b class="t">差動送布</b>的做法是在前面多放一組送布牙，讓它比後面的主送布牙<strong>多送一點布</strong>，剛好抵銷被拉長的部分。反過來，薄的梭織布容易被擠皺，就讓前面<strong>少送一點</strong>，把布稍微拉平。前面和後面的比例，就叫差動比。</p>
<div class="ex"><b>舉個例子</b>兩台手扶梯接在一起。前面那台比後面快，人和人之間就會被拉開；前面比後面慢，人就會擠在一起。調差動比，就是在調兩台手扶梯的速度比。</div>
<div class="lab" data-lab="diff"></div>
<h2>壓腳：換一隻腳，換一種功夫</h2>
<ul>
<li><strong>標準壓腳</strong>：一般車縫。</li>
<li><strong>高低壓腳</strong>（左右兩邊高度不同）：沿著布邊壓 0.1 cm 的明線時，靠著邊走就能又直又準。</li>
<li><strong>捲邊壓腳、拉筒</strong>：布一邊走一邊自動捲成邊或包成條，襯衫下擺、門襟、滾邊都靠它。</li>
<li><strong>鐵氟龍壓腳</strong>：車 PU、皮革、塗層布時不會黏住。</li>
<li><strong>拉鍊壓腳</strong>：只有半邊，可以貼著拉鍊齒車。</li>
</ul>
<p>在工廠裡，選對壓腳、拉筒和導規（幫布邊定位的小擋板），常常比苦練手速更能提升品質和速度。</p>
`,
quiz:[
 ['送布牙的四步動作順序是？',['往後推 → 上升 → 回原位 → 下降','上升 → 往後推 → 下降 → 回到原位','下降 → 上升 → 往後推 → 回原位','只會前後移動，不會上下'],1,'送布牙每一針走一個長方形：上升咬布、往後送布、下降、在下面回到原位。'],
 ['車針織布時布被拉長、邊緣呈波浪（荷葉邊），差動比應該？',['調小，小於 1','不用管它','把馬達關掉','調大，大於 1'],3,'前面的差動送布牙多送一點布，就能抵銷被拉長的部分。'],
 ['車很厚、多層或容易滑動的布，常用哪一種送布？',['上下送布（綜合送布）','只靠下送布','不要送布，用手推','換一條更細的線'],0,'上下送布讓壓腳也一起「走路」，上下夾著布前進，各層才不會錯位。']
]},

/* ---------------- 第 9 課 ---------------- */
{id:'l9', lv:3, title:'平車家族', sub:'單針、雙針、人字、電腦車',
goal:'認識鎖式線跡家族的四種平車，會分辨它們的線跡，知道平車的基本功。',
html:`
<p>從這一課開始，我們一台一台認識工廠裡的車。每張卡片上都有線跡的正面和反面，金色是針的線，藍色是底下的線。先從最大的家族開始：鎖式線跡的平車家族。</p>
${mc({n:'單針平車',en:'Single-needle lockstitch',code:'301',draw:'301',rows:[
 ['做什麼','大部分梭織衣服的接縫、壓明線、上口袋、上領、做門襟。'],
 ['常見在','襯衫領子、西裝褲、口袋、標籤。'],
 ['重點','最基本也最重要。多數車工學的第一台車就是它。']]})}
${mc({n:'雙針平車',en:'Double-needle lockstitch',code:'301 ×2',draw:'301x2',rows:[
 ['做什麼','兩支針、兩個旋梭，一次車出兩條平行的鎖式線跡。'],
 ['常見在','工作服、襯衫的明線、牛仔褲後口袋。'],
 ['重點','有一種「分離式針桿」機型，轉角時可以停一支針，轉出漂亮的直角。']]})}
${mc({n:'人字車',en:'Zigzag lockstitch',code:'304',draw:'304',rows:[
 ['做什麼','針會左右擺動，車出 Z 字形的鋸齒線，有一點彈性。'],
 ['常見在','內衣、泳衣、縫鬆緊帶、貼布繡。'],
 ['由來','線跡像一連串「人」字，所以叫<b class="t">人字車</b>。']]})}
${mc({n:'電腦平車',en:'Computerized lockstitch',code:'301',rows:[
 ['做什麼','一樣是 301，但多了很多自動功能：自動剪線、自動倒縫（回針）、定針（停車時針停在上或下）、自動抬壓腳、計數。'],
 ['常見在','現在新添購的平車大多是這種。'],
 ['重點','每一件都省下拿剪刀、手動回針的幾秒鐘，一天累積起來非常可觀。']]})}
<h2>平車的基本功</h2>
<ul>
<li><strong>回針（倒縫）</strong>：開頭和結尾各往回車幾針，把線頭鎖住，免得散開。</li>
<li><strong>壓明線</strong>：在正面車一條離布邊固定距離（例如 0.1 cm 或 0.6 cm）的裝飾線，這是最能看出車工功力的地方。</li>
<li><strong>對位</strong>：兩片布上的剪口（刀眼）要對齊，衣服才不會歪。</li>
<li><strong>控速</strong>：直線可以踩快，轉角、弧線要慢，必要時用手輪一針一針轉。</li>
</ul>
<div class="ex"><b>舉個例子</b>新手練平車，常常先不穿線，在紙上車直線、車方形、車圓，練到針孔排得整整齊齊，再開始車布。這樣練手腳配合，又安全又省料。</div>
`,
quiz:[
 ['雙針平車一次車出幾條線跡？',['1 條','3 條','2 條','5 條'],2,'雙針平車有兩支針、兩個旋梭，一次車出兩條平行的 301。'],
 ['人字車（304）的線跡長什麼樣子？',['一條直線','左右來回的 Z 字鋸齒','一個個圓圈','一片網狀'],1,'人字車的針會左右擺動，線跡像連續的人字或 Z 字，有一點彈性。'],
 ['電腦平車的「自動剪線」有什麼好處？',['車完自動剪斷面線和底線，省下拿剪刀的時間','會自動換針','會自動穿線','會自動設計衣服'],0,'每件省幾秒，一天幾千件下來就是很大的差別。']
]},

/* ---------------- 第 10 課 ---------------- */
{id:'l10', lv:3, title:'拷克車', sub:'三線、四線、五線',
goal:'知道拷克車一次做哪三件事，分得出三線、四線、五線拷克的差別和用途。',
html:`
<p><b class="t">拷克</b>車大概是成衣廠裡最有代表性的聲音：「嗡」一聲，布邊被切齊、包好，一氣呵成。英文叫 overlock，也叫 serger。</p>
<h2>拷克一次做三件事</h2>
<ol>
<li>用上刀、下刀把布邊修齊。</li>
<li>針把布縫住。</li>
<li><b class="t">彎針</b>帶著線繞過布邊，把毛邊整個包起來。</li>
</ol>
<p>所以拷克車出來的布邊不會脫紗，線跡本身又有彈性，梭織和針織都用得到。</p>
<h2>幾線拷克？</h2>
<p>「幾線」就是總共用了幾條線。卡片上金色是針線，藍色和綠色是上、下彎針的線。</p>
${mc({n:'三線拷克',en:'3-thread overlock',code:'504',draw:'504',rows:[
 ['線的組成','1 支針 ＋ 上彎針 ＋ 下彎針。'],
 ['做什麼','布邊收邊：梭織布常先拷邊，再用平車合縫；也可以做很輕薄的針織接縫。'],
 ['常見在','裙子、褲子裁片的布邊、內裡。']]})}
${mc({n:'四線拷克',en:'4-thread overlock',code:'514',draw:'514',rows:[
 ['線的組成','2 支針 ＋ 上彎針 ＋ 下彎針。多一條針線，更牢。'],
 ['做什麼','合縫加包邊一次完成，又有彈性。'],

<h2>拷克的重要設定</h2>
<ul>
<li><strong>寬度</strong>：包邊的寬度，常見 3～7 mm，由針和刀的位置決定。</li>
<li><strong>針距</strong>：太疏會露出布邊、不牢；太密布邊會變硬、起波浪。</li>
<li><strong>差動比</strong>：針織布通常要調大一點，避免荷葉邊。</li>
<li><strong>刀片</strong>：上刀、下刀要鋒利，鈍了布邊會毛毛的、拉絲。</li>
</ul>
<div class="ex"><b>舉個例子</b>把你的T恤翻過來看側縫，數一數：兩條直直的針線，加上繞著布邊的網狀線，就是四線拷克。</div>
<div class="think"><b>想一想</b><p>為什麼T恤用四線拷克，牛仔褲側縫卻常用五線？</p>
<details><summary>看答案</summary><p>T恤是針織布，需要彈性，四線拷克本身有彈性又夠牢。牛仔布厚、不伸縮、受力大，五線裡的 401 鏈式專門承受拉力，504 專門包住容易脫紗的布邊，分工合作，一次完成。</p></details></div>
`,

<h2>覆蓋縫：把毛邊「蓋」起來</h2>
<p>覆蓋縫的英文是 coverstitch。它用 2～3 支針在正面車出平行直線，下面的彎針在這幾條線之間來回拉線，把布邊蓋在網裡面。不用先把布邊包好，一次就能完成漂亮又有彈性的折邊。</p>

 ['做什麼','針織衣的折邊、滾邊，彈性好、不必先拷邊。'],

 ['做什麼','接縫又扁又平，沒有凸起的縫份，貼身穿不磨皮膚。'],
 ['常見在','運動服、瑜珈服、內衣、自行車衣。']]})}
<h2>車床的造型：平台式和筒式</h2>
<p>三本車常見兩種車床。平台式用來車攤平的布；<b class="t">筒車</b>的車床是一支細長的圓筒，可以把已經接成一圈的袖口、褲腳套上去，一邊轉一邊車。</p>
<div class="ex"><b>舉個例子</b>T恤如果先合脅（側縫接好）再車下擺，下擺就變成一個大圓圈，只能用筒車；有些工廠改成先車下擺再合脅，就能用平台式。工序的順序不同，選用的機台也跟著不同。</div>
<p>工廠說「三本」，是沿用日文的說法：「本」是日文數長條物品的量詞，三本針就是三支針。</p>

/* ---------------- 第 14 課 ---------------- */
{id:'l14', lv:4, title:'品質的四個關鍵', sub:'張力、針距、縫份、縫型',
goal:'會判斷並調整張力，會換算針距和 SPI，理解縫份與縫型對品質的影響。',
html:`
<p>「會車」和「車得好」，差在「調」。這一課學專業車工和機修師傅每天在看的四件事：張力、針距、縫份、縫型。</p>
<h2>張力：兩條線在拔河</h2>
<p>鎖式線跡的面線和底線，就像兩隊在拔河。兩邊力氣一樣，交鎖點就停在布的正中間。面線太強，會把底線拉到正面，正面就看得到底線的小點；底線太強，面線就被拉到反面。</p>
<div class="lab" data-lab="tension"></div>
<h3>專業的調法：先底線、再面線</h3>
<ol>
<li><strong>先定好底線</strong>：捏住線頭把裝好梭心的梭殼吊起來，輕輕往上一抖，梭殼應該往下滑一小段就停住。完全不動是太緊，一路滑下去是太鬆。</li>
<li><strong>再調面線</strong>：用實際要車的布試車，看正反兩面，轉夾線器，直到交鎖點藏在布中間。</li>
<li><strong>拉一拉驗證</strong>：順著線跡方向拉一拉，線不能斷，布也不該起皺。</li>
</ol>
<p>拷克和三本車的張力也是同樣的道理，只是線比較多條：看包邊的交叉點是不是剛好落在布邊上，網狀線是否平整不鬆垮。</p>
<h2>針距與 SPI</h2>
<p><b class="t">針距</b>是兩針之間的距離；歐美客戶的工藝單常用 <b class="t">SPI</b>（每英寸有幾針）。針距太大，線跡不牢、縫份容易拉開；太密，布會被打得太多洞，起皺甚至裂開。</p>
<div class="lab" data-lab="spi"></div>
<h2>縫份</h2>
<p><b class="t">縫份</b>是縫線到布邊之間留下的那一段布。太窄容易「爆口」（布邊從線跡中滑脫），太寬浪費布又厚重。針板上的刻度、磁鐵導規、壓腳上的導邊，都是幫你把縫份維持一致的工具。</p>
<h2>縫型：布怎麼疊</h2>
<p>線跡是「線怎麼走」，<b class="t">縫型</b>是「布怎麼放」。國際標準 ISO 4916 把縫型分成八大類，下面是最常見的四種剖面圖：</p>
<div class="lab" data-lab="seams"></div>
`,

{id:'l15', lv:4, title:'車縫問題排除', sub:'看線跡找病因',
goal:'看到常見的車縫問題時，能說出可能的原因，並照「由簡單到困難」的順序排除。',
html:`
<p>機台一天運轉好幾個小時，一定會出狀況。厲害的車工和機修師傅，看線跡就知道毛病在哪裡。選一個症狀，看看可能的原因和處理方式。</p>
<div class="lab" data-lab="trouble"></div>
<h2>排除問題的順序：由簡單到困難</h2>
<ol>
<li>換一支新針：最便宜，也最常解決問題。</li>
<li>面線、底線全部重新穿一次。</li>
<li>檢查針號、線、布是不是互相配合。</li>
<li>清理針板下和旋梭附近的棉絮。</li>
<li>調整張力、壓腳壓力、針距、差動比。</li>
<li>以上都無效，再請機修師傅檢查勾線時間、送布牙高度等機械設定。</li>
</ol>

`,

{id:'l16', lv:4, title:'保養、安全與斷針管理', sub:'每個進車間的人都要會',
goal:'知道車縫的個人安全規則、斷針管理的標準流程，以及每天的保養重點。',
html:`
<p>機台每分鐘幾千針，一點疏忽就可能傷到手指；而一截斷在衣服裡的針頭，可能傷到遠方的消費者。這一課是每個進車間的人都必須記住的。</p>
<h2>個人安全</h2>
<ul>
<li>穿線、換針、換梭心、清潔之前，<strong>先關掉馬達電源</strong>，至少也要確認腳已離開踏板。伺服馬達很安靜，安靜不代表沒有通電。</li>
<li>護指器、護眼罩、皮帶護蓋都不可以拆掉。</li>
<li>長頭髮要綁起來，不戴會垂下來的飾品，袖口不要太寬鬆。</li>
<li>不要用手硬拉布「幫忙」送布。讓送布牙做它的工作，硬拉會讓針撞到針板而斷掉。</li>
</ul>
<h2><b class="t">斷針管理</b></h2>
<p>很多品牌客戶都要求工廠建立嚴格的斷針管理制度，常見的流程是：</p>
<ol>
<li><strong>以舊換新</strong>：換針時，要把舊針或斷針的全部碎片交給負責人，才能領新針。</li>
<li><strong>找齊碎片</strong>：斷針後立刻停車，把所有碎片找出來，拼回一支完整的針。</li>
<li><strong>登記</strong>：在斷針記錄表上寫下時間、機台、工序、車工，由主管簽名，碎片黏貼存查。</li>
<li><strong>找不到碎片</strong>：那段時間車的衣片要全部隔離，用金屬探測器檢查，確認沒有才能放行。</li>
<li><strong>出貨前驗針</strong>：成品要通過驗針機（金屬探測），才能包裝出貨。</li>
</ol>
<div class="ex"><b>舉個例子</b>一截只有幾毫米的斷針，如果留在嬰兒衣服裡，後果不堪設想。所以驗廠稽核時，斷針記錄幾乎一定會被檢查。</div>
<h2>每天的保養</h2>
<ul>
<li><strong>開工前</strong>：看油窗有沒有油在噴，或照規定補油；空車試轉，聽聲音順不順。</li>
<li><strong>工作中</strong>：針鈍了、彎了就換；很多工廠規定固定時間一定要換針。</li>
<li><strong>收工前</strong>：用刷子清掉針板下、送布牙、旋梭附近的棉絮；拷克車要清刀片周圍；蓋上防塵罩、關電源。</li>
<li><strong>定期</strong>：機修師傅檢查勾線時間、送布牙高度、皮帶和馬達。</li>
</ul>
<p>整理也是保養的一部分：剪刀、梭心、工具放在固定位置，地上沒有線頭布屑。這不只是整齊，還能減少絆倒，斷針碎片掉了也比較好找。</p>
`,
quiz:[
 ['發生斷針時，正確的做法是？',['把找得到的碎片丟進垃圾桶','繼續車，下班再處理','找齊所有碎片、登記、交給主管換新針；找不到碎片就把衣片隔離檢查','自己去倉庫拿一支新針'],2,'斷針管理的重點是找齊碎片、登記、以舊換新，找不到就隔離並用金屬探測器檢查。'],
 ['穿線、換針之前應該先？',['關掉馬達電源，或確認腳已離開踏板','把馬達開到最快','什麼都不用做','先加油'],0,'伺服馬達很安靜，但通電時一碰踏板就會動，先斷電最安全。'],
 ['每天清理針板下方和旋梭附近的棉絮，主要是為了？',['讓機台變輕','讓顏色變亮','省電','避免卡線、跳針和零件磨損'],3,'棉絮會卡住送布牙和旋梭，造成跳針、斷線，也會加速磨損。']

{id:'l17', lv:4, title:'專業視角', sub:'馬達、SMV、效率與選機',

html:`
<p>最後一課，從「一台機器」跳到「一整條生產線」，用管理者和工業工程師（IE）的眼睛看機台。</p>
<h2>馬達：從離合器到伺服</h2>
<p>早期的工業車用離合器馬達：馬達一整天高速空轉，腳一踩，離合器才接上帶動機頭，又吵又耗電。現在的<b class="t">伺服馬達</b>只有要車的時候才轉，還能精準控制停針位置、慢速起步，所以省電又安靜，也是自動剪線、自動回針這些電腦功能的基礎。</p>
<h2>SMV：一道工序的「標準時間」</h2>
<p><b class="t">SMV</b> 是標準分鐘值：一位受過訓練的作業員，用正常速度完成一道工序需要幾分鐘（已經包含合理的休息和寬放）。舉例來說，如果「上袖」的 SMV 是 0.6 分鐘，表示熟練車工大約 36 秒完成一件的上袖。一件衣服所有工序的 SMV 加起來，就是這件衣服的總 SMV。（這裡的數字只是舉例。）</p>
<p>有了 SMV，就能算出：</p>
<ul>
<li><strong>100% 效率的目標產量</strong> ＝ 人數 × 工作分鐘 ÷ SMV</li>
<li><strong>效率</strong> ＝ 產出件數 × SMV ÷（人數 × 工作分鐘）</li>
</ul>
<div class="lab" data-lab="eff"></div>
<h2>線平衡：最慢的那一站決定速度</h2>
<p>生產線像接力賽，整條線的產量是由最慢的那道工序決定的，這叫「瓶頸」。排線時要讓每個工位的工作時間盡量接近：太重的工序拆給兩個人，太輕的工序合併，機台也跟著人重新配置。</p>
<div class="ex"><b>舉個例子</b>十個人排一條線，其他人每件只要 30 秒，只有「上領」要 60 秒，那整條線每分鐘只能出一件，其他人有一半的時間在等。把上領分給兩個人做，產量馬上接近翻倍。</div>
<h2>選機台時要看什麼</h2>
<ol>
<li><strong>產品組合</strong>：做針織還是梭織？款式多變還是固定？</li>
<li><strong>線跡需求</strong>：客戶工藝單要求的 ISO 線跡號碼和 SPI。</li>
<li><strong>布料範圍</strong>：輕、中、重磅，決定要選輕料型還是重料型的機頭。</li>
<li><strong>自動化程度</strong>：自動剪線、自動模板機能降低技術門檻，但投資較高。</li>
<li><strong>維修與零件</strong>：機修師傅熟不熟、零件好不好買，常常比規格表更重要。</li>
</ol>
<h2>接下來的路</h2>
<p>車工 → 多能工（會好幾種機台，哪裡缺人補哪裡）→ 組長 → 機修技術員；也可以走工業工程、品管、生產管理。懂機台的人，在成衣廠任何位置都用得上。</p>
<p>走完十七課了！去挑戰<a href="#/exam">結業測驗</a>，八十分以上就能領結業證書。</p>
`,

const RM = (()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches }catch(e){ return false } })();

function segH(opts, cur){
  return `<div class="seg" role="group">${opts.map((o,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===cur}">${o}</button>`).join('')}</div>`;
}
function bindSeg(box, cb){
  const bs = box.querySelectorAll('button');
  bs.forEach(b => b.addEventListener('click', () => {
    bs.forEach(x => x.setAttribute('aria-pressed', x===b));
    cb(+b.dataset.i);
  }));
}
function anim(dur, fn, done){
  if(RM){ fn(1); if(done) done(); return ()=>{}; }
  let s = null, id, stop = false;
  const f = ts => { if(stop) return; if(s===null) s = ts; const t = Math.min(1,(ts-s)/dur); fn(t); if(t<1) id = requestAnimationFrame(f); else if(done) done(); };
  id = requestAnimationFrame(f);
  return () => { stop = true; cancelAnimationFrame(id); };
}
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

  <div class="row"><button class="btn">再比一次</button></div><p class="cap">工業平車每分鐘約 5,000 針，等於每秒超過 80 針，是手縫的一百倍以上。（數字為大約值）</p>`;
  const lanes = el.querySelectorAll('.lane');
  let stop = ()=>{};
  const go = () => { stop(); stop = anim(2600, t => { const e = ease(t);

};

/* ---------- l5 鎖式線跡慢動作 ---------- */
labs.lockstitch = el => {
  const HX = 200, HY = 268, HR = 38, G = '#D99A2B', B = '#4F74B0';
  const CAP = [
    '準備：針在最高點，上一針已經鎖好。金色是面線，藍色是底線（藏在下面的梭心裡）。',
    '針往下：針帶著面線穿過布，一直往下到旋梭旁邊。',
    '形成線環：針開始往上升大約 2 mm，面線因為和布摩擦而留在下面，在針的缺口那一側鼓成一個小線環。',
    '旋梭勾住：旋梭的梭尖剛好在這一刻經過，鑽進線環把它勾走。這個時間點叫「勾線時間」，差一點點就會跳針。',
    '繞過梭心：旋梭繼續轉，把面線線環撐大，整個繞過裝著底線的梭心。',
    '收緊：挑線桿往上拉，把線環拉回布裡，面線和底線就在兩層布的中間鎖在一起。',
    '送布：針離開布以後，送布牙把布往後送一個針距，準備下一針。重複這 7 步，一分鐘可以做幾千次！'
  ];
  const TIP = [96,258,250,232,112,60,60], LEV = [30,70,74,62,92,22,30], BK = [-10,-35,-30,-96,180,60,60];
  const ln = (d,c,w=3) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const beak = a => { const r = Math.PI/180, t = a*r, t2 = (a-22)*r;
    return `<path d="M${HX+(HR+6)*Math.cos(t)} ${HY+(HR+6)*Math.sin(t)} L${HX+(HR+3)*Math.cos(t2)} ${HY+(HR+3)*Math.sin(t2)} L${HX+(HR-5)*Math.cos(t)} ${HY+(HR-5)*Math.sin(t)}Z" fill="var(--ink2)"/>`; };
  const prev = () => { let s = ln('M20 118 H160', G) + ln('M20 144 H160', B);
    [40,80,120,160].forEach(k => { s += ln(`M${k} 118 L${k} 131`, G, 2.5) + ln(`M${k} 144 L${k} 131`, B, 2.5); }); return s; };
  const frame = i => {
    const tip = TIP[i], eye = tip - 14, k = i>=5;
    let st = `<rect class="fab" x="0" y="120" width="440" height="22"/><line x1="0" y1="131" x2="440" y2="131" stroke="var(--line)" stroke-dasharray="4 3"/>` + prev();
    let th = '';
    if(i===0){ th = ln(`M200 ${eye} Q180 100 164 118 L160 118`, G); }
    else if(i<=3){ th = ln(`M164 118 H196 V${eye}`, G);
      if(i===2) th += ln(`M203 ${eye} C226 ${eye+4} 226 ${eye-26} 204 ${eye-34}`, G);
      if(i===3) th += ln(`M203 ${eye} C232 ${eye+10} 222 ${eye+30} 192 ${eye+18} C182 ${eye+12} 186 ${eye-6} 199 ${eye-12}`, G); }
    else if(i===4){ th = ln('M164 118 H197 V142 L160 250 A46 46 0 1 0 241 250 L203 142 L201 '+eye, G); }
    if(k){ st += ln('M160 118 H196 L200 131', G) + ln('M160 144 H196 L200 131', B, 3); }
    const blue = i===6 ? ln('M164 144 L199 250', B) : k ? ln('M204 144 L201 250', B) : ln('M160 144 H194 L199 250', B);
    const supply = ln(`M206 -10 L203 ${eye}`, G, 2);
    const needle = `<rect x="193" y="-10" width="14" height="${Math.max(0,tip-100)}" fill="var(--ink2)" opacity=".5"/><path d="M197 -10 V${tip-10} L200 ${tip} L203 ${tip-10} V-10Z" fill="#9AA6B6" stroke="var(--ink2)"/><ellipse cx="200" cy="${eye}" rx="1.6" ry="4" fill="var(--paper)"/>`;
    const hook = `<circle cx="${HX}" cy="${HY}" r="${HR}" fill="none" stroke="var(--ink2)" stroke-width="3"/><circle cx="${HX}" cy="${HY}" r="24" fill="none" stroke="var(--muted)" stroke-width="1.5"/><circle cx="${HX}" cy="${HY}" r="17" fill="${B}" opacity=".35"/><circle cx="${HX}" cy="${HY}" r="5" fill="${B}"/>${beak(BK[i])}`;
    const gauge = `<text class="svt" x="352" y="14" text-anchor="middle">挑線桿</text><line x1="352" y1="22" x2="352" y2="100" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/><circle cx="352" cy="${LEV[i]}" r="8" fill="${G}" stroke="var(--thread-d)" stroke-width="2"/>`;
    const lab = `<text class="svt" x="26" y="112">布（兩層）</text><text class="svt" x="252" y="${HY+4}">旋梭</text><text class="svt" x="${HX}" y="${HY+60}" text-anchor="middle">梭心（底線）</text>`;
    return `<g class="stg" style="transition:transform .9s ease">${st}${th}</g>${blue}${supply}${needle}${hook}${gauge}${lab}${i===6?`<text class="svt-b" x="120" y="172" text-anchor="middle">← 送布一個針距</text>`:''}`;
  };
  el.innerHTML = `<p class="lab-t">慢動作：鎖式線跡（301）的一針</p>
  <div class="svgbox"><svg style="max-width:480px;margin:0 auto" viewBox="0 -12 400 340" role="img" aria-label="鎖式線跡形成剖面圖"></svg></div>
  <p class="cap" aria-live="polite"></p>
  <div class="row"><button class="btn ghost" data-a="p">◀ 上一步</button><button class="btn" data-a="n">下一步 ▶</button><button class="btn ghost" data-a="auto">自動播放</button></div>`;
  const svg = el.querySelector('svg'), cap = el.querySelector('.cap'), ab = el.querySelector('[data-a=auto]');
  let f = 0, timer = null;
  const show = i => { f = (i+7)%7; svg.innerHTML = frame(f); cap.innerHTML = `<b>第 ${f+1}／7 步</b>　${CAP[f]}`;
    if(f===6){ const g = svg.querySelector('.stg'); requestAnimationFrame(()=>requestAnimationFrame(()=>{ g.style.transform = 'translateX(-40px)'; })); } };
  const halt = () => { clearInterval(timer); timer = null; ab.textContent = '自動播放'; };
  el.querySelector('[data-a=p]').onclick = () => { halt(); show(f-1); };
  el.querySelector('[data-a=n]').onclick = () => { halt(); show(f+1); };
  ab.onclick = () => { if(timer){ halt(); return; } ab.textContent = '暫停';
    timer = setInterval(() => { if(!el.isConnected){ halt(); return; } show(f+1); }, 2200); };
  show(0);
};

/* ---------- 線跡繪圖工具 ---------- */
const SW = {
  L:(x1,y1,x2,y2,c,w=2.6)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`,
  dash(y,c,len=13,gap=6,w){ let s=''; for(let x=12;x+len<=250;x+=len+gap) s+=SW.L(x,y,x+len,y,c,w); return s; },
  dots(y,c){ let s=''; for(let x=16;x<=246;x+=19) s+=`<circle cx="${x}" cy="${y}" r="2.2" fill="${c}"/>`; return s; },
  chain(y,c){ let s=''; for(let x=12;x+19<=252;x+=19) s+=`<ellipse cx="${x+10}" cy="${y}" rx="11.5" ry="4.6" fill="none" stroke="${c}" stroke-width="2.1"/>`; return s; },
  zig(y1,y2,c,p=19,w=2.3){ let pts=[]; for(let x=12,i=0;x<=250;x+=p/2,i++) pts.push(`${x},${i%2?y2:y1}`); return `<polyline points="${pts.join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`; },
  fab(edge){ return edge
    ? `<rect class="fab" x="4" y="8" width="252" height="66"/>${[...Array(26)].map((_,i)=>SW.L(8+i*9.6,74,6+i*9.6,80,'var(--muted)',1)).join('')}`
    : `<rect class="fab" x="4" y="8" width="252" height="74" rx="4"/>`; }
};
const STITCH = {
  '101':{n:'單線鏈式',th:'1 條（面線自己勾成鏈）',st:'中',use:'臨時假縫、麵粉袋封口。拉住線尾一扯就整條拆開。',f:()=>SW.dash(45,TC.n),b:()=>SW.chain(45,TC.n)},
  '301':{n:'鎖式（平車）',th:'2 條（面線＋底線）',st:'低',use:'梭織衣服大部分的接縫、明線、口袋、領子。正反面長得一樣。',f:()=>SW.dash(45,TC.n),b:()=>SW.dash(45,TC.l)},
  '304':{n:'人字鎖式',th:'2 條（面線＋底線）',st:'中',use:'內衣、泳衣上鬆緊帶、貼布繡、打結。',f:()=>SW.zig(34,56,TC.n),b:()=>SW.zig(34,56,TC.l)},

labs.diff = el => {

  <label class="rl">差動比 <b class="rv">1.00</b>（前送布 ÷ 主送布）<input type="range" min="0.6" max="2" step="0.05" value="1"></label>
  <div class="svgbox"><svg viewBox="0 0 400 190" role="img" aria-label="差動送布示意圖"></svg></div><div class="verdict"></div>`;
  const svg = el.querySelector('svg'), r = el.querySelector('input'), rv = el.querySelector('.rv'), v = el.querySelector('.verdict');
  const draw = () => {
    const x = +r.value, d = x - F[f][1]; rv.textContent = x.toFixed(2);

/* ---------- l14 張力拔河 ---------- */
labs.tension = el => {
  el.innerHTML = `<p class="lab-t">張力拔河：調兩個旋鈕，看剖面</p>
  <label class="rl">面線張力（夾線器） <b class="tv">5</b><input type="range" min="1" max="9" value="5" data-k="t"></label>
  <label class="rl">底線張力（梭殼螺絲） <b class="bv">5</b><input type="range" min="1" max="9" value="5" data-k="b"></label>
  <div class="svgbox"><svg viewBox="0 0 400 170" role="img" aria-label="鎖式線跡剖面圖"></svg></div>
  <div class="verdict"></div><div class="row"><button class="btn ghost">回到平衡</button></div>`;
  const svg = el.querySelector('svg'), v = el.querySelector('.verdict'), [rt, rb] = el.querySelectorAll('input');
  const draw = () => {
    const t = +rt.value, b = +rb.value, d = t - b, sum = t + b;
    el.querySelector('.tv').textContent = t; el.querySelector('.bv').textContent = b;
    const ky = Math.max(60, Math.min(120, 90 - d*6.5));
    const pk = sum > 12 ? (sum-12)*2.2 : 0, loose = sum < 7 ? (7-sum)*3 : 0;
    const wave = (y) => { let p = `M20 ${y}`; for(let i=0;i<12;i++) p += ` Q${35+i*30} ${y+(i%2?pk:-pk)} ${50+i*30} ${y}`; return p; };
    const X = [55,110,165,220,275,330];
    let top = `M20 ${68-loose/2}`, bot = `M20 ${112+loose/2}`;
    X.forEach((x,i) => { const px = i ? X[i-1] : 20, mx = (px+x)/2;
      top += ` Q${mx} ${68-loose*2} ${x-2} ${Math.min(ky,68)} L${x} ${ky} L${x+2} ${Math.min(ky,68)}`;
      bot += ` Q${mx} ${112+loose*2} ${x-2} ${Math.max(ky,112)} L${x} ${ky} L${x+2} ${Math.max(ky,112)}`; });
    top += ' L380 68'; bot += ' L380 112';
    svg.innerHTML = `<path d="${wave(70)} L380 90 L20 90Z" class="fab" style="stroke:var(--ink2)"/><path d="${wave(90)} L380 110 L20 110Z" class="fab" style="stroke:var(--ink2);opacity:.85"/>
      <path d="${top}" fill="none" stroke="${TC.n}" stroke-width="3" stroke-linejoin="round"/><path d="${bot}" fill="none" stroke="${TC.l}" stroke-width="3" stroke-linejoin="round"/>
      ${X.map(x=>`<circle cx="${x}" cy="${ky}" r="4" fill="${ky<70?TC.l:ky>110?TC.n:'var(--ink)'}"/>`).join('')}
      <text class="svt" x="20" y="40">正面（面線）</text><text class="svt" x="20" y="150">反面（底線）</text><text class="svt" x="380" y="40" text-anchor="end">● 交鎖點</text>`;
    let c = 'ok', m;
    if(Math.abs(d) <= 1 && sum < 7){ c='bad'; m = '<b>兩條都太鬆：</b>線跡鬆垮、浮浮的，一拉就開。兩邊一起調緊。'; }
    else if(Math.abs(d) <= 1 && sum > 12){ c='bad'; m = '<b>兩條都太緊：</b>線把布拉縮，出現縫皺，一拉還容易斷線。兩邊一起放鬆。'; }
    else if(Math.abs(d) <= 1){ m = '<b>平衡！</b>交鎖點藏在兩層布中間，正面只看到面線、反面只看到底線。'; }
    else if(d > 1){ c='bad'; m = '<b>面線太緊（或底線太鬆）：</b>底線被拉到正面，正面看得到藍色小點。先確認底線張力，再把面線夾線器轉鬆。'; }
    else { c='bad'; m = '<b>底線太緊（或面線太鬆）：</b>面線被拉到反面，反面出現金色線圈。把面線調緊，或把梭殼螺絲轉鬆一點。'; }
    if(Math.abs(d) > 1 && sum > 12) m += '　另外兩條加起來也太緊，布已經開始起皺。';
    v.className = 'verdict ' + c; v.innerHTML = m;
  };
  rt.oninput = rb.oninput = draw;
  el.querySelector('.btn').onclick = () => { rt.value = rb.value = 5; draw(); };
  draw();
};

labs.eff = el => {
  const F = [['人數','n',10,'人'],['工作分鐘','m',480,'分鐘'],['實際產量','q',800,'件'],['每件 SMV','s',5,'分鐘']];
  el.innerHTML = `<p class="lab-t">生產線效率計算機</p><div class="kv" style="grid-template-columns:7em 1fr;align-items:center">${F.map(f=>`<label for="ef${f[1]}">${f[0]}</label><span><input id="ef${f[1]}" type="number" min="0" step="any" value="${f[2]}" data-k="${f[1]}" style="width:7em"> ${f[3]}</span>`).join('')}</div><div class="verdict"></div>
  <p class="cap">效率 ＝ 產出的標準分鐘（產量 × SMV）÷ 投入的分鐘（人數 × 工作分鐘）</p>`;
  const v = el.querySelector('.verdict'), get = k => +el.querySelector(`[data-k=${k}]`).value || 0;
  const calc = () => {
    const n = get('n'), m = get('m'), q = get('q'), s = get('s'), inp = n*m, out = q*s;
    if(!inp || !s){ v.className='verdict'; v.textContent = '請輸入大於 0 的數字。'; return; }
    const e = out/inp*100, full = inp/s, hr = full/(m/60);
    v.className = 'verdict ' + (e>=70 ? 'ok' : 'bad');
    v.innerHTML = `效率 <b style="font-size:1.4em">${e.toFixed(1)}%</b><br>產出 ${out.toLocaleString()} 標準分鐘 ÷ 投入 ${inp.toLocaleString()} 分鐘<br>100% 效率的目標產量：<b>${Math.round(full).toLocaleString()}</b> 件（每小時 ${Math.round(hr)} 件）${e>100?'<br>超過 100%：可能 SMV 訂得太寬，或產量有算錯，值得查一查。':''}`;
  };
  el.querySelectorAll('input').forEach(i => i.oninput = calc); calc();
};

function heroAnim(){
  const r = $('#hsr'), n = $('#hn'); if(!r) return;
  const set = t => { const x = 30 + t*710; r.setAttribute('width', x); n.setAttribute('transform', `translate(${x},${-12 + Math.abs(Math.sin(t*Math.PI*28))*24})`); };
  if(RM){ set(1); return; }
  anim(3600, set);
}
function renderHome(){
  const next = P.last && IDX[P.last]!==undefined ? P.last : (LESSONS.find(l=>!P.done.includes(l.id))||LESSONS[0]).id;
  const started = P.done.length || P.last;
  view.innerHTML = `<section class="hero">
    <p class="kicker">成衣機台學習課程・針織與梭織・從入門到專業</p>
    <h1>從一根針開始</h1>
    <p class="sub">布是怎麼來的？縫紉機怎麼把兩條線鎖在一起？拷克、三本車、扁車差在哪？從一件衣服的旅程出發，一路學到工廠裡的調機、品質、保養與效率。國中生看得懂，專業人員也用得上。</p>
    ${heroSVG()}
    <p class="note">▲ 點一下圖可以重播</p>
    <div class="row"><a class="btn" style="text-decoration:none" href="#/${next}">${started?'繼續上課':'開始上課'} →</a><a class="btn ghost" style="text-decoration:none" href="#/glossary">名詞辭典</a></div>
  </section>
  <div class="map">
  ${[1,2,3,4].map(lv => `<section class="lvl"><h2>${LV[lv].name}</h2><p>${LV[lv].desc}</p><ul class="lessons">${LESSONS.map((l,i)=>[l,i]).filter(a=>a[0].lv===lv).map(([l,i]) => {
    const d = P.done.includes(l.id);
    return `<li class="${d?'done':''}"><a href="#/${l.id}"><span class="no">${num(i)}</span><span class="ttl">${l.title}<small>${l.sub}</small></span><span class="st">${d?'✓ 已完成':'未完成'}</span></a></li>`; }).join('')}</ul></section>`).join('')}
  </div>
  <h2>工具</h2>
  <div class="tools"><a href="#/glossary">名詞辭典<small>${G.length} 個專有名詞的意思與名稱由來</small></a><a href="#/exam">結業測驗<small>隨機 20 題，80 分以上可以列印結業證書</small></a></div>
  <p class="note" style="margin-top:2em">學習進度只存在這台裝置的瀏覽器裡。檔案可以直接下載、離線打開，也可以傳給同事或學生。</p>`;
  $('#hero').addEventListener('click', heroAnim);
  heroAnim();
}

/* ---- 課程頁 ---- */
function renderLesson(id){window.AC_COURSE_GO=function(v){renderLesson(v)};window.AC_COURSE_POSITION=id;
  const i = IDX[id], l = LESSONS[i], p = LESSONS[i-1], n = LESSONS[i+1];
  P.last = id; save();
  view.innerHTML = `<header class="lesson-h"><p class="kicker">${LV[l.lv].name}　第 ${i+1} 課</p><h1>${l.title}</h1><p class="goal"><b>學完這一課：</b>${l.goal}</p></header>
  <article class="lesson">${l.html}</article>
  <section class="quiz" aria-label="小測驗"><h2>小測驗</h2><p class="note">三題答對兩題，就算完成這一課。${P.done.includes(id)?'<b class="okc">（這一課已完成 ✓）</b>':''}</p><div class="qs"></div><div class="qres" aria-live="polite"></div></section>
  <nav class="pager">${p?`<a href="#/${p.id}"><small>← 上一課</small>${p.title}</a>`:'<span></span>'}${n?`<a class="next" href="#/${n.id}"><small>下一課 →</small>${n.title}</a>`:`<a class="next" href="#/exam"><small>全部上完了 →</small>結業測驗</a>`}</nav>`;
  view.querySelectorAll('[data-lab]').forEach(el => { const f = labs[el.dataset.lab]; if(f) try { f(el); } catch(e) { console.error(el.dataset.lab, e); } });
  buildQuiz(l);
}
function buildQuiz(l){
  const box = $('.qs', view), res = $('.qres', view);
  let answered = 0, right = 0;
  box.innerHTML = l.quiz.map((q,k) => `<div class="q"><div class="qt">${k+1}. ${q[0]}</div><div class="opts">${q[1].map((o,j)=>`<button type="button" data-j="${j}">${'ABCD'[j]}. ${o}</button>`).join('')}</div><div class="ex-ans" hidden></div></div>`).join('');
  box.querySelectorAll('.q').forEach((qd,k) => {
    const q = l.quiz[k], bs = qd.querySelectorAll('button');
    bs.forEach(b => b.addEventListener('click', () => {
      const j = +b.dataset.j, ok = j === q[2];
      bs.forEach(x => { x.disabled = true; if(+x.dataset.j === q[2]) x.classList.add('right'); });
      if(!ok) b.classList.add('wrong');
      const ex = qd.querySelector('.ex-ans'); ex.hidden = false;
      ex.innerHTML = `<b class="${ok?'okc':'badc'}">${ok?'答對了！':'差一點。'}</b>${q[3]}`;
      answered++; if(ok) right++;
      if(answered === l.quiz.length){
        if(right >= 2){ markDone(l.id); res.innerHTML = `<div class="verdict ok"><b>答對 ${right} / ${l.quiz.length} 題，完成這一課！</b> 左邊課程地圖上的線跡又多了一針。</div>`; }
        else res.innerHTML = `<div class="verdict bad"><b>答對 ${right} / ${l.quiz.length} 題。</b>回頭看看上面的內容，再試一次。</div><div class="row" style="margin-top:8px"><button class="btn" type="button">重新作答</button></div>`;
        const rb = res.querySelector('button'); if(rb) rb.onclick = () => { res.innerHTML=''; buildQuiz(l); };
      }
    }));
  });
}

/* ---- 名詞小視窗 ---- */
function findTerm(el){
  const k = (el.dataset.g || el.textContent).trim();
  if(GM[k]) return GM[k];
  return G.find(g => k.includes(g[0])) || G.find(g => g[0].includes(k)) || null;
}
let popFrom = null;
function openPop(el){
  const g = findTerm(el); if(!g) return;
  popFrom = el;
  const li = IDX[g[3]], link = li!==undefined && cur !== g[3] ? `<p><a href="#/${g[3]}">在第 ${li+1} 課「${LESSONS[li].title}」學到 →</a></p>` : '';
  pop.innerHTML = `<button class="x" type="button" aria-label="關閉">×</button><h4>${g[0]}</h4><div class="en">${g[1]}</div><p>${g[2]}</p>${link}`;
  pop.hidden = false; pop.querySelector('.x').focus();
}
function closePop(){ if(pop.hidden) return; pop.hidden = true; if(popFrom && popFrom.isConnected) popFrom.focus(); popFrom = null; }
document.addEventListener('click', e => {
  const t = e.target.closest('.t');
  if(t && view.contains(t)){ openPop(t); return; }
  if(e.target.closest('.x') && pop.contains(e.target)){ closePop(); return; }
  if(!pop.hidden && !pop.contains(e.target)) closePop();
  if(pop.contains(e.target) && e.target.closest('a')) closePop();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closePop(); closeMenu(); }
  const t = e.target.closest && e.target.closest('.t');
  if(t && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openPop(t); }
});

/* ---- 名詞辭典 ---- */
function renderGlossary(){
  const list = G.slice().sort((a,b) => (IDX[a[3]]??99) - (IDX[b[3]]??99));
  view.innerHTML = `<header class="lesson-h"><p class="kicker">工具</p><h1>名詞辭典</h1><p class="goal">${G.length} 個成衣廠常用的專有名詞：意思、英文，以及名稱是怎麼來的。</p></header>
  <input type="search" placeholder="搜尋名詞、英文或解釋，例如：拷克、SPI、shuttle" aria-label="搜尋名詞" style="width:100%">
  <p class="note gl-n"></p><div class="gl"></div>`;
  const inp = $('input', view), box = $('.gl', view), cnt = $('.gl-n', view);
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    const r = list.filter(g => !q || (g[0]+g[1]+g[2]).toLowerCase().includes(q));
    cnt.textContent = q ? `找到 ${r.length} 個` : '依課程順序排列';
    box.innerHTML = r.map(g => { const li = IDX[g[3]];
      return `<div class="gl-item"><h3>${g[0]}<span class="en">${g[1]}</span></h3><p>${g[2]}</p>${li!==undefined?`<a href="#/${g[3]}">第 ${li+1} 課・${LESSONS[li].title}</a>`:''}</div>`; }).join('') || '<p>找不到，換個關鍵字試試。</p>';
  };
  inp.addEventListener('input', draw); draw();
}

/* ---- 結業測驗 ---- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function renderExam(){
  view.innerHTML = `<header class="lesson-h"><p class="kicker">結業</p><h1>結業測驗</h1><p class="goal">從 17 課的題目中隨機抽 20 題，每題 5 分，80 分以上就能列印結業證書。目前已完成 ${P.done.length} / ${LESSONS.length} 課。</p></header>
  <div class="row"><button class="btn" type="button">開始測驗</button></div>`;
  $('.btn', view).onclick = startExam;
}
function startExam(){
  const pool = []; LESSONS.forEach((l,i) => l.quiz.forEach(q => pool.push({q, i})));
  const qs = shuffle(pool).slice(0,20).map(({q,i}) => { const o = shuffle(q[1].map((t,j)=>({t, ok: j===q[2]}))); return {t:q[0], o, a:o.findIndex(x=>x.ok), ex:q[3], i}; });
  view.innerHTML = `<header class="lesson-h"><p class="kicker">結業</p><h1>結業測驗</h1><p class="goal">共 20 題，全部作答後按「交卷」。</p></header>
  <form class="exam" onsubmit="return false">${qs.map((q,k) => `<fieldset class="eq"><legend>${k+1}. ${q.t}</legend>${q.o.map((o,j)=>`<label><input type="radio" name="q${k}" value="${j}"><span>${'ABCD'[j]}. ${o.t}</span></label>`).join('')}<div class="ex-ans" hidden></div></fieldset>`).join('')}
  <p class="er note" aria-live="polite"></p><div class="row"><button class="btn" type="button">交卷</button></div></form><div class="result"></div>`;
  window.scrollTo(0,0);
  const form = $('.exam', view);
  $('.btn', form).onclick = () => {
    const ans = qs.map((q,k) => { const c = form.querySelector(`input[name=q${k}]:checked`); return c ? +c.value : -1; });
    const miss = ans.filter(a => a<0).length;
    if(miss){ $('.er', form).textContent = `還有 ${miss} 題沒有作答。`; return; }
    let right = 0;
    form.querySelectorAll('.eq').forEach((fs,k) => { const q = qs[k], ok = ans[k] === q.a; if(ok) right++;
      fs.classList.add(ok ? 'r' : 'w'); fs.querySelectorAll('input').forEach(x => x.disabled = true);
      const ex = fs.querySelector('.ex-ans'); ex.hidden = false;
      ex.innerHTML = `<b class="${ok?'okc':'badc'}">${ok?'正確':'正確答案：'+'ABCD'[q.a]}</b>　${q.ex}　<a href="#/${LESSONS[q.i].id}">（第 ${q.i+1} 課）</a>`; });
    $('.row', form).remove(); $('.er', form).remove();
    showResult(right*5);
  };
}
function showResult(score){
  const box = $('.result', view), pass = score >= 80;
  const d = new Date(), ds = `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`;
  box.innerHTML = `<h2>你的成績</h2><div class="score">${score}<small style="font-size:.4em"> 分</small></div>
  ${pass ? `<p class="okc"><b>恭喜通過！</b>輸入你的名字，就能列印結業證書。</p>
    <div class="row"><input type="text" maxlength="20" placeholder="你的名字" aria-label="證書上的名字" value="${(P.name||'').replace(/"/g,'&quot;')}"><button class="btn" type="button" data-a="print">列印證書</button><button class="btn ghost" type="button" data-a="again">再考一次</button></div>
    <div class="cert" id="cert"><div class="cert-in"><p class="c1">結 業 證 書</p><p>茲證明</p><h2 class="cn">　</h2>
    <p>已完成「從一根針開始：成衣機台學習課程（針織與梭織）」<br>全部 ${LESSONS.length} 課，並以 <b>${score}</b> 分通過結業測驗。</p>
    <svg viewBox="0 0 300 14" style="width:60%;margin:10px auto;display:block" aria-hidden="true"><line x1="4" y1="7" x2="296" y2="7" stroke="#D99A2B" stroke-width="3" stroke-dasharray="12 6" stroke-linecap="round"/></svg>
    <p class="c-date">${ds}</p></div></div>`
  : `<p class="badc"><b>還差一點！</b>80 分以上才能拿證書。看看上面答錯的題目，回到那一課複習後再試一次。</p><div class="row"><button class="btn" type="button" data-a="again">再考一次</button></div>`}`;
  const again = $('[data-a=again]', box); again.onclick = () => startExam();
  if(pass){
    const inp = $('input', box), cn = $('.cn', box);
    const upd = () => { cn.textContent = inp.value.trim() || '　'; P.name = inp.value.trim(); save(); };
    inp.oninput = upd; upd();
    $('[data-a=print]', box).onclick = () => { if(!inp.value.trim()){ inp.focus(); return; } window.print(); };
  }
  box.scrollIntoView({behavior: RM ? 'auto' : 'smooth'});
}

/* ---- 路由 ---- */
function route(){
  closePop(); closeMenu();
  const h = (location.hash || '').replace(/^#\/?/, '') || 'home';
  cur = IDX[h] !== undefined || h === 'glossary' || h === 'exam' ? h : 'home';
  if(IDX[cur] !== undefined) renderLesson(cur);
  else if(cur === 'glossary') renderGlossary();
  else if(cur === 'exam') renderExam();
  else renderHome();
  view.querySelectorAll('.t').forEach(t => { t.tabIndex = 0; t.setAttribute('role','button'); });
  const l = LESSONS[IDX[cur]];
  document.title = (l ? l.title + '｜' : cur==='glossary' ? '名詞辭典｜' : cur==='exam' ? '結業測驗｜' : '') + '從一根針開始：成衣機台學習課程';
  buildNav(); window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
route();
