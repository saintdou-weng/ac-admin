<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VRT AI 數位化追蹤 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f2f6;
  --s0:#fff;
  --s1:#f8f9fb;
  --s2:#eef0f4;
  --s3:#e3e6ec;
  --bdr:#d8dce6;
  --bdr2:#eaecf2;
  --txt:#1c2235;
  --txt2:#4a5568;
  --txt3:#94a3b8;
  --acc:#16664f;--accl:#e4f5ef;--accm:#9fd5c3;
  --acc2:#1e4db7;
  --done:#15803d;--donel:#f0fdf4;--doneb:#86efac;
  --prog:#b45309;--progl:#fffbeb;--progb:#fcd34d;
  --plan:#1d4ed8;--planl:#eff6ff;--planb:#93c5fd;
  --pend:#7c3aed;--pendl:#f5f3ff;--pendb:#c4b5fd;
  --none:#6b7280;--nonel:#f9fafb;--noneb:#d1d5db;
  --tg:#229ED9;
  --r:10px;--rr:14px;
  --sh:0 1px 4px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shm:0 8px 28px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',sans-serif;min-height:100vh;padding-bottom:72px}

/* ── SVG ICONS (inline) ── */
.ico{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── HEADER ── */
.hdr{background:var(--s0);border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:300;
  padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.logo{width:32px;height:32px;background:var(--acc);border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-family:'Outfit',sans-serif;font-weight:800;font-size:11px;color:#fff;flex-shrink:0}
.hdr-info{flex:1;min-width:0}
.hdr-title{font-family:'Outfit',sans-serif;font-size:13px;font-weight:800;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-size:9px;color:var(--txt3);font-family:'DM Mono',monospace}
.hdr-acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.icon-btn{width:36px;height:36px;border:1px solid var(--bdr);border-radius:9px;background:var(--s1);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s;position:relative;flex-shrink:0}
.icon-btn:hover{border-color:var(--acc);background:var(--accl)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.tg-btn{background:#e8f6fd;border-color:#a5d8f3}
.icon-btn.tg-btn:hover{background:#d0edfa;border-color:var(--tg)}
.icon-btn.tg-btn svg{color:var(--tg)}
.icon-btn.save-active{border-color:var(--done);background:var(--donel)}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;
  background:#dc2626;color:#fff;font-size:8px;font-family:'DM Mono',monospace;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--s0)}

/* ── PROGRESS STRIP ── */
.pstrip{background:var(--s0);border-bottom:1px solid var(--bdr);padding:8px 14px}
.pstrip-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pstrip-pct{font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;color:var(--acc)}
.pstrip-cnt{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.pchip{font-size:9px;padding:2px 7px;border-radius:8px;font-family:'DM Mono',monospace;border:1px solid;white-space:nowrap}
.pc-done{background:var(--donel);color:var(--done);border-color:var(--doneb)}
.pc-prog{background:var(--progl);color:var(--prog);border-color:var(--progb)}
.pc-plan{background:var(--planl);color:var(--plan);border-color:var(--planb)}
.pc-pend{background:var(--pendl);color:var(--pend);border-color:var(--pendb)}
.pc-none{background:var(--nonel);color:var(--none);border-color:var(--noneb)}
.pbar-track{height:8px;background:var(--s3);border-radius:4px;overflow:hidden;display:flex}
.pb{height:100%;transition:width .7s cubic-bezier(.4,0,.2,1)}
.pb-done{background:var(--done)}.pb-prog{background:var(--prog)}
.pb-plan{background:var(--plan)}.pb-pend{background:var(--pend)}

/* ── VIEW TABS ── */
.vtabs{background:var(--s0);border-bottom:1px solid var(--bdr);padding:0 14px;
  display:flex;align-items:center;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.vtabs::-webkit-scrollbar{display:none}
.vt{padding:10px 14px;font-size:12px;font-weight:600;color:var(--txt3);cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;transition:all .13s;font-family:'Outfit',sans-serif}
.vt.on{color:var(--acc);border-bottom-color:var(--acc)}
.vtabs-sp{flex:1}
.nav-wrap{display:flex;align-items:center;gap:4px;padding:6px 0}
.nav-btn{width:28px;height:28px;border:1px solid var(--bdr);border-radius:7px;background:var(--s1);
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--txt2);transition:all .13s}
.nav-btn:hover{border-color:var(--acc);color:var(--acc)}
.nav-label{font-size:11px;font-family:'DM Mono',monospace;color:var(--txt2);white-space:nowrap;
  min-width:80px;text-align:center;font-weight:500}

/* ── STATUS FILTER ── */
.sflt{padding:8px 14px;display:flex;gap:5px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sflt::-webkit-scrollbar{display:none}
.sf{padding:5px 12px;border-radius:14px;border:1px solid var(--bdr);background:var(--s0);
  cursor:pointer;font-size:11px;color:var(--txt2);transition:all .13s;white-space:nowrap;flex-shrink:0}
.sf.on{font-weight:700}
.sf-all.on{background:var(--accl);color:var(--acc);border-color:var(--accm)}
.sf-done.on{background:var(--donel);color:var(--done);border-color:var(--doneb)}
.sf-prog.on{background:var(--progl);color:var(--prog);border-color:var(--progb)}
.sf-plan.on{background:var(--planl);color:var(--plan);border-color:var(--planb)}
.sf-pend.on{background:var(--pendl);color:var(--pend);border-color:var(--pendb)}
.sf-none.on{background:var(--nonel);color:var(--none);border-color:var(--noneb)}

/* ── SEARCH ── */
.srch-wrap{padding:0 14px 8px}
.srch{width:100%;padding:8px 12px;border:1px solid var(--bdr);border-radius:var(--r);
  font-size:13px;color:var(--txt);background:var(--s0);outline:none;font-family:'Noto Sans TC',sans-serif}
.srch:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accl)}
.srch::placeholder{color:var(--txt3)}

/* ── MAIN CONTENT ── */
.content{padding:0 14px}

/* ── CATEGORY GROUP ── */
.cat-grp{margin-bottom:10px}
.cat-hdr{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--s0);
  border:1px solid var(--bdr);border-radius:var(--rr);cursor:pointer;user-select:none;
  box-shadow:var(--sh);margin-bottom:2px}
.cat-hdr.open{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:var(--bdr2)}
.cat-ico{font-size:16px;flex-shrink:0}
.cat-nm{font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;flex:1}
.cat-cnt{font-size:10px;font-family:'DM Mono',monospace;color:var(--txt3);
  background:var(--s2);padding:2px 7px;border-radius:8px}
.cat-bar-mini{width:48px;height:4px;background:var(--s3);border-radius:2px;overflow:hidden}
.cat-bar-mini-in{height:100%;border-radius:2px;background:var(--done)}
.cat-pct-mini{font-size:10px;font-family:'DM Mono',monospace;color:var(--txt3);width:28px;text-align:right}
.cat-chev{font-size:13px;color:var(--txt3);transition:transform .18s;flex-shrink:0}
.cat-hdr.open .cat-chev{transform:rotate(90deg)}

/* ── ITEM LIST ── */
.item-list{border:1px solid var(--bdr);border-top:none;border-bottom-left-radius:var(--rr);
  border-bottom-right-radius:var(--rr);background:var(--s0);overflow:hidden;box-shadow:var(--sh)}

/* ── ITEM ROW ── */
.item{border-bottom:1px solid var(--bdr2);cursor:pointer;transition:background .12s}
.item:last-child{border-bottom:none}
.item.exp{background:var(--accl)}
.item-main{padding:10px 12px;display:flex;align-items:center;gap:10px}
.item:hover .item-main{background:var(--s1)}
.item.exp .item-main{background:var(--accl)}
.item-left{flex:1;min-width:0}
.item-row1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.item-chev{font-size:11px;color:var(--txt3);transition:transform .16s;flex-shrink:0}
.item.exp .item-chev{transform:rotate(90deg);color:var(--acc)}
.item-zh{font-size:13px;font-weight:700;color:var(--txt);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-en{font-size:10px;color:var(--txt3);font-family:'DM Mono',monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:17px}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.sbadge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:10px;
  font-size:10px;font-weight:700;font-family:'DM Mono',monospace;border:1px solid;
  cursor:pointer;transition:filter .12s;white-space:nowrap}
.sbadge:hover{filter:brightness(.92)}
.sb-done{background:var(--donel);color:var(--done);border-color:var(--doneb)}
.sb-prog{background:var(--progl);color:var(--prog);border-color:var(--progb)}
.sb-plan{background:var(--planl);color:var(--plan);border-color:var(--planb)}
.sb-pend{background:var(--pendl);color:var(--pend);border-color:var(--pendb)}
.sb-none{background:var(--nonel);color:var(--none);border-color:var(--noneb)}
.item-pct-bar{width:60px;height:4px;background:var(--s3);border-radius:2px;overflow:hidden}
.item-pct-bar-in{height:100%;border-radius:2px;transition:width .4s}
.item-owner{font-size:9px;font-family:'DM Mono',monospace;color:var(--txt3)}

/* ── GANTT IN ROW (mini, for day/week view) ── */
.item-gantt{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;position:relative;margin-top:4px;margin-left:17px}
.ig-bar{position:absolute;top:0;height:100%;border-radius:3px;opacity:.75}
.ig-today{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(220,38,38,.5)}

/* ── DETAIL PANEL ── */
.item-det{display:none;padding:12px;border-top:1px solid var(--accm);background:var(--s0)}
.item.exp .item-det{display:block}
.det-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.dblk{background:var(--s1);border:1px solid var(--bdr2);border-radius:var(--r);padding:9px 10px}
.dblk.full{grid-column:1/3}
.dl{font-size:9px;font-weight:700;color:var(--txt3);text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:3px;font-family:'DM Mono',monospace}
.dv{font-size:12px;color:var(--txt);line-height:1.5}
.dv.note{color:var(--txt2);font-size:11px;min-height:28px}
.det-btns{display:flex;gap:6px;margin-top:8px}
.det-btn{flex:1;padding:8px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--s0);
  font-size:12px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;color:var(--txt2);transition:all .13s;text-align:center}
.det-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--accl)}
.det-btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.det-btn.primary:hover{background:#125542;border-color:#125542}
.det-btn.tgb{background:#e8f6fd;color:var(--tg);border-color:#a5d8f3}
.det-btn.tgb:hover{background:#d0edfa;border-color:var(--tg)}

/* ── TIMELINE VIEW (month/year Gantt) ── */
.timeline-wrap{background:var(--s0);border:1px solid var(--bdr);border-radius:var(--rr);
  overflow:hidden;box-shadow:var(--sh)}
.tl-head{display:flex;border-bottom:1px solid var(--bdr);background:var(--s1)}
.tl-label-col{width:130px;flex-shrink:0;padding:7px 10px;font-size:9px;font-weight:700;
  color:var(--txt3);font-family:'DM Mono',monospace;border-right:1px solid var(--bdr2);
  text-transform:uppercase;letter-spacing:.5px}
.tl-cols{flex:1;display:flex;overflow:hidden}
.tl-col-hdr{flex:1;text-align:center;font-size:9px;font-family:'DM Mono',monospace;
  color:var(--txt3);padding:7px 2px;border-right:1px solid var(--bdr2)}
.tl-col-hdr:last-child{border-right:none}
.tl-col-hdr.today-col{background:rgba(220,38,38,.06);color:#dc2626;font-weight:700}
.tl-body{max-height:calc(100vh - 280px);overflow-y:auto}
.tl-cat-row{display:flex;background:var(--s2);border-bottom:1px solid var(--bdr2)}
.tl-cat-lbl{width:130px;flex-shrink:0;padding:5px 10px;font-size:10px;font-weight:700;
  font-family:'Outfit',sans-serif;border-right:1px solid var(--bdr2)}
.tl-cat-bars{flex:1;position:relative;display:flex;align-items:center}
.tl-row{display:flex;border-bottom:1px solid var(--bdr2);cursor:pointer;transition:background .12s;min-height:36px}
.tl-row:hover{background:var(--s1)}
.tl-row:last-child{border-bottom:none}
.tl-lbl{width:130px;flex-shrink:0;padding:6px 10px;border-right:1px solid var(--bdr2);
  display:flex;flex-direction:column;justify-content:center}
.tl-zh{font-size:11px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-en{font-size:9px;color:var(--txt3);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bars{flex:1;position:relative;display:flex;align-items:center;padding:4px 0}
.tl-bar{position:absolute;height:18px;border-radius:4px;opacity:.85;display:flex;align-items:center;
  padding:0 5px;overflow:hidden;min-width:4px;transition:opacity .15s}
.tl-bar:hover{opacity:1}
.tl-bar-txt{font-size:8px;font-family:'DM Mono',monospace;color:#fff;white-space:nowrap;overflow:hidden;font-weight:600}
.tl-today{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(220,38,38,.5);z-index:5;pointer-events:none}
.tl-grid-line{position:absolute;top:0;bottom:0;width:1px;background:var(--bdr2);z-index:1;pointer-events:none}
.tl-badge{position:absolute;right:4px;top:50%;transform:translateY(-50%)}

/* ── BOTTOM NAV (mobile) ── */
.bnav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--s0);
  border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-around;
  z-index:200;box-shadow:0 -2px 12px rgba(0,0,0,.07);padding-bottom:env(safe-area-inset-bottom)}
.bn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;
  padding:6px 12px;border-radius:10px;transition:all .13s;flex:1}
.bn:hover,.bn.on{background:var(--accl)}
.bn svg{width:20px;height:20px;color:var(--txt3);transition:color .13s}
.bn.on svg,.bn:hover svg{color:var(--acc)}
.bn-lbl{font-size:9px;color:var(--txt3);font-family:'DM Mono',monospace;transition:color .13s}
.bn.on .bn-lbl,.bn:hover .bn-lbl{color:var(--acc);font-weight:600}

/* ── MODAL ── */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:500;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.ov.on{display:flex}
.modal{background:var(--s0);border-radius:20px 20px 0 0;width:100%;max-height:92vh;
  overflow-y:auto;box-shadow:var(--shm);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:600px){
  .ov{align-items:center}
  .modal{border-radius:var(--rr);max-width:520px;max-height:90vh}
}
.mhdr{padding:14px 16px 10px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;
  position:sticky;top:0;background:var(--s0);z-index:1}
.mpull{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 12px;display:block}
.mtitle{font-size:14px;font-weight:700;font-family:'Outfit',sans-serif;flex:1;color:var(--txt)}
.mclose{width:28px;height:28px;border:1px solid var(--bdr);background:var(--s1);color:var(--txt2);
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.mbody{padding:14px 16px}
.fg{margin-bottom:11px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}
.fl{display:block;font-size:10px;font-weight:700;color:var(--txt2);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.5px;font-family:'DM Mono',monospace}
.fi,.fs,.fta{width:100%;padding:9px 11px;border:1px solid var(--bdr);border-radius:var(--r);
  background:var(--s0);color:var(--txt);font-size:14px;outline:none;font-family:'Noto Sans TC',sans-serif;transition:border .12s}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accl)}
.fta{resize:vertical;min-height:70px;font-size:13px}
.mfooter{padding:11px 16px;border-top:1px solid var(--bdr);display:flex;gap:7px;
  position:sticky;bottom:0;background:var(--s0)}
.btn{padding:10px 16px;border-radius:var(--r);border:1px solid var(--bdr);cursor:pointer;
  font-size:13px;background:var(--s1);color:var(--txt2);font-family:'Noto Sans TC',sans-serif;transition:all .13s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc);flex:1;font-weight:600}
.btn-p:hover{background:#125542}
.btn-del{background:#fef2f2;color:#dc2626;border-color:#fca5a5}
.btn-del:hover{background:#fee2e2}

/* ── CLOUD MENU SHEET ── */
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:400;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.sheet-box{background:var(--s0);border-radius:20px 20px 0 0;width:100%;padding:8px 16px 32px;
  box-shadow:var(--shm)}
.sheet-title{font-size:12px;font-weight:700;color:var(--txt3);text-align:center;padding:8px 0 14px;
  font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px}
.sheet-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--bdr2);
  cursor:pointer;transition:background .12s;border-radius:var(--r);margin:0 -4px}
.sheet-item:hover{background:var(--s1)}
.sheet-item:last-child{border-bottom:none}
.si-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.si-ico svg{width:20px;height:20px}
.si-info{flex:1}
.si-nm{font-size:13px;font-weight:600;color:var(--txt)}
.si-desc{font-size:11px;color:var(--txt3);margin-top:1px}

/* ── TOAST ── */
#tc{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:5px;pointer-events:none;min-width:220px}
.toast{padding:10px 16px;border-radius:10px;font-size:12px;border:1px solid;
  font-family:'DM Mono',monospace;box-shadow:var(--sh);text-align:center}
.tok{background:var(--donel);color:var(--done);border-color:var(--doneb)}
.terr{background:#fef2f2;color:#dc2626;border-color:#fca5a5}
.tinfo{background:var(--s0);color:var(--txt2);border-color:var(--bdr)}

/* ── EMPTY ── */
.empty{padding:48px 20px;text-align:center;color:var(--txt3);font-size:13px}
.empty-ico{font-size:40px;display:block;margin-bottom:10px;opacity:.4}

/* ── RESPONSIVE ── */
@media(min-width:640px){
  .content{padding:0 20px}
  .pstrip,.vtabs,.sflt,.srch-wrap{padding-left:20px;padding-right:20px}
  .hdr{padding:0 20px}
  body{padding-bottom:0}
  .bnav{display:none}
  .tl-label-col,.tl-lbl{width:160px}
}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo">VRT</div>
  <div class="hdr-info">

// ════ STATS ════
function stats(arr){const c={done:0,prog:0,plan:0,pend:0,none:0};arr.forEach(d=>c[d.st]=(c[d.st]||0)+1);return c;}
function updHeader(){
  const c=stats(DATA),n=DATA.length;
  const dp=n?Math.round(c.done/n*100):0;
  document.getElementById('psPct').textContent=dp+'%';
  document.getElementById('psChips').innerHTML=
    `<span class="pchip pc-done">✅${c.done}</span>
     <span class="pchip pc-prog">🔄${c.prog}</span>
     <span class="pchip pc-plan">📅${c.plan}</span>
     <span class="pchip pc-pend">⏸${c.pend}</span>
     <span class="pchip pc-none">—${c.none}</span>`;
  ['Done','Prog','Plan','Pend'].forEach(k=>{
    document.getElementById('pb'+k).style.width=n?c[k.toLowerCase()]/n*100+'%':'0%';
  });
}

// ════ NAV LABEL ════
function updateNavLabel(){
  const d=navDate;
  const y=d.getFullYear(), m=d.getMonth();
  if(curView==='day') document.getElementById('navLabel').textContent=`${y}/${String(m+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  else if(curView==='week'){
    const dow=d.getDay(), mon=new Date(d);mon.setDate(d.getDate()-dow);
    const sun=new Date(mon);sun.setDate(mon.getDate()+6);
    document.getElementById('navLabel').textContent=`${mon.getMonth()+1}/${mon.getDate()}–${sun.getDate()}`;
  }
  else if(curView==='month') document.getElementById('navLabel').textContent=`${y}年 ${MONTHS_ZH[m]}`;
  else document.getElementById('navLabel').textContent=`${y}年`;
}
function navPrev(){
  if(curView==='day')navDate.setDate(navDate.getDate()-1);
  else if(curView==='week')navDate.setDate(navDate.getDate()-7);
  else if(curView==='month')navDate.setMonth(navDate.getMonth()-1);
  else navDate.setFullYear(navDate.getFullYear()-1);
  render();
}
function navNext(){
  if(curView==='day')navDate.setDate(navDate.getDate()+1);
  else if(curView==='week')navDate.setDate(navDate.getDate()+7);
  else if(curView==='month')navDate.setMonth(navDate.getMonth()+1);
  else navDate.setFullYear(navDate.getFullYear()+1);
  render();
}
function navToday(){navDate=new Date();render();}

// ════ VIEW ════
function setView(v){
  curView=v;
  ['list','day','week','month','year'].forEach(x=>{
    document.getElementById('vt-'+x)?.classList.toggle('on',x===v);
    document.getElementById('bn-'+x)?.classList.toggle('on',x===v);

  document.getElementById('bn-month')?.classList.toggle('on',v==='month');
  document.getElementById('bn-year')?.classList.toggle('on',v==='year');
  document.getElementById('bn-list')?.classList.toggle('on',v==='list');

}

// ════ FILTER ════
function getFiltered(){
  const q=document.getElementById('srch').value.trim().toLowerCase();
  return DATA.filter(d=>{
    if(curSt!=='all'&&d.st!==curSt)return false;
    if(q&&!d.zh.toLowerCase().includes(q)&&!d.en.toLowerCase().includes(q)&&!(d.note||'').toLowerCase().includes(q))return false;
    return true;
  });
}
function setSt(s,el){curSt=s;document.querySelectorAll('.sf').forEach(b=>b.classList.remove('on'));el.classList.add('on');render();}

// ════════════ RENDER ════════════
function render(){
  updHeader();
  updateNavLabel();
  const items=getFiltered();
  const el=document.getElementById('content');

  if(curView==='list') renderList(el,items);
  else if(curView==='day') renderDay(el,items);
  else if(curView==='week') renderWeek(el,items);
  else if(curView==='month') renderTimeline(el,items,'month');
  else if(curView==='year') renderTimeline(el,items,'year');
}

// ── LIST VIEW ──
function renderList(el,items){
  if(!items.length){el.innerHTML=`<div class="empty"><span class="empty-ico">🔍</span>沒有符合條件的項目</div>`;return;}
  const cats=[...new Set(items.map(d=>d.cat))];
  let html='';
  cats.forEach(cat=>{
    const grp=items.filter(d=>d.cat===cat);
    const cm=CAT[cat]||{};
    const gc=stats(grp);
    const dp=grp.length?Math.round(gc.done/grp.length*100):0;
    const open=!collapsed[cat];
    html+=`<div class="cat-grp">
      <div class="cat-hdr ${open?'open':''}" onclick="toggleCat('${cat}')">
        <span class="cat-ico">${cm.emoji||'📁'}</span>
        <span class="cat-nm" style="color:${cm.color||'inherit'}">${cm.label||cat}</span>
        <span class="cat-cnt">${grp.length}</span>
        <div class="cat-bar-mini"><div class="cat-bar-mini-in" style="width:${dp}%"></div></div>
        <span class="cat-pct-mini">${dp}%</span>
        <span class="cat-chev">${open?'›':'›'}</span>
      </div>`;
    if(open){
      html+=`<div class="item-list">`;
      grp.forEach(d=>{ html+=itemHTML(d,false); });
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  el.innerHTML=html;
}

        <div class="dblk"><div class="dl">預計開始</div><div class="dv" style="font-family:'DM Mono',monospace">${d.ds||'—'}</div></div>
        <div class="dblk"><div class="dl">預計完成</div><div class="dv" style="font-family:'DM Mono',monospace">${d.de||'—'}</div></div>

}

// ── DAY VIEW ──
function renderDay(el,items){
  const d=navDate;
  const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const relevant=items.filter(x=>(x.ds&&x.ds<=ds&&(x.de>=ds||!x.de))||(x.ds===ds)||(x.de===ds));
  const starting=items.filter(x=>x.ds===ds);
  const ending=items.filter(x=>x.de===ds);
  const ongoing=items.filter(x=>x.ds&&x.ds<ds&&x.de&&x.de>ds);
  let html=`<div style="margin-bottom:12px">`;
  if(starting.length){
    html+=`<div style="font-size:11px;font-weight:700;color:var(--plan);margin-bottom:6px;font-family:'DM Mono',monospace">🚀 今日開始 (${starting.length})</div>`;
    html+=`<div class="item-list">`+starting.map(d=>itemHTML(d,true)).join('')+`</div><div style="height:10px"></div>`;
  }
  if(ending.length){
    html+=`<div style="font-size:11px;font-weight:700;color:var(--done);margin-bottom:6px;font-family:'DM Mono',monospace">🏁 今日截止 (${ending.length})</div>`;
    html+=`<div class="item-list">`+ending.map(d=>itemHTML(d,true)).join('')+`</div><div style="height:10px"></div>`;
  }
  if(ongoing.length){
    html+=`<div style="font-size:11px;font-weight:700;color:var(--prog);margin-bottom:6px;font-family:'DM Mono',monospace">📌 進行中 (${ongoing.length})</div>`;
    html+=`<div class="item-list">`+ongoing.map(d=>itemHTML(d,true)).join('')+`</div>`;
  }
  if(!starting.length&&!ending.length&&!ongoing.length){
    html+=`<div class="empty"><span class="empty-ico">📅</span>此日無相關項目</div>`;
  }
  html+=`</div>`;
  el.innerHTML=html;
}

// ── WEEK VIEW ──
function renderWeek(el,items){
  const dow=navDate.getDay();
  const mon=new Date(navDate); mon.setDate(navDate.getDate()-dow);
  let html='';
  for(let i=0;i<7;i++){
    const day=new Date(mon); day.setDate(mon.getDate()+i);
    const ds=`${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}-${String(day.getDate()).padStart(2,'0')}`;
    const isToday=ds===TODAY.toISOString().slice(0,10);
    const dayItems=items.filter(x=>(x.ds===ds)||(x.de===ds)||(x.ds&&x.ds<ds&&x.de&&x.de>ds));
    html+=`<div style="margin-bottom:8px">
      <div style="font-size:11px;font-weight:700;color:${isToday?'var(--prog)':'var(--txt2)'};margin-bottom:5px;
        font-family:'Outfit',sans-serif;padding:4px 0;border-bottom:1px solid var(--bdr2)">
        ${isToday?'● ':''}${DAYS_ZH[i]} ${day.getMonth()+1}/${day.getDate()}${isToday?' (今天)':''}
      </div>`;
    if(dayItems.length){
      html+=`<div class="item-list">`+dayItems.map(d=>itemHTML(d,false)).join('')+`</div>`;
    } else {
      html+=`<div style="font-size:11px;color:var(--txt3);padding:6px 4px;font-family:'DM Mono',monospace;font-style:italic">— 無項目</div>`;
    }
    html+=`</div>`;
  }
  el.innerHTML=html;
}

// ── MONTH/YEAR TIMELINE (Gantt) ──
function renderTimeline(el,items,mode){
  const y=navDate.getFullYear();
  let refS,refE,cols,colLabel;
  if(mode==='month'){
    const m=navDate.getMonth();
    refS=new Date(y,m,1); refE=new Date(y,m+1,0);
    const daysInMonth=refE.getDate();
    cols=Array.from({length:daysInMonth},(_,i)=>i+1);
    colLabel=d=>String(d);
  } else {
    refS=new Date(y,0,1); refE=new Date(y,11,31);
    cols=MONTHS_EN;
    colLabel=m=>m;
  }
  const totalMs=refE-refS;
  function getPct(ds,de){
    const s=ds?new Date(ds):null, e=de?new Date(de):null;
    const sp=s?Math.max(0,Math.min(100,(s-refS)/totalMs*100)):null;
    const ep=e?Math.max(0,Math.min(100,(e-refS)/totalMs*100)):null;
    return {sp,ep};
  }
  const todayPct=Math.max(0,Math.min(100,(TODAY-refS)/totalMs*100));
  const isInRange=TODAY>=refS&&TODAY<=refE;

  // header
  let hdrcols=cols.map((c,i)=>{
    let isTodayCol=false;
    if(mode==='month'&&isInRange&&TODAY.getDate()===c&&TODAY.getMonth()===navDate.getMonth()) isTodayCol=true;
    if(mode==='year'&&isInRange&&TODAY.getMonth()===i) isTodayCol=true;
    return `<div class="tl-col-hdr ${isTodayCol?'today-col':''}">${colLabel(c)}</div>`;
  }).join('');

  const cats=[...new Set(items.map(d=>d.cat))];
  let bodyHtml='';
  cats.forEach(cat=>{
    const grp=items.filter(d=>d.cat===cat);
    const cm=CAT[cat]||{};
    bodyHtml+=`<div class="tl-cat-row">
      <div class="tl-cat-lbl" style="color:${cm.color||'inherit'}">${cm.emoji||''} ${cm.label||cat}</div>
      <div class="tl-cat-bars"></div>
    </div>`;
    grp.forEach(d=>{
      const sm=SM[d.st]||SM.none;
      const {sp,ep}=getPct(d.ds,d.de);
      let barHtml='';
      if(sp!==null&&ep!==null&&ep>sp){
        const pct=Math.max(0,Math.min(100,+d.pct||0));
        barHtml=`<div class="tl-bar" style="left:${sp}%;width:${ep-sp}%;background:${sm.bar}" title="${d.zh} (${d.ds}→${d.de})">
          <span class="tl-bar-txt">${d.zh}</span>
        </div>`;
      } else if(sp!==null){
        barHtml=`<div class="tl-bar" style="left:${sp}%;width:2%;background:${sm.bar}" title="${d.zh}"></div>`;
      }
      // grid lines
      let gridLines='';
      cols.forEach((_,i)=>{
        const lPct=(i+1)/cols.length*100;
        gridLines+=`<div class="tl-grid-line" style="left:${lPct}%"></div>`;
      });
      bodyHtml+=`<div class="tl-row" onclick="openEdit(${d.id})">
        <div class="tl-lbl">
          <div class="tl-zh">${d.zh}</div>
          <div class="tl-en">${d.en}</div>
        </div>
        <div class="tl-bars">
          ${gridLines}
          ${isInRange?`<div class="tl-today" style="left:${todayPct}%"></div>`:''}
          ${barHtml}
          <span class="tl-badge"><span class="sbadge ${sm.cls}" style="font-size:9px;padding:1px 5px">${sm.icon}</span></span>
        </div>
      </div>`;
    });
  });

  el.innerHTML=`<div class="timeline-wrap">
    <div class="tl-head">
      <div class="tl-label-col">模組</div>
      <div class="tl-cols">${hdrcols}</div>
    </div>
    <div class="tl-body">${bodyHtml}</div>
  </div>`;
}

// ════ TOGGLE ════
function toggleItem(id){
  const el=document.getElementById('item-'+id);
  if(!el)return;
  const wasExp=el.classList.contains('exp');
  el.closest('.item-list')?.querySelectorAll('.item.exp').forEach(r=>{if(r!==el)r.classList.remove('exp');});
  el.classList.toggle('exp',!wasExp);
}
function toggleCat(c){collapsed[c]=!collapsed[c];render();}
function cycleItem(e,id){
  e.stopPropagation();
  const ord=['none','plan','prog','pend','done'];
  const d=DATA.find(x=>x.id===id);if(!d)return;
  d.st=ord[(ord.indexOf(d.st)+1)%ord.length];
  if(d.st==='done')d.pct=100;
  save();render();
  setTimeout(()=>{const r=document.getElementById('item-'+id);if(r)r.classList.add('exp');},20);
  toast(d.zh+' → '+SM[d.st].lbl,'ok');
}

  document.getElementById('btnDel').style.display='';

function saveItem(){
  const zh=document.getElementById('fZH').value.trim();if(!zh){toast('請輸入名稱','err');return;}
  const obj={zh,en:document.getElementById('fEN').value.trim(),
    cat:document.getElementById('fCat').value,st:document.getElementById('fSt').value,
    pri:parseInt(document.getElementById('fPri').value)||0,
    own:document.getElementById('fOwn').value.trim(),
    ds:document.getElementById('fDs').value,de:document.getElementById('fDe').value,
    pct:Math.max(0,Math.min(100,parseInt(document.getElementById('fPct').value)||0)),
    note:document.getElementById('fNote').value.trim()};
  if(editId){const i=DATA.findIndex(x=>x.id===editId);if(i>=0)DATA[i]={...DATA[i],...obj};toast('已更新','ok');}
  else{DATA.push({id:nid(),...obj});toast('已新增','ok');}
  save();closeModal();render();
}
function delItem(){
  if(!editId)return;const d=DATA.find(x=>x.id===editId);
  if(!confirm('確定刪除「'+d?.zh+'」？'))return;
  DATA=DATA.filter(x=>x.id!==editId);save();closeModal();render();toast('已刪除','ok');
}

// ════ CLOUD SHEET ════
function openSheet(){document.getElementById('sheet').classList.add('on');}
function closeSheet(e){if(e.target===document.getElementById('sheet'))document.getElementById('sheet').classList.remove('on');}
function closeSheetDirect(){document.getElementById('sheet').classList.remove('on');}
function saveLocal(){save();toast('已儲存至本機','ok');closeSheetDirect();}
function xJSON(){
  const b=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='VRT_AI_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  toast('JSON 已下載','ok');closeSheetDirect();
}
function xCSV(){
  const h=['id','zh','en','cat','st','pri','own','ds','de','pct','note'];
  const r=DATA.map(d=>h.map(k=>JSON.stringify(d[k]??'')).join(','));
  const b=new Blob(['\uFEFF'+h.join(',')+'\n'+r.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='VRT_AI_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  toast('CSV 已下載','ok');closeSheetDirect();
}
function doImport(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{const d=JSON.parse(ev.target.result);if(!Array.isArray(d))throw new Error('格式錯誤');
      DATA=d;save();render();toast('匯入 '+d.length+' 筆','ok');}
    catch(err){toast('失敗：'+err.message,'err');}
  };
  r.readAsText(f);e.target.value='';
}
function resetDef(){
  if(!confirm('確定恢復預設資料？'))return;
  DATA=DEFAULT.map(d=>({...d}));save();render();toast('已恢復預設','ok');
}

// ════ TELEGRAM ════
function buildTgReport(){
  const c=stats(DATA),n=DATA.length;
  const dp=n?Math.round(c.done/n*100):0;
  const inprog=DATA.filter(d=>d.st==='prog').map(d=>`• ${d.zh} (${d.pct||0}%)`).join('\n');
  const pend=DATA.filter(d=>d.st==='pend').map(d=>`• ${d.zh}`).join('\n');
  const soon=DATA.filter(d=>d.st==='plan').map(d=>`• ${d.zh}${d.ds?' ('+d.ds+')':''}`).join('\n');
  return encodeURIComponent(
`📊 VRT AI 數位化進度報告
🗓 ${new Date().toLocaleDateString('zh-TW')}
━━━━━━━━━━━━━━━━━━
整體完成率：${dp}%（${c.done}/${n} 模組）
✅ 已完成：${c.done}　🔄 進行中：${c.prog}　📅 預計：${c.plan}　⏸ Pending：${c.pend}

🔄 進行中：
${inprog||'（無）'}

⏸ Pending：
${pend||'（無）'}

📅 即將進行：
${soon||'（無）'}
━━━━━━━━━━━━━━━━━━
Vantage River Textiles`);
}
function tgShare(){window.open('https://t.me/share/url?url=https%3A%2F%2Fvrt.ai&text='+buildTgReport(),'_blank');}
function tgShareItem(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;
  const sm=SM[d.st]||SM.none;
  const txt=encodeURIComponent(`${sm.icon} [VRT AI] ${d.zh} (${d.en})\n狀態：${sm.lbl}　完成度：${d.pct||0}%\n負責：${d.own||'—'}　截止：${d.de||'—'}\n${d.note||''}`);
  window.open('https://t.me/share/url?url=https%3A%2F%2Fvrt.ai&text='+txt,'_blank');
}

// ════ TOAST ════
function toast(msg,type='info'){
  const c=document.getElementById('tc');
  const el=document.createElement('div');
  el.className='toast '+({ok:'tok',err:'terr'}[type]||'tinfo');
  el.textContent=msg;c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},2000);
}

// ════ EVENTS ════
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSheetDirect();}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});

// ════ INIT ════
load();render();
</script>
