<style>
:root{color-scheme:light;--bg:#f6f7f9;--card:#fff;--ink:#0f172a;--ink2:#475569;--mut:#64748b;--line:#e2e8f0;--soft:#f1f5f9;--acc:#2563eb;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--flex:#8a8985;--good:#15803d;--warn:#b45309;--bad:#b91c1c;--info:#1d4ed8;--goodbg:#dcfce7;--warnbg:#fef3c7;--badbg:#fee2e2;--infobg:#dbeafe}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1115;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--mut:#9b9a92;--line:#2e2e2b;--soft:#232321;--acc:#60a5fa;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--flex:#9b9a92;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#93c5fd;--goodbg:#14532d55;--warnbg:#78350f55;--badbg:#7f1d1d55;--infobg:#1e3a8a55}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1115;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--mut:#9b9a92;--line:#2e2e2b;--soft:#232321;--acc:#60a5fa;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--flex:#9b9a92;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#93c5fd;--goodbg:#14532d55;--warnbg:#78350f55;--badbg:#7f1d1d55;--infobg:#1e3a8a55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:750;display:flex;align-items:center;gap:6px}
.top .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--acc);color:#fff;font-weight:650}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:650}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.wrap{max-width:1280px;margin:0 auto;padding:12px 14px 40px}
.years{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.yc{flex:0 0 auto;min-width:118px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left}
.yc.on{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.yc b{font-size:16px}.yc small{display:block;color:var(--mut);font-size:11.5px;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:6px 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.25}.kpi .s{font-size:12px;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;min-width:0}
.card h2{font-size:15px;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card h2 .grow{flex:1}
.mut{color:var(--mut)}.small{font-size:12.5px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.d{background:repeating-linear-gradient(90deg,currentColor 0 5px,transparent 5px 8px)!important}
.chart{position:relative;width:100%}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:170px;display:none;z-index:5}
.tip b{display:block;margin-bottom:2px}.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--soft);font-size:12px;color:var(--ink2);font-weight:650;position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;max-width:230px;white-space:normal;min-width:140px}
th:first-child{background:var(--soft);z-index:2}
td.ex{text-align:left;white-space:normal;min-width:260px;color:var(--ink2);font-size:12.5px}
tr.tot td{font-weight:750;background:var(--soft)}
tr.grp td{background:var(--soft);font-size:12px;color:var(--mut);font-weight:650;text-align:left}
td.cl,th.cl{background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.pill{display:inline-block;border-radius:999px;padding:0 7px;font-size:12px;font-weight:650}
.p-g{background:var(--goodbg);color:var(--good)}.p-y{background:var(--warnbg);color:var(--warn)}.p-r{background:var(--badbg);color:var(--bad)}.p-b{background:var(--infobg);color:var(--info)}.p-n{background:var(--soft);color:var(--mut)}
.note{display:block;margin-top:3px;color:var(--ink);background:var(--warnbg);border-radius:6px;padding:2px 6px}
.nb{border:0;background:transparent;cursor:pointer;font-size:13px;padding:0 3px;opacity:.7}.nb:hover{opacity:1}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.status{font-size:12.5px;color:var(--mut)}
.flag{font-size:12px;border-radius:8px;padding:6px 9px;margin:6px 0;background:var(--infobg);color:var(--ink)}
.flag.w{background:var(--warnbg)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:0;width:min(760px,96vw);max-height:90vh}
dialog.big{width:min(1120px,96vw)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dh h3{margin:0;font-size:15px;flex:1}
.db{padding:12px 14px;overflow:auto;max-height:calc(90vh - 110px)}
.df{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2)}
.fg label.w{grid-column:1/-1}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);min-width:0}
textarea{width:100%;min-height:90px}
.dtab td input,.dtab td select{width:100%;padding:4px 6px}
pre.tg{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:60vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;z-index:99;display:none;max-width:92vw}
#tools .btn{white-space:normal;text-align:left}
.pers{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;align-items:center;scrollbar-width:thin}
.pc{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
.pc.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:650}
.pc.rg{background:color-mix(in srgb,var(--acc) 18%,var(--card));border-color:var(--acc)}
.pc .dt{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--s3)}
.pc[disabled]{opacity:.45}
.cum{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2);white-space:nowrap;flex:0 0 auto;padding-left:4px}
tr[data-item],tr[data-pm]{cursor:pointer}tr[data-item]:hover td,tr[data-pm]:hover td{background:color-mix(in srgb,var(--acc) 6%,var(--card))}
td .go{color:var(--acc);font-size:12px;margin-left:4px}
.icards{display:none;flex-direction:column;gap:8px}
.icard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.icard .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:650}
.icard .n{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.icard .n b{color:var(--ink)}
.icard .x{font-size:12px;color:var(--mut);margin-top:3px}
.igrp{font-size:12px;color:var(--mut);font-weight:650;margin:6px 2px 0}
.mini{width:100%;height:auto;display:block;margin:4px 0 8px}
tr.oor td{opacity:.55}
@media (max-width:700px){.wide{display:none}.icards{display:flex}}
details>summary{cursor:pointer;font-weight:650}
@media (max-width:640px){
 .top{padding:6px 10px}.top h1{font-size:14.5px}.wrap{padding:10px 10px 40px}
 .kpi .v{font-size:19px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 th,td{padding:5px 6px;font-size:12.5px}th:first-child,td:first-child{min-width:112px;max-width:150px}
 td.ex{min-width:200px}
 .hidem{display:none}
}
</style>

<body>
<div class="top">
 <h1 id="ttl">📊</h1>
 <div class="seg" id="viewSeg"></div>
 <span class="grow"></span>
 <span class="status" id="cloudSt"></span>
 <div class="seg" id="langSeg"><button data-l="zh">繁中</button><button data-l="en">EN</button></div>
</div>
<div class="wrap">
 <div class="years" id="years"></div>
 <div class="pers" id="pers"></div>
 <div id="flags"></div>
 <div class="kpis" id="kpis"></div>
 <div class="card">
  <h2><span id="chT"></span><span class="grow"></span><span class="seg" id="perSeg"></span></h2>
  <div class="legend" id="legend"></div>
  <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
 </div>
 <div class="card">
  <h2><span id="tbT"></span><span class="grow"></span><label class="small mut"><span id="cmpL"></span> <select id="cmp"></select></label></h2>
  <div class="tw wide"><table id="tbl"></table></div><div class="icards" id="icards"></div>
  <p class="small mut" id="method"></p>
 </div>
 <div class="card">
  <details id="monD"><summary id="monT"></summary><div class="tw" style="margin-top:8px"><table id="mon"></table></div></details>
 </div>
 <div class="card">
  <h2 id="hisT"></h2>
  <div class="tw"><table id="his"></table></div>
 </div>
 <div class="card">
  <h2 id="toolT"></h2>
  <div class="bar" id="tools"></div>

 </div>
</div>

<dialog id="dlg"><div class="dh"><h3 id="dlgT"></h3><button class="btn sm" data-x>✕</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></dialog>
<input type="file" id="file" accept=".json,.csv,.xlsx,.xls" hidden>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const EMBED=Q.get('embed')||'';                       // 'hr' = 嵌在 PSJHR 裡
let VIEW=Q.get('view')==='labor'?'labor':'admin';
if(EMBED)document.documentElement.setAttribute('data-theme','light');   /* PSJHR 深色模式會把嵌入頁整頁反相，所以這裡固定淺色 */
const DOC_KEY='vrt_budget_doc_v1',LIVE_KEY='vrt_budget_live_v1',PREV_KEY='vrt_budget_doc_prev',META_KEY='vrt_budget_meta_v1';
const GATE_H='f065b43108b2d9766e5aff7f77a79f99575d34f6c2cb001b368686098ed75433';
const HUB=(()=>{try{const o=JSON.parse(localStorage.getItem('ac_admin_cloud_config')||'{}');if(o.url)return o.url}catch(e){}return (window.AC_CONFIG||{}).hubUrl||''})();
const jget=(k,f)=>{try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}};
const jput=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
/* 語言：Admin OS 用 ac_admin_lang；嵌在 PSJHR 時跟著 PSJHR 的 LANG（0 中／1 英／2 高棉→英） */
function parentLang(){try{if(window.parent!==window&&typeof window.parent.LANG==='number')return window.parent.LANG===0?'zh':'en'}catch(e){}return null}
let LANG=Q.get('lang')||parentLang()||(()=>{const l=jget('ac_admin_lang','zh');return l==='zh'?'zh':'en'})();
const T=(zh,en)=>LANG==='en'?en:zh;
const N=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString('en-US');
const K=v=>{if(v==null||isNaN(v))return '—';const a=Math.abs(v);return (v<0?'−':'')+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e4?(a/1e3).toFixed(1)+'k':N(a))};
const P1=v=>v==null||isNaN(v)?'—':(Math.round(v*10)/10).toFixed(1);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?(a-b)/b*100:null;
const sgn=p=>p==null?'—':(p>=0?'+':'−')+Math.abs(p).toFixed(1)+'%';
const now=()=>new Date().toISOString();
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}
function pill(act,bud){const p=pct(act,bud);if(p==null)return '<span class="pill p-n">—</span>';const c=Math.abs(p)<=5?'p-g':p>10?'p-r':p>5?'p-y':'p-b';const ic=Math.abs(p)<=5?'✓':p>0?'▲':'▼';return `<span class="pill ${c}">${ic} ${sgn(p)}</span>`}

/* ── 文件（可編輯部分）：本機＋雲端；每一項記時間，合併時新的贏 ── */
let DOC=jget(DOC_KEY,null)||{v:1,rev:0,years:{},cats:{},notes:{},actual:{},custom:[],at:{},del:{}};
['years','cats','notes','actual','at','del'].forEach(k=>DOC[k]=DOC[k]||{});DOC.custom=DOC.custom||[];
let LIVE=jget(LIVE_KEY,{});let META=jget(META_KEY,{rev:0,dirty:false,last:''});
let M=null;
function rebuild(){M=VRTBudget.make(VRTB_DATA,JSON.parse(JSON.stringify(DOC)),LIVE)}
function touch(path){DOC.at[path]=now();delete DOC.del[path]}
function saveDoc(why){try{const old=localStorage.getItem(DOC_KEY);if(old)localStorage.setItem(PREV_KEY,old)}catch(e){}
 jput(DOC_KEY,DOC);META.dirty=true;jput(META_KEY,META);rebuild();render();scheduleUp();if(why)toast(why)}
function mergeDocs(a,b){ /* a＝本機，b＝雲端；逐項比時間 */
 const out=JSON.parse(JSON.stringify(b));['years','cats','notes','actual'].forEach(k=>out[k]=out[k]||{});out.at=out.at||{};out.del=out.del||{};out.custom=out.custom||[];
 const ta=p=>a.at&&a.at[p]||'',tb=p=>b.at&&b.at[p]||'';
 ['years','cats','notes','actual'].forEach(sec=>{const ks=new Set([...Object.keys(a[sec]||{}),...Object.keys(b[sec]||{}),...Object.keys(a.del||{}).filter(p=>p.startsWith(sec+'.')).map(p=>p.slice(sec.length+1))]);
  ks.forEach(k=>{const p=sec+'.'+k;const da=(a.del||{})[p]||'',db=(b.del||{})[p]||'';   const la=[ta(p),da].sort().pop(),lb=[tb(p),db].sort().pop();
   if(la>lb){if(da&&da>=ta(p)){delete out[sec][k];out.del[p]=da;delete out.at[p]}else if(a[sec]&&a[sec][k]!==undefined){out[sec][k]=a[sec][k];out.at[p]=ta(p);delete out.del[p]}}});});
 const ids=new Set([...(a.custom||[]).map(x=>x.id),...(b.custom||[]).map(x=>x.id)]);const cu=[];
 ids.forEach(id=>{const p='custom.'+id,xa=(a.custom||[]).find(x=>x.id===id),xb=(b.custom||[]).find(x=>x.id===id);const la=[ta(p),(a.del||{})[p]||''].sort().pop(),lb=[tb(p),(b.del||{})[p]||''].sort().pop();
  let pick=la>lb?xa:xb;const dl=la>lb?(a.del||{})[p]:(b.del||{})[p];if(dl&&dl>=(la>lb?ta(p):tb(p))){out.del[p]=dl;pick=null}if(pick){cu.push(pick);out.at[p]=la>lb?ta(p):tb(p)}});
 out.custom=cu;return out}

/* ── 雲端（AC_ADMIN_CENTER）：budgetGet 公開唯讀（含 ERP／HRA-PAY 最新月份）；budgetPut 用 Admin OS 門鎖碼 ── */
let upT=null,BUSY=false;
let STK=null;const STM={sync:['☁️ 同步中…','☁️ Syncing…'],synced:['☁️ 已同步 ','☁️ Synced '],up:['☁️ 上傳中…','☁️ Uploading…'],upd:['☁️ 已上傳 ','☁️ Uploaded '],off:['⚠️ 雲端暫時連不上，先用本機資料','⚠️ Cloud unreachable — using local data'],noup:['⚠️ 未上傳（下次自動再試）','⚠️ Not uploaded (will retry)'],nourl:['沒有雲端網址','No cloud URL']};
function setSt(k,tm){if(k)STK=[k,tm||''];if(!STK)return;const m=STM[STK[0]];$('cloudSt').textContent=(LANG==='en'?m[1]:m[0])+STK[1]}
const hm=()=>new Date().toTimeString().slice(0,5);
async function jfetch(url,opt){const c=new AbortController(),t=setTimeout(()=>c.abort(),60000);try{const r=await fetch(url,{...(opt||{}),signal:c.signal,redirect:'follow'});const d=await r.json();if(!d||d.ok===false)throw new Error(d&&d.error||'cloud error');return d}finally{clearTimeout(t)}}
async function down(manual){if(!HUB){setSt('nourl');return}
 setSt('sync');
 try{const d=await jfetch(HUB+'?action=budgetGet&t='+Date.now());
  if(d.live){LIVE=d.live;jput(LIVE_KEY,LIVE)}
  if(d.doc&&typeof d.doc==='object'){const merged=META.dirty?mergeDocs(DOC,d.doc):d.doc;['years','cats','notes','actual','at','del'].forEach(k=>merged[k]=merged[k]||{});merged.custom=merged.custom||[];DOC=merged;jput(DOC_KEY,DOC)}
  META.rev=d.rev||0;META.last=now();jput(META_KEY,META);rebuild();render();
  if(META.dirty)await up(false);else setSt('synced',hm());
  if(manual)toast(T('已從雲端下載最新資料','Downloaded the latest from the cloud'));
 }catch(e){setSt('off');if(manual)toast(String(e.message||e))}}
function scheduleUp(){clearTimeout(upT);upT=setTimeout(()=>up(false),1800)}
async function up(manual){if(!HUB||BUSY)return;BUSY=true;setSt('up');
 try{const body={action:'budgetPut',key:GATE_H,baseRev:META.rev||0,doc:DOC,who:EMBED==='hr'?'PSJHR':'Admin OS'};
  let d=await jfetch(HUB,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  if(d.conflict&&d.doc){DOC=mergeDocs(DOC,d.doc);body.doc=DOC;body.baseRev=d.rev;d=await jfetch(HUB,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})}
  META.rev=d.rev||META.rev;META.dirty=false;META.last=now();jput(META_KEY,META);jput(DOC_KEY,DOC);
  setSt('upd',hm());if(manual)toast(T('已上傳到雲端','Uploaded to the cloud'));
 }catch(e){setSt('noup');if(manual)toast(String(e.message||e))}finally{BUSY=false}}

/* ── 畫面 ── */
let Y0=null,SEL=0,PER='ytd',CMP=null,PF=1,PT=12,CUM=false;
const PERIOD=()=>({from:PF,to:PT});

const COLS=['var(--s2)','var(--s3)','var(--s4)','var(--s1)'];

 const f=M.fc(ym)||{},l=M.lab(ym)||[],a=DOC.actual[ym]||{};
 const fld=(k,lab,v)=>`<label>${E(lab)}${a[k]!=null?' ✏️':''}<input data-k="${k}" type="number" value="${a[k]!=null?E(a[k]):''}" placeholder="${v==null?'':Math.round(v)}"></label>`;
 const labF=[['dlN',T('DL 人數','DL heads'),l[0]],['dlG',T('DL 工資','DL wages'),l[1]],['idlN',T('IDL 人數','IDL heads'),l[2]],['idlG',T('IDL 工資','IDL wages'),l[3]],['offN',T('OFF 人數','OFF heads'),l[4]],['offG',T('OFF 工資','OFF wages'),l[5]]];
 const cus=DOC.custom.filter(x=>+x.y===+ym.slice(0,4));
 dlg(T('實際數 ','Actuals ')+ym,`<label class="small">${T('月份','Month')} <input id="aYm" type="month" value="${ym}"></label>
  <p class="small mut">${T('空白＝用系統資料（灰色是目前的數字：ERP 製造費用／HRA-PAY 實發）。填了就以手動為準，月報也照這個算。','Blank = use system data (grey = current ERP / HRA-PAY figure). A value you enter overrides it, including in the monthly report.')}</p>
  <h4>${T('人工','Labour')}</h4><div class="fg">${labF.map(x=>fld(...x)).join('')}</div>
  ${VIEW==='admin'?`<h4>${T('費用（ERP W_CCS450）','Expenses (ERP W_CCS450)')}</h4><div class="fg">${M.cats.map(c=>fld(c,M.catName(c,LANG),f[c])).join('')}</div>`:''}
  ${cus.length?`<h4>${T('自訂項目實際','Custom item actuals')}</h4><div class="fg">${cus.map(x=>`<label>${E(LANG==='en'?x.en||x.zh:x.zh||x.en)}<input data-cu="${E(x.id)}" type="number" value="${x.act&&x.act[ym]!=null?x.act[ym]:''}"></label>`).join('')}</div>`:''}`,
  `<button class="btn danger" id="aClr">${T('清掉這個月的手動數','Clear manual values for this month')}</button><button class="btn pri" id="aOk">${T('儲存','Save')}</button>`);
 $('aYm').onchange=e=>{closeDlg();actualDlg(e.target.value)};
 $('aOk').onclick=()=>{const n={};document.querySelectorAll('#dlgB [data-k]').forEach(i=>{if(i.value!=='')n[i.dataset.k]=Number(i.value)});
  if(Object.keys(n).length){DOC.actual[ym]=n;touch('actual.'+ym)}else if(DOC.actual[ym]){delete DOC.actual[ym];DOC.del['actual.'+ym]=now()}
  document.querySelectorAll('#dlgB [data-cu]').forEach(i=>{const x=DOC.custom.find(z=>z.id===i.dataset.cu);if(!x)return;x.act=x.act||{};const ov=x.act[ym];if(i.value==='')delete x.act[ym];else x.act[ym]=Number(i.value);if(ov!==x.act[ym])touch('custom.'+x.id)});
  closeDlg();saveDoc(T('實際數已儲存','Actuals saved'))};
 $('aClr').onclick=()=>{delete DOC.actual[ym];DOC.del['actual.'+ym]=now();closeDlg();saveDoc(T('已清除','Cleared'))}}
function tgDlg(ym){const y=curYear();ym=ym||M.year(y,VIEW).actMonths.slice(-1)[0];if(!ym){toast(T('這一年還沒有實際數','No actuals for this year yet'));return}
 const html=M.monthReport(ym,VIEW)||'';const txt=html.replace(/<pre>/g,'\n').replace(/<\/pre>/g,'').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
 dlg(T('月報預覽 ','Report preview ')+ym,`<p class="small mut">${T('行政中心每月結算後會自動發這一則（','The Admin Center sends this automatically after each month’s close (')}${VIEW==='labor'?T('私訊 Paul','DM to Paul'):T('AI AC System 群組','AI AC System group')}${T('），這裡只預覽，不會發送。','); this is a preview only — nothing is sent.')}</p><pre class="tg">${E(txt)}</pre>`,`<button class="btn" id="tgCp">📋 ${T('複製','Copy')}</button>`);
 $('tgCp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(txt).then(()=>toast(T('已複製','Copied')))}}
function paulDlg(){const it=VRTB_DATA.paul2021.items;const tot=it.reduce((s,x)=>s+x[3].reduce((a,b)=>a+b,0),0);
 dlg(T('2021 原始試作預算（Paul，18 組）','Original 2021 trial budget (Paul, 18 lines)'),`<div class="tw"><table><thead><tr><th>${T('項目','Item')}</th><th>${T('全年預算','Full year')}</th><th>${T('每月平均','Per month')}</th><th>${T('1 月實際','Jan actual')}</th></tr></thead><tbody>`+
  it.map(x=>{const s=x[3].reduce((a,b)=>a+b,0);return `<tr><td>${E(LANG==='en'?x[1]:x[0])}</td><td>${N(s)}</td><td>${N(s/12)}</td><td>${x[4]?N(x[4]):'—'}</td></tr>`}).join('')+`<tr class="tot"><td>${T('合計','Total')}</td><td>${N(tot)}</td><td>${N(tot/12)}</td><td>${N(it.reduce((s,x)=>s+(x[4]||0),0))}</td></tr></tbody></table></div><p class="small mut">${E(VRTB_DATA.paul2021.note)}</p>`)}
/* ── 匯入匯出 ── */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCsv(){const Y=M.year(curYear(),VIEW,PERIOD());const has=Y.actMonths.length;const head=[T('項目','Item'),...Y.scen.map(s=>s+(has?T(' 組同期預算',' lines budget (same months)'):T(' 組全年預算',' lines full-year'))),...(has?[T('彈性預算','Flex budget'),T('實際','Actual'),T('說明','Explanation')]:[])];
 const L=[head];Y.rows.forEach(r=>L.push([rowName(r),...r.bud.map(b=>Math.round(has?b.ytd:b.full)),...(has?[Math.round(r.flex),Math.round(r.act),M.explain(Y,r,Y.closest>=0?Y.closest:1,LANG)+(M.note(Y.y,r.key)?' / '+M.note(Y.y,r.key):'')]:[])]));
 L.push([T('合計','Total'),...Y.total.bud.map(b=>Math.round(has?b.ytd:b.full)),...(has?[Math.round(Y.total.flex),Math.round(Y.total.act),'']:[])]);
 L.push([]);L.push([T('月份','Month'),T('組數','Lines'),...Y.scen.map(s=>s+T(' 組',' lines')),T('彈性','Flex'),T('實際','Actual')]);Y.months.forEach(m=>L.push([m.ym,m.has?P1(m.lines):'',...m.bud.map(Math.round),m.has?Math.round(m.flex):'',m.has?Math.round(m.act):'']));
 download(`VRT_${VIEW==='labor'?'labour':'admin'}_budget_${Y.y}.csv`,'﻿'+L.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n'),'text/csv')}
function importFile(f){const rd=new FileReader();const name=f.name.toLowerCase();
 rd.onload=()=>{try{
  if(name.endsWith('.json')){const d=JSON.parse(rd.result);const doc=d.doc||d;if(!doc||typeof doc!=='object'||!('years' in doc||'notes' in doc||'actual' in doc))throw new Error(T('不是預算檔','Not a budget file'));
   DOC=mergeDocs(doc,DOC);saveDoc(T('已匯入並合併（新的為準）','Imported and merged (newer wins)'));return}
  let rows;if(/\.xlsx?$/.test(name)){if(!window.XLSX)throw new Error('XLSX');const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1})}
  else rows=String(rd.result).replace(/^﻿/,'').split(/\r?\n/).map(l=>l.split(','));
  /* 實際數：每列 月份(YYYY-MM), 項目代號或名稱, 金額 */
  const names={};M.cats.forEach(c=>{names[c]=c;names[M.catName(c,'zh')]=c;names[M.catName(c,'en').toLowerCase()]=c});['dlN','dlG','idlN','idlG','offN','offG'].forEach(k=>names[k.toLowerCase()]=k);
  let n=0;rows.forEach(r=>{if(!r||r.length<3)return;const ym=String(r[0]).trim().slice(0,7).replace('/','-');const k=names[String(r[1]).trim()]||names[String(r[1]).trim().toLowerCase()];const v=Number(String(r[2]).replace(/[$,\s]/g,''));
   if(!/^\d{4}-\d{2}$/.test(ym)||!k||isNaN(v))return;DOC.actual[ym]=DOC.actual[ym]||{};DOC.actual[ym][k]=v;touch('actual.'+ym);n++});
  if(!n)throw new Error(T('沒讀到資料：每列要「月份, 項目, 金額」（例：2026-11, meal, 8500）','Nothing read — each row needs “month, item, amount” (e.g. 2026-11, meal, 8500)'));
  saveDoc(T('已匯入 ','Imported ')+n+T(' 筆實際數',' actual values'))}catch(e){toast(T('匯入失敗：','Import failed: ')+(e.message||e))}};
 if(/\.xlsx?$/.test(name)){if(!window.XLSX){const s=document.createElement('script');s.src='../../shared/xlsx.full.min.js';s.onload=()=>rd.readAsArrayBuffer(f);document.head.appendChild(s)}else rd.readAsArrayBuffer(f)}else rd.readAsText(f)}
/* ── 事件 ── */
document.addEventListener('click',e=>{const t=e.target.closest('[data-y],[data-v],[data-l],[data-note],[data-act],[data-actm],[data-tg],[data-pc],[data-item],[data-pm]');if(!t)return;
 if(t.dataset.pc){const v=t.dataset.pc;if(v==='all'){PF=1;PT=12}else selMonth(+v,true);render();return}
 if(t.dataset.note){noteDlg(t.dataset.note);return}
 if(t.dataset.actm){actualDlg(t.dataset.actm);return}
 if(t.dataset.tg){tgDlg(t.dataset.tg);return}
 if(t.dataset.item){itemDlg(t.dataset.item);return}
 if(t.dataset.pm){selMonth(+t.dataset.pm);document.getElementById('tbT').scrollIntoView({behavior:'smooth',block:'start'});return}
 if(t.dataset.y){e.preventDefault();Y0=+t.dataset.y;CMP=null;PF=1;PT=12;render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(t.dataset.v){VIEW=t.dataset.v;CMP=null;render();return}
 if(t.dataset.l){LANG=t.dataset.l;if(!EMBED)jput('ac_admin_lang',LANG);render();return}
 if(t.dataset.note){noteDlg(t.dataset.note);return}
 if(t.dataset.actm){actualDlg(t.dataset.actm);return}
 if(t.dataset.tg){tgDlg(t.dataset.tg);return}
 const a=t.dataset.act;
 if(a==='settings')settingsDlg();else if(a==='custom')customDlg();else if(a==='actual')actualDlg();else if(a==='down')down(true);else if(a==='up')up(true);
 else if(a==='import')$('file').click();else if(a==='exjson')download('VRT_budget_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({kind:'vrt-budget',exportedAt:now(),doc:DOC},null,1),'application/json');
 else if(a==='excsv')exportCsv();else if(a==='tg')tgDlg();else if(a==='paul')paulDlg();
 else if(a==='undo'){const p=jget(PREV_KEY,null);if(!p){toast(T('沒有可復原的修改','Nothing to undo'));return}localStorage.removeItem(PREV_KEY);DOC=p;const ts=now();Object.keys(DOC.at||{}).forEach(k=>DOC.at[k]=ts);jput(DOC_KEY,DOC);META.dirty=true;jput(META_KEY,META);rebuild();render();scheduleUp();toast(T('已復原上一次修改','Last change undone'))}});
$('cmp').onchange=e=>{CMP=e.target.value==='flex'?'flex':+e.target.value;render()};
$('file').onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''};
/* 嵌在 PSJHR：跟著外框換語言 */
if(EMBED){setInterval(()=>{const l=parentLang();if(l&&l!==LANG){LANG=l;render()}},1200)}
window.addEventListener('storage',e=>{if(e.key===DOC_KEY&&e.newValue){try{DOC=JSON.parse(e.newValue);rebuild();render()}catch(x){}}});
let rzT=null;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>drawChart(M.year(curYear(),VIEW,PERIOD())),200)});
rebuild();render();down(false);
window.VRTB_PAGE={get M(){return M},get DOC(){return DOC},render,down,up};
})();
</script>
