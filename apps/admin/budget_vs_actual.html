<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AC Admin｜預算 vs 實際支出</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--bg:#eef1f5;--p:#fff;--ink:#172033;--mut:#718096;--line:#dfe5ec;--navy:#102b45;--green:#25725a;--red:#c43f3f;--amber:#c98a22;--r:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}header{background:var(--navy);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}header b{font-size:14px}header a{margin-left:auto;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:6px 10px;border-radius:8px;font-size:11px}.wrap{max-width:1300px;margin:auto;padding:14px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.btn,input,select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}.btn{cursor:pointer;font-weight:700}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.danger{color:var(--red)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px}.k{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}.k span{font-size:10px;color:var(--mut)}.k b{display:block;font-size:22px;margin-top:4px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.table-wrap{overflow:auto;max-height:62vh}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#f6f8fa;z-index:2}td input,td select{width:100%;min-width:100px;padding:5px 6px}.money{text-align:right}.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}.warn{color:var(--amber);font-weight:700}.hint{font-size:10px;color:var(--mut);padding:9px 11px;border-top:1px solid var(--line)}@media(max-width:680px){.kpis{grid-template-columns:1fr 1fr}.wrap{padding:8px}.table-wrap{max-height:68vh}}
</style></head><body><header><b>🎯 預算 vs 實際支出</b><span style="font-size:10px;opacity:.7">Budget vs Actual</span><a href="../../index.html?view=admin">← AC Admin</a></header><main class="wrap"><div class="toolbar"><select id="year"></select><select id="month"><option value="ALL">全年</option></select><button class="btn primary" onclick="addRow()">＋ 新增項目</button><button class="btn" onclick="exportXlsx()">📤 匯出 Excel</button><label class="btn">📥 匯入 Excel<input id="imp" type="file" accept=".xlsx,.xls" hidden onchange="importXlsx(this.files[0])"></label><button class="btn danger" onclick="resetData()">清除</button></div><div class="kpis"><div class="k"><span>Budget 預算</span><b id="kb">$0</b></div><div class="k"><span>Actual 實際</span><b id="ka">$0</b></div><div class="k"><span>Variance 差異</span><b id="kv">$0</b></div><div class="k"><span>Usage 使用率</span><b id="kp">0%</b></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Year</th><th>Month</th><th>Category 類別</th><th>Department</th><th>Budget</th><th>Actual</th><th>Variance</th><th>%</th><th>Note</th><th></th></tr></thead><tbody id="tb"></tbody></table></div><div class="hint">資料儲存在本機瀏覽器；可用 Excel 匯入／匯出備份。正差異 = 尚有預算，負差異 = 超支。</div></div></main><script>
const KEY='ac_admin_budget_v1';let rows=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}function save(){localStorage.setItem(KEY,JSON.stringify(rows));render()}function money(n){return '$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}function initFilters(){const y=document.getElementById('year'),m=document.getElementById('month');const now=new Date().getFullYear();for(let i=now-3;i<=now+2;i++){y.add(new Option(i,i));}y.value=now;for(let i=1;i<=12;i++)m.add(new Option(String(i).padStart(2,'0'),String(i).padStart(2,'0')));y.onchange=render;m.onchange=render}function addRow(){const y=+year.value||new Date().getFullYear();rows.push({id:Date.now(),year:y,month:String(new Date().getMonth()+1).padStart(2,'0'),category:'Salary',department:'Admin Center',budget:0,actual:0,note:''});save()}function upd(id,k,v){const r=rows.find(x=>x.id===id);if(!r)return;r[k]=['budget','actual','year'].includes(k)?Number(v||0):v;localStorage.setItem(KEY,JSON.stringify(rows));renderKpi()}function del(id){rows=rows.filter(x=>x.id!==id);save()}function filtered(){return rows.filter(r=>String(r.year)===String(year.value)&&(month.value==='ALL'||String(r.month)===month.value))}function render(){tb.innerHTML=filtered().map(r=>{const v=Number(r.budget)-Number(r.actual),p=r.budget?Number(r.actual)/Number(r.budget)*100:0,cls=p>100?'bad':p>=90?'warn':'ok';return `<tr><td><input type="number" value="${r.year}" onchange="upd(${r.id},'year',this.value)"></td><td><select onchange="upd(${r.id},'month',this.value)">${Array.from({length:12},(_,i)=>{const x=String(i+1).padStart(2,'0');return `<option ${x==r.month?'selected':''}>${x}</option>`}).join('')}</select></td><td><input value="${esc(r.category)}" onchange="upd(${r.id},'category',this.value)"></td><td><input value="${esc(r.department)}" onchange="upd(${r.id},'department',this.value)"></td><td><input class="money" type="number" value="${r.budget}" onchange="upd(${r.id},'budget',this.value)"></td><td><input class="money" type="number" value="${r.actual}" onchange="upd(${r.id},'actual',this.value)"></td><td class="money ${v<0?'bad':'ok'}">${money(v)}</td><td class="${cls}">${p.toFixed(1)}%</td><td><input value="${esc(r.note)}" onchange="upd(${r.id},'note',this.value)"></td><td><button class="btn danger" onclick="del(${r.id})">×</button></td></tr>`}).join('');renderKpi()}function renderKpi(){const a=filtered(),b=a.reduce((s,r)=>s+Number(r.budget||0),0),x=a.reduce((s,r)=>s+Number(r.actual||0),0),v=b-x,p=b?x/b*100:0;kb.textContent=money(b);ka.textContent=money(x);kv.textContent=money(v);kv.className=v<0?'bad':'ok';kp.textContent=p.toFixed(1)+'%';kp.className=p>100?'bad':p>=90?'warn':'ok'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportXlsx(){const data=rows.map(r=>({...r,variance:Number(r.budget)-Number(r.actual),usage_pct:r.budget?Number(r.actual)/Number(r.budget):0}));const ws=XLSX.utils.json_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Budget');XLSX.writeFile(wb,'AC_Admin_Budget_vs_Actual.xlsx')}async function importXlsx(f){if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],a=XLSX.utils.sheet_to_json(ws,{defval:''});rows=a.map((r,i)=>({id:Date.now()+i,year:Number(r.year||r.Year||new Date().getFullYear()),month:String(r.month||r.Month||'01').padStart(2,'0'),category:r.category||r.Category||'',department:r.department||r.Department||'',budget:Number(r.budget||r.Budget||0),actual:Number(r.actual||r.Actual||0),note:r.note||r.Note||''}));save();imp.value=''}function resetData(){if(confirm('確定清除本機 Budget 資料？')){rows=[];save()}}initFilters();if(!rows.length){rows=[{id:1,year:new Date().getFullYear(),month:String(new Date().getMonth()+1).padStart(2,'0'),category:'Salary',department:'HRA',budget:0,actual:0,note:''},{id:2,year:new Date().getFullYear(),month:String(new Date().getMonth()+1).padStart(2,'0'),category:'Repair',department:'GA',budget:0,actual:0,note:''}];localStorage.setItem(KEY,JSON.stringify(rows))}render();</script></body></html>
