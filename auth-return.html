<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>AC Admin · 連線完成</title><link rel="stylesheet" href="shared/admin-ui.css"></head><body><main class="ac-wrap"><h2 id="status">正在返回行政中心…</h2><p id="detail"></p><a class="button primary" href="index.html" id="home">返回行政中心</a></main><script>
(function(){'use strict';const p=new URLSearchParams(location.hash.slice(1));history.replaceState(null,'',location.pathname);try{const request=JSON.parse(localStorage.getItem('ac_admin_auth_request')||'null');if(!request||p.get('nonce')!==request.nonce||Date.now()-request.createdAt>180000||!/^[a-f0-9]{64}$/i.test(p.get('grant')||''))throw new Error('這次連線已過期，請回原頁再按一次雲端按鈕。');localStorage.setItem('ac_admin_auth_result',JSON.stringify({nonce:request.nonce,grant:p.get('grant'),url:request.url}));document.getElementById('status').textContent='連線完成';document.getElementById('detail').textContent='請回原本的行政中心分頁，操作會繼續。此頁可關閉。';setTimeout(()=>window.close(),1500)}catch(e){document.getElementById('status').textContent='尚未完成連線';document.getElementById('detail').textContent=e.message}})();
</script></body></html>
