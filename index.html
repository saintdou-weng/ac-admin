<!DOCTYPE html><html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VRT HR · PSJHR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Khmer:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* PSJHR — shares the VRT ERP (PSJERP) design system; accent = teal so HR and ERP are told apart at a glance.
   Layout: fixed left rail (module groups) + sticky top bar + single scrolling work column; right-side detail drawer. Phone: rail becomes a slide-in sheet. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --sunk:#E4E8ED;
  --ink:#15202B; --ink-2:#465566; --muted:#768494; --line:#D6DCE3; --line-2:#E6EAEF;
  --accent:#0F6E63; --accent-2:#0B5249; --accent-soft:#DCEFEB; --on-accent:#FFFFFF;
  --good:#1D7A4C; --good-soft:#DFF1E7; --warn:#A86A0C; --warn-soft:#FBEFD9; --crit:#B8352A; --crit-soft:#F8E1DE;
  --s-erp:#5A6B7E; --s-prod:#0E7C78; --s-acc:#A8660E; --s-import:#6A4CB5; --s-gs:#2E7D32; --s-cloud:#1F4FA8;
  --bar:#0F6E63; --grid:#E3E8EE;
  --f-ui:"IBM Plex Sans","Noto Sans TC","Noto Sans Khmer",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"IBM Plex Sans Condensed","Noto Sans TC","Noto Sans Khmer","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --rail:236px; --shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151E27; --surface-2:#1A2530; --sunk:#111920;
  --ink:#E5EBF1; --ink-2:#A8B5C2; --muted:#7B8A99; --line:#2A3746; --line-2:#22303D;
  --accent:#5FC7B6; --accent-2:#8EDCCF; --accent-soft:#17322E; --on-accent:#0E141A;
  --good:#5CC48F; --good-soft:#15301F; --warn:#E3A84A; --warn-soft:#352812; --crit:#F0857A; --crit-soft:#3A1C19;
  --s-erp:#93A3B5; --s-prod:#4CC2BC; --s-acc:#E3A84A; --s-import:#A891E8; --s-gs:#73C076; --s-cloud:#7FA3F2;
  --bar:#5FC7B6; --grid:#24313E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151E27; --surface-2:#1A2530; --sunk:#111920;
  --ink:#E5EBF1; --ink-2:#A8B5C2; --muted:#7B8A99; --line:#2A3746; --line-2:#22303D;
  --accent:#5FC7B6; --accent-2:#8EDCCF; --accent-soft:#17322E; --on-accent:#0E141A;
  --good:#5CC48F; --good-soft:#15301F; --warn:#E3A84A; --warn-soft:#352812; --crit:#F0857A; --crit-soft:#3A1C19;
  --s-erp:#93A3B5; --s-prod:#4CC2BC; --s-acc:#E3A84A; --s-import:#A891E8; --s-gs:#73C076; --s-cloud:#7FA3F2;
  --bar:#5FC7B6; --grid:#24313E; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:14px 24px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px 14px;border-bottom:1px solid var(--line-2);margin-bottom:8px}
.brand-mark{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.02em}
.brand b{font-family:var(--f-disp);font-size:17px;letter-spacing:.01em;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted)}
.nav-g{padding:10px 16px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 16px;margin:0 8px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav a .ic{width:20px;text-align:center;font-size:15px}
.nav a .ct{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;padding:14px 16px 0;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-2)}
.ro-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:99px;background:var(--crit-soft);color:var(--crit);font-weight:600;font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 24px}
.menu-btn{display:none}
.search{position:relative;flex:1;max-width:520px;min-width:0}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40}
.sres button{display:flex;width:100%;gap:10px;align-items:baseline;padding:8px 12px;border:0;background:none;text-align:left;cursor:pointer;border-bottom:1px solid var(--line-2)}
.sres button:hover{background:var(--surface-2)}
.sres .k{font-size:11px;color:var(--muted);min-width:64px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.lang button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:17px;height:17px;stroke:var(--ink-2);fill:none;stroke-width:1.8}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:600;color:var(--ink);font-size:12px}

.page{padding:22px 24px 48px;max-width:1440px;width:100%}
.ph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-family:var(--f-disp);font-size:26px;line-height:1.15;margin:0;font-weight:600;text-wrap:balance}
.ph .sub{color:var(--ink-2);font-size:13px;margin-top:3px;max-width:72ch}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.url-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);padding:2px 8px;border-radius:5px;margin-top:6px}
.solo .rail{display:none}.solo .app{grid-template-columns:minmax(0,1fr)}
.prod-links{margin-top:10px;display:flex;flex-direction:column;gap:5px}.prod-links a{display:block;border:1px solid var(--line-2,#d9dee8);border-radius:8px;padding:6px 8px;font-size:12px;text-decoration:none;color:inherit;background:rgba(255,255,255,.6)}.prod-links a:hover{border-color:var(--accent,#2563eb)}
.solo-bar{display:none;align-items:center;gap:8px;font-size:12.5px}
.solo .solo-bar{display:flex}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2)}
.btn.dng{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:500}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 12px}
.toolbar .grow{flex:1;min-width:180px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-width:0}
.inp:disabled{background:var(--surface-2);color:var(--muted)}
.custom-range{display:flex;gap:6px;align-items:center}
.custom-range input{width:140px}

/* ---------- cards / kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--f-disp);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.01em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .d{font-size:11.5px;color:var(--muted)}
.kpi.warn{box-shadow:inset 3px 0 0 var(--warn)}.kpi.crit{box-shadow:inset 3px 0 0 var(--crit)}.kpi.good{box-shadow:inset 3px 0 0 var(--good)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-family:var(--f-disp);font-size:17px;font-weight:600;margin:0 0 4px}
.panel h3{font-size:13px;margin:0 0 8px;color:var(--ink-2);font-weight:600}
.panel .hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.mt{margin-top:14px}

/* ---------- badges ---------- */
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);padding:1px 7px 1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);white-space:nowrap}
.src i{width:7px;height:7px;border-radius:2px;display:inline-block}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.good{background:var(--good-soft);color:var(--good)}.st.warn{background:var(--warn-soft);color:var(--warn)}
.st.crit{background:var(--crit-soft);color:var(--crit)}.st.info{background:var(--accent-soft);color:var(--accent-2)}
.st.neu{background:var(--surface-2);color:var(--ink-2)}
.diff-pos{color:var(--good)}.diff-neg{color:var(--crit)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:11.5px;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap}
.t td.wrap{white-space:normal;min-width:180px}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--surface-2)}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t tr.del td{opacity:.5;text-decoration:line-through}
.t tfoot td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 2px;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.38);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:51;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--f-disp);font-size:20px;margin:0;font-weight:600}
.dh .x{margin-left:auto}
.db{overflow-y:auto;padding:16px 18px;flex:1}
.df{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-bottom:18px}
.sec h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.kv div{min-width:0}.kv dt{font-size:11.5px;color:var(--muted)}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.note{font-size:12.5px;border-radius:7px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.note.info{background:var(--accent-soft);border-color:transparent;color:var(--accent-2)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:86vh;overflow:auto;background:var(--surface);border-radius:10px;z-index:52;box-shadow:var(--shadow);padding:20px}
.modal h2{font-family:var(--f-disp);margin:0 0 8px;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;z-index:60;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- login ---------- */
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:16px}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:var(--shadow)}
.login-card h1{font-family:var(--f-disp);font-size:28px;margin:12px 0 2px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}

/* ---------- charts / meters ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .b{fill:var(--bar)}
.chart .b:hover,.chart .b.hl{fill:var(--accent-2)}
.chart .lbl{fill:var(--ink);font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:6px;z-index:80;white-space:nowrap}
.meter{display:grid;grid-template-columns:110px minmax(0,1fr) 72px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.meter .trk{height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter .fill{height:100%;background:var(--bar);border-radius:0 3px 3px 0}
.meter .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tri>div{background:var(--surface);padding:12px 14px;min-width:0}
.tri .v{font-family:var(--f-disp);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.formula{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:8px 10px;color:var(--ink-2);overflow-wrap:anywhere}
.wf{display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.wf .trk{height:14px;position:relative}
.wf .seg{position:absolute;top:0;height:100%;border-radius:2px;background:var(--bar)}
.wf.tot .seg{background:var(--ink)}
.wf.mg .seg{background:var(--good)}

/* ---------- import ---------- */
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px 16px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-disp);font-size:18px;display:block}
.steps{display:flex;gap:4px;flex-wrap:wrap;font-size:11.5px;margin:12px 0}
.steps span{padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line-2)}
.steps span.on{background:var(--accent-soft);color:var(--accent-2);border-color:transparent;font-weight:600}
.steps span.done{color:var(--good)}
.conf{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:13px;padding:3px 0}

/* ---------- telegram preview ---------- */
.tg{background:#17212B;border-radius:12px;padding:14px;color:#E9EEF3;max-width:420px;font-size:13.5px}
.tg .bub{background:#2B5278;border-radius:10px 10px 10px 3px;padding:10px 12px;margin-bottom:6px;line-height:1.45}
.tg .bub b{color:#fff}
.tg .kb{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tg .kb a{background:#24384D;color:#E9EEF3;text-decoration:none;text-align:center;padding:8px 6px;border-radius:6px;font-size:12.5px}
.tg .kb a:hover{background:#2F4A65}
.tg .meta{font-size:11px;color:#8A9BAD;margin-bottom:8px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:55;width:min(280px,86vw);transform:translateX(-102%);transition:transform .2s;height:auto;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:var(--shadow)}
  .menu-btn{display:grid}
  .top{padding:8px 16px;flex-wrap:wrap}
  .search{order:5;flex-basis:100%;max-width:none}
  .user-chip .nm{display:none}
  .page{padding:16px 16px 40px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .ph h1{font-size:22px}
  .form,.kv{grid-template-columns:minmax(0,1fr)}
  .tri{grid-template-columns:minmax(0,1fr)}
  .meter{grid-template-columns:90px minmax(0,1fr) 64px}
  /* card-style tables on phone */
  .t.cards thead{display:none}

/*PARSERS-START*/
const cellS=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
const numV=v=>{if(typeof v==='number')return v;const s=String(v==null?'':v).replace(/,/g,'').trim();if(s===''||isNaN(+s))return 0;return +s};
const serialToDate=n=>{const d=new Date(1899,11,30);d.setDate(d.getDate()+Math.floor(n));return d};
/* any cell → 'YYYY-MM-DD' ('' if not a date). Handles Excel serials, Date objects, yyyy-mm-dd, yyyy/mm/dd, d/m/yyyy (BEST list date). */
function anyDate(v){
 if(v==null||v==='')return '';
 if(v instanceof Date)return isNaN(v)?'':ymd(v);
 if(typeof v==='number'){if(v<20000||v>80000)return '';return ymd(serialToDate(v))}
 const s=cellS(v); let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/); if(m)return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
 m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/); if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);
 return '';
}
/* any cell → 'HH:MM' time part ('' if none) */
function anyTime(v){
 if(v==null||v==='')return '';
 if(v instanceof Date)return isNaN(v)?'':pad(v.getHours())+':'+pad(v.getMinutes());
 if(typeof v==='number'){const f=v-Math.floor(v);const mins=Math.round(f*1440);return pad(Math.floor(mins/60)%24)+':'+pad(mins%60)}
 const m=cellS(v).match(/(\d{1,2}):(\d{2})/); return m?pad(m[1])+':'+m[2]:'';
}
const anyDT=v=>{const d=anyDate(v);if(!d)return '';const tm=anyTime(v);return tm?d+' '+tm:d};
function headerMap(row){const m={};row.forEach((c,i)=>{const s=cellS(c);if(s&&m[s]==null)m[s]=i});return m}
function findRow(aoa,pred,from=0,to=aoa.length){for(let i=from;i<Math.min(to,aoa.length);i++)if(pred(aoa[i].map(cellS)))return i;return -1}
function labelVal(row,label){const i=row.findIndex(c=>cellS(c).replace(/[:：]$/,'')===label.replace(/[:：]$/,''));if(i<0)return null;for(let j=i+1;j<row.length;j++){const v=row[j];if(cellS(v)!=='')return v}return ''}
/* find a label cell ('列表日期', '總人數:'…) and return the value after it (same cell or next non-empty cell). The label must be the cell's own label: followed by ':'/'：' or the cell end, so '離職' never matches the header '離職日'. */
function labelAnywhere(aoa,label,maxRows){for(let i=0;i<Math.min(maxRows||aoa.length,aoa.length);i++){const r=aoa[i];for(let j=0;j<r.length;j++){const s=cellS(r[j]);if(!s)continue;const k=s.indexOf(label);if(k<0)continue;const after=s.slice(k+label.length);if(after&&!/^[:：\s]/.test(after))continue;const rest=after.replace(/^[:：\s]+/,'');if(rest)return rest;for(let x=j+1;x<r.length;x++){if(cellS(r[x])!=='')return r[x]}return ''}}return null}
const saneDate=d=>{if(!d)return false;const y=+d.slice(0,4);return y>=1980&&y<=TODAY.getFullYear()+1};
const listDate=aoa=>{const v=labelAnywhere(aoa,'列表日期',8);return v==null?'':anyDate(v)};
const ymDigits=s=>{const m=String(s).match(/(20\d{2})[-_]?(0[1-9]|1[0-2])(?!\d)/);return m?m[1]+'-'+m[2]:''};
const isCode=s=>/^[0-9A-Za-z][0-9A-Za-z-]*$/.test(s);
const clockHrs=(a,b)=>{if(!a||!b)return 0;const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let m=(h2*60+m2)-(h1*60+m1);if(m<0)m+=1440;return Math.round(m/6)/10};

 if(ds==='leave')return r=>inRange(r.start_date,a,b);
 if(ds==='attexc')return r=>inRange(r.date,a,b);
 if(ds==='joinleave')return r=>inRange(r.join_date,a,b)||inRange(r.leave_date,a,b);
 if(ds==='annual'||ds==='holiday')return r=>String(r.year)===String(meta.year);
 return ()=>false;
}
async function storeBatch(rep,key,meta,recs){
 const ds=REP_DS[rep]; let removed=0;
 if(BIG[ds]){removed=await trimAttOverlap(meta);const old=(DB.hrfiles||[]).find(f=>f.key===key);if(old)removed+=old.rows||0;
  await IDB.set('bat|'+key,packAtt(recs));attCacheSet(key,recs);DB.attsum[key]=attSummary(recs)}
 else if(SNAP[ds]){const cur=DB.asof[ds];const asof=meta.asof;DB.snaps[ds]=DB.snaps[ds]||{};
  if(!cur||asof>=cur){if(cur&&cur!==asof&&DB[ds].length)DB.snaps[ds][cur]=DB[ds];if(cur===asof)removed=DB[ds].length;DB[ds]=recs;DB.asof[ds]=asof;
   const ks=Object.keys(DB.snaps[ds]).sort();while(ks.length>3){const k=ks.shift();delete DB.snaps[ds][k];DB.hrfiles=(DB.hrfiles||[]).filter(f=>!(f.rep===rep&&f.asof===k))}}
  else{removed=(DB.snaps[ds][asof]||[]).length;DB.snaps[ds][asof]=recs}}
 else{const before=DB[ds].length;const ov=overlapFilter(ds,meta);const touched=new Set();
  DB[ds]=DB[ds].filter(r=>{if(r.import_key===key)return false;if(ov(r)){touched.add(r.import_key);return false}return true});removed=before-DB[ds].length;for(const r of recs)DB[ds].push(r);
  touched.forEach(k=>{const f=(DB.hrfiles||[]).find(x=>x.key===k);if(!f)return;const n=DB[ds].filter(r=>r.import_key===k).length;if(!n){DB.hrfiles=DB.hrfiles.filter(x=>x.key!==k);(DB.dropq=DB.dropq||[]).push(k)}else{f.rows=n;f.dirty=true}})}
 DB.hrfiles=(DB.hrfiles||[]).filter(f=>f.key!==key); DB.hrfiles.unshift(meta); GC.clear();
 return {added:recs.length,removed};
}
async function applyHR(P,fileName){
 const R=REPORTS.find(r=>r.k===P.rep); const recs=P.rows.map(r=>Object.assign({id:nid(P.rep[0])},r,hrMeta(fileName,P,r._row)));
 recs.forEach(r=>delete r._row);
 const meta={key:P.meta.key,rep:P.rep,fn:R.fn,file:fileName,rows:recs.length,label:P.meta.label,range:P.meta.range,asof:P.meta.asof||'',year:P.meta.year||null,totals:P.meta.totals,checks:P.checks,at:nowStamp(),dirty:true,version:null};
 const r=await storeBatch(P.rep,P.meta.key,meta,recs);
 DB.importlog.unshift({time:nowStamp().slice(0,16),file:fileName,report:R.fn+' '+R.zh,key:P.meta.key,rows:recs.length,replaced:r.removed,user:'paul.weng'}); if(DB.importlog.length>500)DB.importlog.length=500;

}

const CLOUD={busy:false,state:'idle',msg:'',last:LS.get('cloud_last',''),url:'',files:0};

async function cget(params){const q=new URLSearchParams(Object.assign({k:cloudKey()},params)).toString();const r=await fetch(cloudUrl()+'?'+q);const j=await r.json();if(!j.ok)throw new Error(j.msg||j.error||'error');return j}
async function cpost(body){const r=await fetch(cloudUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({api:'psjhr',k:cloudKey()},body))});const j=await r.json();if(!j.ok)throw new Error(j.msg||j.error||'error');return j}
async function batchRecs(f){const ds=REP_DS[f.rep];if(!ds)return [];
 if(BIG[ds])return attRowsOf(f.key);
 if(SNAP[ds])return DB.asof[ds]===f.asof?DB[ds]:((DB.snaps[ds]||{})[f.asof]||[]);
 return DB[ds].filter(r=>r.import_key===f.key)}
const SKIP_COLS=new Set(['id','import_key','source_system','source_file','synced_at','_row']);
function cloudSetState(st,msg){CLOUD.state=st;CLOUD.msg=msg||'';const b=$('#cloudBadge');if(b)paintCloudBadge(b)}
function paintCloudBadge(b){b.hidden=false;
 const m={idle:['☁️',tt('雲端','Cloud')],off:['☁️',tt('雲端未連線','Cloud off')],busy:['🔄',CLOUD.msg||tt('同步中…','Syncing…')],ok:['☁️',tt('已同步 ','Synced ')+(CLOUD.last||'').slice(11,16)],err:['⚠️',tt('同步失敗','Sync failed')]}[cloudReady()?CLOUD.state:'off'];
 b.className='cloud-badge '+(cloudReady()?CLOUD.state:'off');b.textContent=m[0]+' '+m[1];b.title=CLOUD.msg||''}
async function pushBatch(f){
 const recs=await batchRecs(f); const cols=uniq(recs.flatMap(r=>Object.keys(r))).filter(c=>!SKIP_COLS.has(c)&&recs.some(r=>r[c]!=null&&r[c]!==''));
 const types=cols.map(c=>recs.some(r=>typeof r[c]==='number')?'n':'s'); const n=Math.max(1,Math.ceil(recs.length/2500)); let ver=null;
 for(let i=0;i<n;i++){const chunk=recs.slice(i*2500,(i+1)*2500).map(r=>cols.map(c=>r[c]==null?null:(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])));
  cloudSetState('busy',tt('上傳 ','Uploading ')+f.label+' '+(i+1)+'/'+n);
  const meta=i===n-1?{rep:f.rep,fn:f.fn,file:f.file,label:f.label,range:f.range,asof:f.asof,year:f.year,totals:f.totals,checks:f.checks,at:f.at,user:'paul.weng'}:null;
  const j=await cpost({action:'hr_put',sheet:REP_SHEET[f.rep],key:f.key,part:i,total:recs.length,cols,types,rows:chunk,meta}); if(j.version)ver=j.version}
 f.version=ver; f.dirty=false;
}
const PJ=v=>{if(v==null||v==='')return null;if(typeof v!=='string')return v;try{return JSON.parse(v)}catch(e){return v}};
async function pullBatch(m){
 const cols=PJ(m.cols)||[], types=PJ(m.types)||[]; let rows=[], off=0, total=+m.rows||0;
 do{cloudSetState('busy',tt('下載 ','Downloading ')+m.label+' '+fmt(Math.min(total,off+3000))+'/'+fmt(total));
  const j=await cget({action:'hr_get',key:m.key,offset:off,limit:3000}); rows=rows.concat(j.rows); total=j.total; off+=3000}while(off<total);
 const recs=rows.map((a,i)=>{const o={id:nid(m.rep[0])};cols.forEach((c,k)=>{let v=a[k];if(types[k]==='n')v=(v===''||v==null)?null:+v;else v=v==null?'':String(v);o[c]=v});o.source_system='BEST_HR';o.source_file=m.file;o.import_key=m.key;o.synced_at=m.at;return o});
 const meta={key:m.key,rep:m.rep,fn:m.fn,file:m.file,rows:recs.length,label:m.label,range:PJ(m.range)||['',''],asof:m.asof||'',year:m.year?+m.year:null,totals:PJ(m.totals),checks:PJ(m.checks)||[],at:m.at,version:String(m.version),dirty:false,cloud:true};
 await storeBatch(m.rep,m.key,meta,recs);
}
let NOTEQ=[];
function cloudNote(no,notes){DB.notes[no]={notes,at:nowStamp()};NOTEQ=NOTEQ.filter(x=>x.id!==no);NOTEQ.push({id:no,notes});persist();if(cloudReady())cloudSync(false)}
async function cloudSync(manual){
 if(CLOUD.busy)return; if(!cloudReady()){cloudSetState('off');if(manual)toast(tt('請先在「設定 → 雲端同步」填後端網址並輸入同步密碼','Set the backend URL and sync password in Settings → Cloud sync first'));return}
 CLOUD.busy=true; let pulled=0,pushed=0;
 try{
  cloudSetState('busy',tt('讀取雲端清單…','Reading cloud list…'));
  const man=await cget({action:'hr_manifest'}); CLOUD.url=man.url||''; const files=man.files||[]; CLOUD.files=files.length;
  for(const k of (DB.dropq||[]).splice(0)){try{await cpost({action:'hr_drop',key:k})}catch(e){}}
  const justPushed=new Set();
  for(const f of (DB.hrfiles||[]).filter(f=>f.dirty||!f.version)){await pushBatch(f);justPushed.add(f.key);pushed++;persist()}
  for(const m of files){if(justPushed.has(m.key))continue;const loc=(DB.hrfiles||[]).find(f=>f.key===m.key);if(loc&&(loc.dirty||String(loc.version)===String(m.version)))continue;await pullBatch(m);pulled++;persist()}
  for(const n of NOTEQ.splice(0)){await cpost({action:'hr_note',id:n.id,notes:n.notes,user:'paul.weng'})}
  (man.notes||[]).forEach(n=>{const cur=DB.notes[n.id];if(cur&&cur.at>String(n.at))return;DB.notes[n.id]={notes:String(n.notes||''),at:String(n.at||'')}});
  CLOUD.last=nowStamp(); LS.set('cloud_last',CLOUD.last); cloudSetState('ok'); persist();
  if(pulled||pushed||manual){toast(tt('雲端同步完成','Cloud sync done')+(pushed?` · ${tt('上傳','up')} ${pushed}`:'')+(pulled?` · ${tt('下載','down')} ${pulled}`:''));rerender()}
 }catch(e){console.error(e);cloudSetState('err',String(e.message||e));if(manual||/密碼|KEY/.test(String(e.message)))toast(tt('雲端同步失敗：','Cloud sync failed: ')+(e.message||e))}
 finally{CLOUD.busy=false}
}

const md=d=>pad(d.getMonth()+1)+'/'+pad(d.getDate());
function isoWeek(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7)+3);const y=x.getFullYear();const j4=new Date(y,0,4);return {y,w:1+Math.round(((x-j4)/864e5-3+((j4.getDay()+6)%7))/7)}}
function weekStart(y,w){const j4=new Date(y,0,4);return addD(addD(j4,-((j4.getDay()+6)%7)),(w-1)*7)}
const weeksIn=y=>isoWeek(new Date(y,11,28)).w;
function rangeFor(pt,a){a=a||TODAY;
 if(pt==='D')return {from:a,to:a};
 if(pt==='W'){const s=addD(a,-((a.getDay()+6)%7));return {from:s,to:addD(s,6)}}
 if(pt==='M')return {from:new Date(a.getFullYear(),a.getMonth(),1),to:new Date(a.getFullYear(),a.getMonth()+1,0)};
 if(pt==='Y')return {from:new Date(a.getFullYear(),0,1),to:new Date(a.getFullYear(),11,31)};
 return {from:DATA_START,to:TODAY,all:true};
}
function rangeOf(st){if(st.pt==='C'){const f=parseD(st.from)||new Date(TODAY.getFullYear(),TODAY.getMonth(),1),t2=parseD(st.to)||TODAY;return f<=t2?{from:f,to:t2}:{from:t2,to:f}}if(st.pt==='ALL')return {from:DATA_START,to:TODAY,all:true};return rangeFor(st.pt,parseD(st.anchor)||TODAY)}
const rangeStr=R=>({a:ymd(R.from),b:ymd(R.to)});
function shiftDate(pt,a,n){if(pt==='D')return addD(a,n);if(pt==='W')return addD(a,7*n);if(pt==='M')return new Date(a.getFullYear(),a.getMonth()+n,1);if(pt==='Y')return new Date(a.getFullYear()+n,0,1);return a}
function periodLabel(pt,R){

const KEYSRC={att:'att',attexc:'attexc',leave:'leave',joinleave:'joinleave',annual:'annual',holiday:'holiday',reports:'att',dashboard:'att'};
function periodKeys(k){return cached('pk|'+k,()=>{const set=new Set();const ds=KEYSRC[k];if(!ds)return set;const add=d=>{if(d){set.add(d.slice(0,7));set.add(d.slice(0,4))}};

/* sub-buckets of a range: days, months or years */
function buckets(R){
 const span=Math.round((R.to-R.from)/864e5)+1; const out=[]; const end=R.to>TODAY?TODAY:R.to;
 if(R.all||span>400){for(let y=R.from.getFullYear();y<=end.getFullYear();y++)out.push({key:String(y),label:String(y),from:new Date(y,0,1),to:new Date(y,11,31)})}
 else if(span>62){for(let d=new Date(R.from.getFullYear(),R.from.getMonth(),1);d<=end;d=new Date(d.getFullYear(),d.getMonth()+1,1))out.push({key:monthKey(d),label:d.getFullYear()+' '+MN(d.getMonth()),from:d,to:new Date(d.getFullYear(),d.getMonth()+1,0)})}
 else{for(let d=new Date(R.from);d<=end;d=addD(d,1))out.push({key:ymd(d),label:md(d)+' '+['日','一','二','三','四','五','六'][d.getDay()],from:new Date(d),to:new Date(d)})}

}

function niceTop(max){if(max<=0)return 1;const step=Math.pow(10,Math.floor(Math.log10(max)))/2;let top=Math.ceil(max/step)*step;return Math.ceil(top/4/step)*step*4}

function healthHTML(){
 const E=[...empIdx().values()]; const issues=[];
 const act=E.filter(e=>e.status==='在職'); const noJoin=act.filter(e=>!e.join_date); if(noJoin.length)issues.push([tt('在職但無到職日','Active without join date'),noJoin.length,noJoin]);
 const badJL=E.filter(e=>e.join_date&&e.leave_date&&e.leave_date<e.join_date); if(badJL.length)issues.push([tt('離職日早於到職日','Leave date before join date'),badJL.length,badJL]);
 const futJ=E.filter(e=>e.join_date&&e.join_date>ymd(addD(TODAY,30))); if(futJ.length)issues.push([tt('到職日在未來','Join date in the future'),futJ.length,futJ]);
 const leftNoDate=E.filter(e=>e.status==='離職'&&!e.leave_date); if(leftNoDate.length&&DB.joinleave.length)issues.push([tt('離職但查無離職日（新離職報表未涵蓋）','Left but no leave date in any report'),leftNoDate.length,leftNoDate]);
 const actLeft=act.filter(e=>e.leave_date&&e.leave_date<=ymd(TODAY)); if(actLeft.length)issues.push([tt('在職但已有離職日','Active but has a past leave date'),actLeft.length,actLeft]);
 const noBirth=act.filter(e=>DB.emp2.length&&!e.birthday); if(noBirth.length)issues.push([tt('在職但無生日','Active without birthday'),noBirth.length,noBirth]);
 const noPay=act.filter(e=>DB.basepay.length&&!e.pay); if(noPay.length)issues.push([tt('在職但無薪資設定','Active without pay setup'),noPay.length,noPay]);
 const anNo=DB.annual.filter(r=>!r.emp_no).length; if(anNo)issues.push([tt('特休總表對不到員工（同名或查無）','Annual leave rows not matched to an employee'),anNo,[]]);
 if(!issues.length)return `<div class="note good small">✅ ${tt('沒有發現資料問題','No data issues found')}</div>`;
 return `<div class="tbl-wrap"><table class="t"><tbody>${issues.map(([l,n,arr])=>`<tr><td>${esc(l)}</td><td class="r"><b>${fmt(n)}</b></td><td class="small muted wrap">${arr.slice(0,8).map(e=>`<a href="javascript:openEmp('${esc(e.emp_no)}')" class="mono">${esc(e.emp_no)}</a>`).join(' · ')}${arr.length>8?' …':''}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin:8px 0 0">${tt('只標記，不改人事系統；請人事在 BEST 系統修正後重新匯出。','Flagged only — fix in the BEST HR system and re-export.')}</p>`;
}

function monthGridHTML(no,ym){
 if(!ym)return ''; const f=(DB.hrfiles||[]).filter(x=>x.rep==='att'&&x.range[0].slice(0,7)===ym); const need=f.map(x=>x.key).filter(k=>!ATT_CACHE.has(k));
 if(need.length){(async()=>{for(const k of need)await attRowsOf(k);if(PROF_NO===no){const g=$('#profGrid');if(g)g.innerHTML=monthGridHTML(no,ym)}})();return `<div class="muted small" style="margin-top:8px">⏳ ${tt('載入 ','loading ')}${ym}…</div>`}
 let rows=[];f.forEach(x=>rows=rows.concat((ATT_CACHE.get(x.key)||[]).filter(r=>r.emp_no===no)));const by={};rows.forEach(r=>by[r.day]=r);const H=holidaySet();
 const first=parseD(ym+'-01'),dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(); let g=`<div class="small muted" style="margin:8px 0 4px">${esc(ym)} ${tt('每日','daily')}</div><div class="month-grid">${['日','一','二','三','四','五','六'].map(d=>`<div class="small muted" style="text-align:center">${d}</div>`).join('')}`;
 for(let i=0;i<first.getDay();i++)g+='<div></div>';
 for(let d=1;d<=dim;d++){const r=by[d];const ds=ym+'-'+pad(d);const hol=H.has(ds)||new Date(first.getFullYear(),first.getMonth(),d).getDay()===0;const cls=!r?'':(r.time_in||r.time_out)?(r.lv_missing>0?'abs':'ok'):(r.lv_taken>0?'lv':r.lv_missing>0?'abs':hol?'hol':'');
  g+=`<div class="dcell ${cls||(hol?'hol':'')}"><b>${d}</b>${r&&(r.time_in||r.time_out)?`<small>${esc(r.time_in||'—')}<br>${esc(r.time_out||'—')}</small>`:r&&r.lv_taken>0?`<small>${tt('請假','leave')} ${fmt(r.lv_taken,0)}h</small>`:r&&r.lv_missing>0?`<small style="color:var(--crit)">${tt('缺','abs')} ${fmt(r.lv_missing,0)}h</small>`:''}</div>`}
 return g+'</div>';
}

/* ---------- smart import ---------- */
let IMPQ=[];
async function readAOA(file){
 if(!window.XLSX)throw new Error(tt('Excel 解析器載入失敗，請檢查網路後重新整理','Excel parser failed to load — check the connection and reload'));
 const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false,raw:true});const sn=wb.SheetNames[0];
 return {aoa:XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''}),sheets:wb.SheetNames};
}
async function handleFiles(list){
 const files=[...list].filter(f=>!/^00_export/i.test(f.name)); if(!files.length)return; toast(tt('讀取中…','Reading…')+' '+files.length);
 for(const f of files){
  try{const {aoa}=await readAOA(f); const R=detectReport(aoa);
   if(R){const P=PARSERS[R.parser](aoa,f,R.k); const existing=(DB.hrfiles||[]).find(x=>x.key===P.meta.key); IMPQ=IMPQ.filter(q=>!(q.P&&q.P.meta.key===P.meta.key)); IMPQ.push({file:f.name,size:f.size,R,P,existing})}
   else IMPQ.push({file:f.name,err:tt('不是已知的人事系統報表（支援：員工清冊、清冊2、通訊錄、新離職人員、請假明細、每月工時明細、異常工時、薪資清冊、年度特休、國定假日、職務代碼）','Not a known HR report')});
  }catch(e){IMPQ.push({file:f.name,err:String(e.message||e)})}
 }
 go('smart-import'); rerender();
}
function dropQ(i){IMPQ.splice(i,1);rerender()}
function queueHTML(){
 if(!IMPQ.length)return '';
 const pend=IMPQ.filter(q=>q.P&&!q.done&&!q.skip).length;
 let h=`<div class="panel mt"><h2>${tt('匯入佇列','Import queue')} · ${fmt(IMPQ.length)} ${tt('個檔','files')}</h2><p class="hint">${tt('每個檔一列。報表依表頭自動辨識，逐筆加總後與報表合計核對；核對失敗（❌）預設不勾選。同範圍重匯＝取代，不重複。','One row per file. Reports are recognised by header and checked against totals; failed checks (❌) are unticked by default. Re-importing the same scope replaces it.')}</p>
 <div class="tbl-wrap"><table class="t cards"><thead><tr><th></th><th>${tt('檔案','File')}</th><th>${tt('報表','Report')}</th><th>${tt('範圍','Scope')}</th><th class="r">${tt('筆數','Rows')}</th><th>${tt('核對','Checks')}</th><th>${esc(t('status'))}</th><th></th></tr></thead><tbody>`;
 IMPQ.forEach((q,i)=>{
  if(q.err){h+=`<tr><td></td><td class="lead mono" data-l="">${esc(q.file)}</td><td colspan="5" data-l="">${stChip('crit',tt('無法匯入','Cannot import'))} <span class="small">${esc(q.err)}</span></td><td data-l=""><button class="btn sm" onclick="dropQ(${i})">✕</button></td></tr>`;return}
  const P=q.P; const bad=P.checks.some(c=>c.ok===false); if(q.skip==null)q.skip=bad;
  h+=`<tr><td data-l="">${q.done?'':`<input type="checkbox" ${q.skip?'':'checked'} onchange="IMPQ[${i}].skip=!this.checked;rerender()">`}</td><td class="lead mono" data-l="">${esc(q.file)}</td><td data-l="${tt('報表','Report')}"><b>${esc(q.R.fn)}</b><br><span class="small">${esc(LANG===0?q.R.zh:q.R.en)}</span></td><td data-l="${tt('範圍','Scope')}" class="wrap">${esc(P.meta.label)}</td><td class="r" data-l="${tt('筆數','Rows')}">${fmt(P.rows.length)}</td>
   <td class="wrap small" data-l="${tt('核對','Checks')}">${P.checks.map(c=>`<div>${c.ok===true?'✅':c.ok===false?'❌':'⚠️'} ${esc(c.msg)}</div>`).join('')}</td>
   <td data-l="${esc(t('status'))}">${q.done?stChip('good',tt('已匯入','Imported')+` +${fmt(q.done.added)}`+(q.done.removed?` / ${tt('取代','replaced')} ${fmt(q.done.removed)}`:'')):q.skip?stChip('neu',tt('不匯入','Skipped')):q.existing?stChip('warn',tt('將取代舊資料','Will replace')+' '+fmt(q.existing.rows)):stChip('info',tt('新資料','New'))}</td>
   <td data-l="">${q.done?`<a class="btn sm" href="#${q.R.ds==='emp2'||q.R.ds==='contact'?'emp':q.R.ds}">${tt('看資料','Open')} →</a>`:`<button class="btn sm" onclick="dropQ(${i})">✕</button>`}</td></tr>`;
 });
 const sel2=IMPQ.filter(q=>q.P&&!q.done&&!q.skip).length;
 h+=`</tbody></table></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap">${pend?`<button class="btn" onclick="IMPQ=[];rerender()">${esc(t('cancel'))}</button><button class="btn pri" ${sel2?'':'disabled'} onclick="confirmAll()">${tt('確認匯入','Confirm import')} (${sel2})</button>`:`<button class="btn" onclick="IMPQ=[];rerender()">${tt('清除清單','Clear list')}</button>`}</div>
 <p class="small muted" style="margin:8px 0 0">${tt('只寫入 PSJHR 雲端資料；不寫回 per.exe。','Writes to PSJHR cloud data only; never back to per.exe.')}</p></div>`;
 return h;
}
async function confirmAll(){
 const todo=IMPQ.filter(q=>q.P&&!q.done&&!q.skip); if(!todo.length)return; toast(tt('匯入中…','Importing…'));
 for(const q of todo){try{q.done=await applyHR(q.P,q.file)}catch(e){q.err=String(e.message||e);q.P=null}}
 GC.clear(); Object.keys(ST).forEach(k=>{if(!LS.get('nav_'+k,null))delete ST[k]});
 toast(tt('已匯入 ','Imported ')+todo.length+tt(' 個檔',' files')); rerender(); if(cloudReady())setTimeout(()=>cloudSync(false),300);

/* ---------- router / boot ---------- */
const RENDER={dashboard:renderDashboard,'smart-import':renderImport,emp:renderEmp,basepay:renderBasePay,jobcode:renderJobcode,sync:renderSync,reports:renderReports,settings:renderSettings,
 att:()=>renderPeriod('att'),attexc:()=>renderPeriod('attexc'),leave:()=>renderPeriod('leave'),joinleave:()=>renderPeriod('joinleave'),holiday:()=>renderPeriod('holiday'),annual:()=>renderPeriod('annual')};
let toastT; function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2800)}
function rerender(){
 let html; try{html=(RENDER[CUR]||renderDashboard)()}catch(err){console.error(err);html=pageHead(CUR)+`<div class="note crit">${tt('此頁顯示發生錯誤。請按「本期」或換一個期間再試。','This page failed to render. Press Current or pick another period.')}<br><span class="mono small">${esc(err.message)}</span></div>`}
 $('#page').innerHTML=html; renderNav(); applyStatic(); bindPage();
}
function go(k){if(location.hash!=='#'+k)location.hash=k;else route()}
function route(){let h=decodeURIComponent((location.hash||'#dashboard').slice(1));SOLO=h.startsWith('solo-');if(SOLO)h=h.slice(5);CUR=RENDER[h]?h:'dashboard';document.body.classList.toggle('solo',SOLO);$('#rail').classList.remove('open');closeDrawer();rerender();window.scrollTo(0,0);document.title=SOLO?`${t(CUR)} · VRT HR`:'VRT HR · PSJHR'}
function applyStatic(){const cb=$('#cloudBadge');if(cb)paintCloudBadge(cb);$$('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));$('#gsearch').placeholder=t('search_ph');$$('#langSw button').forEach(b=>b.classList.toggle('on',+b.dataset.l===LANG));document.documentElement.lang=['zh-Hant','en','km'][LANG]}
function bindPage(){const dz=$('#drop');if(dz){dz.onclick=()=>$('#fileIn').click();dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#fileIn').click()}}}
 $$('.chart [data-tip]').forEach(el=>{el.onmousemove=e=>{const tp=$('#tip');tp.textContent=el.dataset.tip;tp.hidden=false;tp.style.left=Math.min(e.clientX+12,innerWidth-160)+'px';tp.style.top=(e.clientY-34)+'px'};el.onmouseleave=()=>$('#tip').hidden=true;el.ontouchstart=e=>{const tp=$('#tip');tp.textContent=el.dataset.tip;tp.hidden=false;const x=e.touches[0];tp.style.left=Math.min(x.clientX,innerWidth-160)+'px';tp.style.top=(x.clientY-44)+'px';setTimeout(()=>tp.hidden=true,1800)}})}
function setLang(i){LANG=i;LS.set('lang',i);rerender();document.title=SOLO?`${t(CUR)} · VRT HR`:'VRT HR · PSJHR'}
(function(){let depth=0;const ov=document.createElement('div');ov.className='drop-ov';ov.hidden=true;ov.innerHTML=`<div><b>📥 ${tt('放開即可匯入','Release to import')}</b><span>${tt('系統會自己辨識是哪一種人事報表','The system recognises each HR report')}</span></div>`;document.body.appendChild(ov);
 const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
 document.addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();depth++;ov.hidden=false});document.addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault()});
 document.addEventListener('dragleave',e=>{if(!hasFiles(e))return;depth=Math.max(0,depth-1);if(!depth)ov.hidden=true});document.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();depth=0;ov.hidden=true;const fs=e.dataTransfer.files;if(fs&&fs.length)handleFiles(fs)})})();
async function init(){
 $('#page').innerHTML=`<div class="note">${tt('載入資料中…','Loading data…')}</div>`;
 await IDB.open(); await loadDB(); document.documentElement.dataset.theme='light'; document.body.classList.toggle('show-pii',SHOW_PII); $('#piiBtn').textContent=SHOW_PII?'👁️':'🙈';
 $$('#langSw button').forEach(b=>b.onclick=()=>setLang(+b.dataset.l)); $('#piiBtn').onclick=()=>togglePii(!SHOW_PII);
 $('#menuBtn').onclick=()=>$('#rail').classList.toggle('open'); $('#scrim').onclick=closeDrawer; document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
 $('#gsearch').oninput=e=>gsearch(e.target.value); document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sres').hidden=true});
 $('#fileIn').onchange=e=>{const fs=[...e.target.files];if(fs.length)handleFiles(fs);e.target.value=''};
 window.addEventListener('hashchange',route); route();
 setTimeout(()=>cloudSync(false),400);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudReady()&&(!CLOUD.last||Date.now()-new Date(CLOUD.last.replace(' ','T'))>3*60e3))cloudSync(false)});
}
init();
</script></body></html>
