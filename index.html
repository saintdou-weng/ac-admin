<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3fb">
<title>VRT OS · 行政中心</title>
<script>if(/[?&]view=(learning|personal)\b/.test(location.search))location.replace("/vrt-acc-flow-cost/learn/index.html"+location.search+location.hash)</script>
<script src="config.js?v=2.2.0"></script>
<style>
:root{--bg:#f3f6fa;--surface:#eef3fb;--card:#fff;--ink:#1b2738;--ink2:#33445a;--mut:#6b7a8d;--line:#d5deea;--accent:#2563eb;--on:#e9f7ef;--onink:#1c6b4a;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--side:272px}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Noto Sans TC","Noto Sans Khmer","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
/* ================= left menu (one menu for all four systems) ================= */
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brand{display:flex;align-items:center;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line);background:none;border-width:0 0 1px;text-align:left;width:100%}
.mark{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.02em;flex:none}
.brand b{display:block;font-size:19px;line-height:1.15}.brand span{font-size:12px;color:var(--mut)}
.sfind{margin:10px 12px 4px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.sfind input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px}
.sfind kbd{font:600 10px ui-monospace,monospace;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
#menu{flex:1;overflow-y:auto;padding:4px 0 18px;overscroll-behavior:contain}
.it{display:flex;align-items:center;gap:11px;width:calc(100% - 16px);margin:1px 8px;padding:8px 12px;border:0;background:none;border-radius:8px;color:var(--ink2);font-size:14.5px;text-align:left}
.it .ic{width:24px;text-align:center;font-size:17px;flex:none}
.it .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it:hover{background:#e3ebf7}
.it.on{background:var(--on);color:var(--onink);font-weight:700}
.bd{font-size:11px;color:var(--mut);border:1px solid #c9d4e2;border-radius:6px;padding:0 6px;line-height:18px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.bd.n{border:0;padding:0;font-size:12.5px}
.sysh{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:10px 8px 2px;padding:9px 12px;border:0;border-radius:9px;background:color-mix(in srgb,var(--c) 9%,#fff);border-left:4px solid var(--c);font-weight:800;font-size:14.5px;text-align:left;color:var(--ink)}
.sysh .ic{font-size:18px}.sysh .lb{flex:1}.sysh .tg{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--c)}
.sysh .ch{color:var(--mut);font-size:11px;transition:transform .15s}.sysh.shut .ch{transform:rotate(-90deg)}
.sysh.cur{background:color-mix(in srgb,var(--c) 16%,#fff)}
.g{padding:10px 20px 3px;font-size:11.5px;letter-spacing:.06em;color:var(--mut);font-weight:700}
.sfoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center}
.sfoot .btn{flex:1;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:#c3ccd4;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:650;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:14px}
.btn:hover{border-color:#aebcd0}.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:disabled{opacity:.6;cursor:default}
/* ================= work area ================= */
#stage{position:fixed;inset:0 0 0 var(--side)}
#home{position:absolute;inset:0;overflow:auto;padding:22px clamp(14px,2.6vw,32px) 70px}
.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.frame.on{display:block}
#loading{position:absolute;inset:0;display:none;place-items:center;background:var(--bg);color:var(--mut);font-weight:600;z-index:2}#loading.on{display:grid}
#mtop{display:none}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{margin:0;font-size:clamp(22px,3vw,28px);letter-spacing:-.01em}.top p{margin:2px 0 0;color:var(--mut);font-size:13px}.top .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:4px solid var(--c);text-align:left;display:flex;flex-direction:column;gap:4px}
.kpi:hover{box-shadow:0 4px 14px rgba(27,39,56,.08)}
.kpi .h{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}.kpi .h span:first-child{font-size:21px}
.kpi small{color:var(--mut);font-size:12.5px}.kpi .s{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut);margin-top:4px}
.sec{margin:22px 0 10px;font-size:13px;font-weight:800;color:var(--mut);letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
/* summary carousel: one page per system, swipe sideways, loops round */
.seg{display:inline-flex;background:#e4eaf2;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 16px;font-weight:700;color:var(--mut);font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(27,39,56,.14)}
.ctabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 8px;scrollbar-width:none}.ctabs::-webkit-scrollbar{display:none}
.ctab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--mut)}
.ctab.on{background:var(--c);border-color:var(--c);color:#fff}.ctab.on .dot{box-shadow:0 0 0 2px #fff}
.carw{position:relative}
#car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px;-webkit-overflow-scrolling:touch}#car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;padding:1px}
.sbox{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 92%,#000),color-mix(in srgb,var(--c) 70%,#1b2738));color:#fff;border-radius:18px;padding:18px clamp(14px,2.4vw,24px) 16px;min-height:286px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.sbox::after{content:attr(data-ic);position:absolute;right:-8px;top:-22px;font-size:132px;opacity:.13;pointer-events:none}
.shead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.shead h2{margin:0;font-size:21px}.shead .pl{font-size:12.5px;opacity:.85;background:rgba(255,255,255,.16);border-radius:999px;padding:2px 10px}
.shead .enter{margin-left:auto;border:0;background:#fff;color:var(--c);border-radius:10px;padding:8px 16px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(46%,168px),1fr));gap:10px}
.tile{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:13px;padding:11px 13px;text-align:left;color:#fff;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile:hover{background:rgba(255,255,255,.22)}
.tile .l{font-size:12px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:clamp(23px,3.4vw,31px);font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .v small{font-size:13px;font-weight:600;opacity:.85;margin-left:3px}
.tile .d{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.hot{background:#fff;color:#9a3412;border-color:#fff}.tile.hot .v{color:#c2410c}
.sfootr{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.9;margin-top:auto;flex-wrap:wrap}
.sempty{background:rgba(255,255,255,.13);border-radius:13px;padding:18px;font-size:14px;line-height:1.6}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px rgba(27,39,56,.25);font-size:16px;z-index:3}
.cnav.l{left:-12px}.cnav.r{right:-12px}
.dots{display:flex;justify-content:center;gap:7px;margin:10px 0 2px}.dots i{width:8px;height:8px;border-radius:50%;background:#c5cfdb;transition:.2s}.dots i.on{width:22px;border-radius:5px;background:var(--ink)}
@media(max-width:900px){.cnav{display:none}.sbox{min-height:300px}}
/* process map: rows = systems (top to bottom), columns = steps (left to right) */
.lane{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.lane>header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--c) 8%,#fff);border-bottom:1px solid var(--line);font-weight:800}
.lane>header .tg{font-size:10px;letter-spacing:.06em;color:var(--c)}.lane>header .go{margin-left:auto;border:0;background:var(--c);color:#fff;border-radius:8px;padding:5px 12px;font-weight:700;font-size:13px}
.steps{display:flex;overflow-x:auto;scroll-snap-type:x proximity}
.step{flex:1 0 190px;padding:12px 14px 14px;border-right:1px solid var(--line);scroll-snap-align:start;position:relative}
.step:last-child{border-right:0}
.step h3{margin:0 0 8px;font-size:12.5px;color:var(--c);letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.step h3 i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:11px;flex:none}
.pg{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:5px 6px;border-radius:7px;text-align:left;font-size:14px;color:var(--ink2)}
.pg:hover{background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink)}.pg .ic{width:20px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:550}.chip:hover{border-color:var(--accent);color:var(--accent)}
.tag{font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;background:color-mix(in srgb,var(--c) 13%,#fff);color:var(--c);white-space:nowrap}
footer{margin-top:26px;color:var(--mut);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}footer a{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:90;display:none;max-width:90vw}
#shade{display:none}#fab{display:none}
/* ================= phone / narrow ================= */
@media(max-width:900px){
 :root{--side:0px}
 #side{width:min(300px,86vw);transform:translateX(-103%);box-shadow:none;padding-top:env(safe-area-inset-top,0px)}
 body.menu #side{transform:none;box-shadow:8px 0 30px rgba(15,23,42,.25)}
 #shade{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:39}body.menu #shade{display:block}
 #home{padding:0 12px 90px}
 #mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;margin-bottom:6px}
 #mtop button{border:1px solid var(--line);background:#fff;border-radius:10px;width:42px;height:42px;font-size:19px}
 #mtop b{font-size:18px}
 .top h1{display:none}
 #fab{display:grid;place-items:center;position:fixed;right:8px;top:46%;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;font-weight:800;font-size:11px;z-index:38;box-shadow:0 6px 18px rgba(15,23,42,.35);opacity:.9;touch-action:none}
 #fab i{position:absolute;top:1px;right:1px;width:11px;height:11px;border-radius:50%;border:2px solid #fff;background:var(--c,#16a34a)}
 body.athome #fab{display:none}
 .step{flex-basis:170px}
}
</style>
</head>
<body class="athome">
<aside id="side" aria-label="VRT OS">
  <button class="brand" id="brand"><div class="mark">VRT</div><div><b>OS</b><span id="brandsub"></span></div></button>
  <label class="sfind"><span>🔎</span><input id="find" autocomplete="off" spellcheck="false"><kbd>/</kbd></label>
  <nav id="menu"></nav>
  <div class="sfoot"><button class="btn pri" id="upd"></button><select class="btn" id="lang" aria-label="Language" style="flex:none"><option value="zh">繁中</option><option value="en">EN</option><option value="km">ខ្មែរ</option></select></div>
</aside>
<div id="shade"></div>
<div id="stage"><main id="home"></main><div id="loading"></div></div>
<button id="fab" aria-label="Menu">VRT<i></i></button>
<div id="toast" role="status"></div>
<script>
/* VRT OS shell v2.2 — one ERP-style workspace over the four live systems.
   Menu order follows a garment factory's flow: order → materials → production → shipping → cost,
   then people (HR), site (GA & security) and compliance (audit).
   Every system keeps running at its own address; the shell shows the live page (same origin),
   reads that system's own menu as it is today, and never copies or rewrites its data. */
(function(){'use strict';
const CFG=window.AC_CONFIG||{},SYS=(CFG.systems||[]).slice(),$=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const get=(k,f)=>{try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch(e){return f}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let lang=get('ac_admin_lang','zh');if(!['zh','en','km'].includes(lang))lang='zh';
const t=(zh,en,km)=>lang==='zh'?zh:lang==='km'?(km||en):en;
const nm=o=>lang==='zh'?o.zh:(lang==='km'&&o.km)||o.en||o.zh;
const narrow=()=>matchMedia('(max-width:900px)').matches;
const ADMIN=[
 {k:'apps/admin/admin_org_chart.html',ic:'🏢',zh:'組織架構',en:'Organisation chart',frame:true},
 {k:'apps/admin/budget_vs_actual.html',ic:'📊',zh:'預算 vs 實際支出',en:'Budget vs actual',frame:true},
 {k:'resources/admin/salary_adjust_2026.xlsx',ic:'📈',zh:'年度調薪 2026',en:'Salary adjustment 2026',bd:'xlsx'},
 {k:'resources/admin/salary_adjust_2022.xlsx',ic:'📈',zh:'年度調薪 2022',en:'Salary adjustment 2022',bd:'xlsx'},
 {k:'resources/admin/salary_adjust_2021.xlsx',ic:'📈',zh:'年度調薪 2021',en:'Salary adjustment 2021',bd:'xlsx'},
 {k:'resources/admin/salary_structure_2022.xls',ic:'🗂',zh:'薪資架構（2022 歷史檔）',en:'Salary structure (2022)',bd:'xls'}
];
const ADMINSYS={id:'admin',icon:'🏛',color:'#475569',zh:'行政',en:'Administration',km:'រដ្ឋបាល',tag:'ADMIN',mode:'file',url:new URL('./',location.href).href,pages:[]};
const byId=id=>id==='admin'?ADMINSYS:SYS.find(s=>s.id===id);
/* per system: hide its own side menu inside the workspace (ours replaces it) and send its ☰ button to our menu */
const FUSE={
 hr:{css:'.rail{display:none!important}.app{grid-template-columns:minmax(0,1fr)!important}',menu:'#menuBtn'},
 erp:{css:'.rail{display:none!important}.app{grid-template-columns:minmax(0,1fr)!important}',menu:'#menuBtn'},
 ga:{css:'#ga-sidebar,.backdrop{display:none!important}.shell{display:block!important}.main-shell{grid-column:auto!important}',menu:'[data-action="menu"]'}
};
const frames={},status=get('vrt_os_status_v1',{}),menus=get('vrt_os_menu_v2',{});
let cur='home',curKey='',recents=get('vrt_os_recent_v1',[]),syncing=false,shut=new Set(get('vrt_os_shut_v1',[]));

/* ---------- menu data: live from each system, seed list until its first visit ---------- */
function pages(s){if(s.id==='admin')return ADMIN;const m=menus[s.id];return m&&Array.isArray(m.items)&&m.items.length>=3?m.items:s.pages||[]}
function harvest(s){
 const f=frames[s.id];if(!f||s.mode!=='hash')return;let d;try{d=f.contentDocument}catch(e){return}if(!d||!d.body)return;
 const items=[],seen=new Set();let g='';
 d.querySelectorAll('nav .nav-g,nav .nav-caption,aside .nav-caption,nav a[href^="#"],aside a[href^="#"],aside button[data-route]').forEach(el=>{
  const isItem=el.tagName==='A'||el.hasAttribute('data-route');if(!isItem){g=el.textContent.trim();return}
  const k=el.tagName==='A'?decodeURIComponent((el.getAttribute('href')||'').slice(1)):el.getAttribute('data-route');
  if(!k||seen.has(k)||k.length>60||el.classList.contains('brand'))return;
  const spans=[...el.querySelectorAll('span')].filter(x=>!x.querySelector('span'));
  const sp=spans.find(x=>!x.classList.contains('ic')&&!x.classList.contains('ct')&&!x.classList.contains('nav-count')&&x.textContent.trim().length>1);
  const label=(sp?sp.textContent:el.textContent).replace(/\s+/g,' ').trim();if(!label)return;
  const ic=el.querySelector('.ic'),bd=spans.filter(x=>x!==sp&&x!==ic).map(x=>x.textContent.trim()).filter(Boolean).join(' ').slice(0,12);
  seen.add(k);items.push({k,zh:label,en:label,g,ge:g,ic:ic?ic.textContent.trim():'',bd});
 });
 if(items.length>=3){
  const seed=new Map((s.pages||[]).map(p=>[p.k,p]));items.forEach(it=>{const p=seed.get(it.k);if(p&&!it.ic)it.ic=p.ic});
  const old=JSON.stringify((menus[s.id]||{}).items||[]);menus[s.id]={items,at:Date.now()};
  if(old!==JSON.stringify(items)){put('vrt_os_menu_v2',menus);drawMenu();if(cur==='home')drawLanes()}
 }
}
function fuse(s){const F=FUSE[s.id];if(!F)return;
 try{const d=frames[s.id].contentDocument;if(!d||d.getElementById('vrt-os-fuse'))return;const st=d.createElement('style');st.id='vrt-os-fuse';st.textContent=F.css;d.head.appendChild(st);
  d.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest(F.menu);if(b){e.preventDefault();e.stopPropagation();openMenu()}},true)}catch(e){}
}

/* ---------- open a system / page ---------- */
function target(s,k){if(s.mode==='hash')return s.url+(k?'#'+encodeURI(k):'');return s.url+(k||s.home||'')}
function open(id,k,opts){
 const s=byId(id);if(!s)return goHome();k=k||'';
 if(id==='admin'){const a=ADMIN.find(x=>x.k===k);if(!a)return goHome();if(!a.frame){location.href=a.k;return}}
 let f=frames[id];const url=target(s,k),bg=opts&&opts.background;
 if(!f){f=document.createElement('iframe');f.className='frame';f.title=s.name||nm(s);f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');f.dataset.loaded='0';
  f.addEventListener('load',()=>{f.dataset.loaded='1';if(cur===id)$('loading').classList.remove('on');fuse(s);[300,2500,7000,16000].forEach(ms=>setTimeout(()=>harvest(s),ms));if(SUM[s.id])setTimeout(()=>paintSlide(s),50)});
  $('stage').appendChild(f);frames[id]=f;f.src=url;if(!bg){$('loading').textContent=t('正在開啟 ','Opening ','កំពុងបើក ')+nm(s)+'…';$('loading').classList.add('on')}}
 else if(k){try{if(s.mode==='hash'&&f.dataset.loaded==='1'&&f.contentWindow.location.href.split('#')[0]===s.url.split('#')[0])f.contentWindow.location.hash=k;else{f.dataset.loaded='0';f.src=url}}catch(e){f.src=url}}
 if(bg)return;
 cur=id;curKey=k;Object.entries(frames).forEach(([i,x])=>x.classList.toggle('on',i===id));$('home').style.display='none';document.body.classList.remove('athome');
 if(f.dataset.loaded==='1')$('loading').classList.remove('on');
 const h='#'+id+(k?'/'+k:'');if(location.hash!==h)history.pushState(null,'',h);
 if(k){const p=pages(s).find(x=>x.k===k);recents=[{s:id,k,zh:p?p.zh:k,en:p?p.en:k,ic:p&&p.ic||s.icon}].concat(recents.filter(r=>!(r.s===id&&r.k===k))).slice(0,8);put('vrt_os_recent_v1',recents)}
 if(shut.has(id)){shut.delete(id);put('vrt_os_shut_v1',[...shut])}

(function(){const f=$('fab');let y0=null,moved=false,top=get('vrt_os_fab_top',null);if(top!==null)f.style.top=top+'px';
 f.addEventListener('pointerdown',e=>{y0=e.clientY-f.getBoundingClientRect().top;moved=false;f.setPointerCapture(e.pointerId)});
 f.addEventListener('pointermove',e=>{if(y0===null)return;const y=Math.max(8,Math.min(innerHeight-56,e.clientY-y0));if(Math.abs(y-f.getBoundingClientRect().top)>4)moved=true;if(moved)f.style.top=y+'px'});
 f.addEventListener('pointerup',()=>{if(y0===null)return;y0=null;if(moved)put('vrt_os_fab_top',parseInt(f.style.top,10));else openMenu()});})();
function toast(m,ms){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms||3500)}

window.addEventListener('hashchange',route);window.addEventListener('popstate',route);
if(narrow()&&!get('vrt_os_shut_v1',null)){SYS.slice(1).forEach(s=>shut.add(s.id));shut.add('admin')}
chrome();drawMenu();drawHome();route();
SYS.forEach(s=>{const x=status[s.id];if(!x||x.state!=='ok'||Date.now()-x.at>5*60*1000)probe(s);else paintStatus()});
})();
</script>
