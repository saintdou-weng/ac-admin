<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AC Admin Center · 行政中心</title><link rel="stylesheet" href="shared/admin-ui.css?v=1.3.0"><script src="config.js"></script><script src="catalog.js"></script><script src="shared/admin-core.js?v=1.3.0"></script><script src="shared/admin-home.js?v=1.3.0" defer></script><script src="shared/admin-summary.js?v=1.3.0" defer></script></head><body>
<header class="ac-header"><div class="logo">AC</div><div><strong>AC Admin Center</strong><small id="subtitle"></small></div><div class="grow"></div><select id="lang" aria-label="Language"><option value="zh">繁中</option><option value="en">English</option><option value="km">ខ្មែរ</option></select></header>
<main class="ac-wrap"><div id="metrics" class="ac-kpis"></div><div class="ac-bar ac-primary-bar"><button id="refresh"></button><button id="summary"></button><button id="cloudUp"></button><button id="cloudDown"></button><button id="settings"></button><span class="grow"></span><span id="clock" class="ac-muted"></span></div><nav id="tabs" class="ac-tabs" aria-label="Navigation"></nav><div class="ac-bar ac-search-bar"><input id="search" class="ac-search" type="search"><button id="favorites"></button><button id="addTool"></button></div><div id="receiverNotice" class="ac-note" role="status" hidden></div><div id="notice"></div><div id="content"></div><footer class="ac-footer">AC Admin Center · v1.3.0 · 2026-09-13</footer></main>
<dialog id="settingsDialog"><div class="dialog-head"><h2 id="settingsTitle"></h2><button type="button" data-close="settingsDialog" aria-label="Close">×</button></div><p id="settingsNote" class="ac-muted"></p><form id="settingsForm"><div class="form-grid"><label class="full"><span id="hubLabel"></span><input id="hubUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label><div class="full ac-muted"><span id="keyLabel"></span> · Google</div></div><div id="platformSettings"></div><div class="ac-bar"><button class="primary" id="saveSettings" type="submit"></button><button type="button" id="exportSettings"></button><button type="button" id="importSettings"></button></div></form><div class="ac-note"><p id="telegramHelp"></p><button type="button" id="telegramPanel"></button></div><input type="file" id="settingsFile" accept=".json" hidden></dialog>
<dialog id="toolDialog"><div class="dialog-head"><h2 id="toolTitle"></h2><button type="button" data-close="toolDialog" aria-label="Close">×</button></div><form id="toolForm"><input id="toolId" type="hidden"><div class="form-grid"><label class="full"><span id="nameLabel"></span><input id="toolName" required maxlength="100"></label><label class="full"><span id="urlLabel"></span><input id="toolUrl" type="url" required placeholder="https://…"></label><label><span id="groupLabel"></span><select id="toolGroup"></select></label></div><div class="ac-bar"><button class="primary" id="saveTool" type="submit"></button><button class="danger" id="deleteTool" type="button"></button></div></form></dialog>
<dialog id="summaryDialog"><div class="dialog-head"><h2 id="summaryTitle"></h2><button type="button" data-close="summaryDialog" aria-label="Close">×</button></div><p id="summaryTime" role="status"></p><p id="summaryExplanation" class="ac-muted"></p><div id="summaryContent"></div><div class="ac-bar"><button id="summaryRefresh"></button></div></dialog></body></html>
